      "hi": {
        "title": "ओडिशा में 7,268 सरकारी पदों पर भर्ती — 4,219 सिर्फ़ कांस्टेबल के, 12 नवंबर से पहले करें आवेदन",
        "summary": "ओडिशा यूनिफॉर्म्ड सर्विसेज स्टाफ सिलेक्शन कमीशन ने संयुक्त वर्दीधारी सेवा परीक्षा 2026 के तहत 7,268 पदों के लिए अधिसूचना जारी की है। आवेदन 23 अक्टूबर से शुरू हैं और अंतिम तिथि 12 नवंबर है।",
        "body": "ओडिशा यूनिफॉर्मड सर्विसेज स्टाफ सिलेक्शन कमीशन (OUSSSC) ने पुलिस, ओडिशा औद्योगिक सुरक्षा बल और अग्निशमन सेवाओं में 7,268 पदों के लिए अधिसूचना जारी की है। ये पद संयुक्त वर्दीधारी सेवा (स्नातक स्तर से नीचे) परीक्षा, 2026 के माध्यम से भरे जाएंगे। ऑनलाइन आवेदन आयोग की वेबसाइट osssc.odisha.gov.in पर 23 अक्टूबर से स्वीकार किए जा रहे हैं और आवेदन पत्र और शुल्क दोनों के लिए अंतिम तिथि 12 नवंबर 2026 को रात 10 बजे है। यह स्नातक स्तर से नीचे की भर्ती है, इसलिए शैक्षणिक योग्यता पद के अनुसार कक्षा 10 से +2 (माध्यमिक) तक है।\n\nरिक्तियां पदों की सात श्रेणियों में बंटी हैं। कांस्टेबल (सिविल), यानी थाना, गश्त और बीट ड्यूटी पर तैनात नियमित जिला पुलिस कांस्टेबल, के 4,219 पद हैं। औद्योगिक प्रतिष्ठानों और महत्वपूर्ण संस्थानों की रखवाली करने वाले ओडिशा औद्योगिक सुरक्षा बल (OISF) में कांस्टेबल के 2,212 पद हैं। पुलिस के बेतार और रेडियो संचार नेटवर्क के लिए कांस्टेबल (संचार) के 300 पद हैं। अग्निशमन सेवाओं में फायरफाइटर के 317 पद और फायरफाइटर ड्राइवर के 62 पद हैं, जिनमें ड्राइवर अग्निशमन और बचाव वाहन चलाते हैं। पुलिस मोटर परिवहन शाखा में ड्राइवर (PMT) के 154 पद हैं, जो पुलिस के वाहन चलाती और उनका रखरखाव करती है, और शहरों में यातायात नियंत्रित करने वाले ट्रैफिक कांस्टेबल के 4 पद हैं।\n\nआयु 1 जनवरी 2026 को गिनी जाएगी और ऊपरी आयु सीमा में आरक्षित श्रेणियों के उम्मीदवारों के लिए नियमों के अनुसार छूट लागू होगी, जैसा अधिसूचना में विस्तृत है। पद के अनुसार पात्रता इस प्रकार है: कांस्टेबल (सिविल) — आयु 18 से 26 वर्ष, शिक्षा +2; कांस्टेबल (संचार) — आयु 18 से 23 वर्ष, शिक्षा भौतिकी, रसायन विज्ञान, गणित, कंप्यूटर विज्ञान, आईटी, सांख्यिकी, इलेक्ट्रॉनिक्स या समकक्ष तकनीकी विषय के साथ विज्ञान में +2; कांस्टेबल (OISF) — आयु 18 से 23 वर्ष, शिक्षा कक्षा 10; फायरफाइटर — आयु 18 से 25 वर्ष, शिक्षा +2; फायरफाइटर ड्राइवर — आयु 18 से 25 वर्ष, शिक्षा +2; ड्राइवर (PMT) — आयु 18 से 25 वर्ष, शिक्षा कक्षा 10; और ट्रैफिक कांस्टेबल — आयु 21 से 32 वर्ष, शिक्षा +2। ड्राइविंग पदों, ड्राइवर (PMT) और फायरफाइटर ड्राइवर, के लिए संबंधित वाहन वर्ग के लिए अधिसूचना में निर्दिष्ट ड्राइविंग लाइसेंस भी चाहिए और उम्मीदवारों को आवेदन करने से पहले उसके वर्ग और वैधता की जांच कर लेनी चाहिए।\n\nउम्मीदवारों को अधिसूचना में निर्धारित शारीरिक मानक भी अपनी श्रेणी के अनुसार पूरे करने होंगे। अनारक्षित और एसईबीसी श्रेणियों के पुरुषों के लिए न्यूनतम ऊंचाई 168 सेमी, न्यूनतम वजन 55 किलोग्राम है और छाती बिना फैलाए 79 सेमी से फैलाकर 84 सेमी होनी चाहिए। इन्हीं श्रेणियों की महिलाओं के लिए न्यूनतम ऊंचाई 158 सेमी और वजन 47.5 किलोग्राम है। अनुसूचित जाति और अनुसूचित जनजाति के उम्मीदवारों के लिए पुरुषों की ऊंचाई 163 सेमी और वजन 50 किलोग्राम होना चाहिए, छाती 76 से 81 सेमी के साथ, और महिलाओं की ऊंचाई 153 सेमी और वजन 45 किलोग्राम होना चाहिए। अधिसूचना उन चिकित्सा स्थितियों को भी सूचीबद्ध करती है जो अयोग्य ठहराती हैं — घुटनों का टकराना (नॉक नीज), धनुष पैर (बो लेग्स), सपाट पैर (फ्लैट फीट), वैरिकोज नसें, भेंगापन (स्क्विंट) और रंग अंधापन (कलर ब्लाइंडनेस) उनमें नामित हैं — और उम्मीदवारों को उस सेवा के कर्तव्यों के लिए चिकित्सकीय रूप से फिट होना चाहिए जिसमें वे प्रवेश करते हैं।\n\nपद अधिसूचना में बताए अनुसार अनुसूचित जाति, अनुसूचित जनजाति, एसईबीसी और महिलाओं सहित अन्य हकदार श्रेणियों के लिए ओडिशा के आरक्षण प्रावधानों के अधीन हैं और अधिसूचना में पदों का जिला-वार और बटालियन-वार विभाजन भी दिया गया है। वेतन पर, पद राज्य वेतन मैट्रिक्स के स्तर 4 और 5 पर रखे गए हैं और मूल वेतन के अलावा महंगाई और अन्य भत्ते तथा नियमित राज्य सरकारी रोजगार से जुड़े सेवा लाभ मिलेंगे।\n\nचयन कई चरणों में होगा। पहला चरण लिखित परीक्षा है, जिसका विस्तृत पाठ्यक्रम अधिसूचना में दिया गया है। उसे पास करने वाले उम्मीदवार शारीरिक माप परीक्षण, यानी ऊपर दिए गए मानकों की जांच, और शारीरिक दक्षता परीक्षणों में जाएंगे, जिनमें अधिसूचना में निर्धारित दौड़ और शारीरिक प्रदर्शन की घटनाएं शामिल हैं। ड्राइविंग पदों के लिए अतिरिक्त रूप से ड्राइविंग परीक्षण होगा। अंतिम चरण चिकित्सा परीक्षा और दस्तावेज सत्यापन हैं, जहां आवेदन पत्र के हर दावे के पीछे के प्रमाणपत्र — आयु, शिक्षा, श्रेणी और ड्राइविंग पदों के लिए निर्धारित वर्ग का लाइसेंस — मूल रूप में प्रस्तुत किए जाएंगे और जांचे जाएंगे। इनमें जन्म तिथि साबित करने वाला कक्षा 10 का प्रमाणपत्र या बोर्ड रिकॉर्ड, दावा की गई शिक्षा के पास प्रमाणपत्र और अंक पत्र तथा सक्षम प्राधिकारी द्वारा जारी श्रेणी प्रमाणपत्र शामिल हैं।\n\nआवेदन पूरी तरह ऑनलाइन है। उम्मीदवारों को osssc.odisha.gov.in पर बुनियादी पंजीकरण पूरा करना होगा, बनाए गए क्रेडेंशियल से लॉग इन करना होगा, व्यक्तिगत और शैक्षणिक विवरण के साथ प्रोफाइल भरनी होगी, निर्धारित तरीके से फोटो, हस्ताक्षर, अंगूठे का निशान और दस्तावेज अपलोड करने होंगे, आवेदन किए जा रहे पद या पदों का चयन करना होगा और पसंदीदा परीक्षा जिले बताने होंगे, निर्धारित आवेदन शुल्क का भुगतान करना होगा और फॉर्म जमा करना होगा। जमा करने के बाद प्रिंटआउट या रसीद आवेदन के रिकॉर्ड के रूप में सुरक्षित रखनी चाहिए। दर्ज किया गया हर विवरण आधिकारिक दस्तावेजों से बिल्कुल मेल खाना चाहिए, क्योंकि विसंगतियां दस्तावेज सत्यापन पर सामने आती हैं, और अंतिम जमा करने के बाद कोई बदलाव संभव नहीं है। इस परीक्षा के लिए आवेदन केवल आयोग के आधिकारिक पोर्टल पर मौजूद है और प्रक्रिया में एकमात्र पैसा उसी के माध्यम से देय निर्धारित आवेदन शुल्क है, इसलिए उम्मीदवारों को 12 नवंबर की अंतिम तिथि का इंतजार किए बिना जल्दी आवेदन करना चाहिए और आवेदन दाखिल करने या चयन सुनिश्चित करने की पेशकश करने वाली वेबसाइटों, एजेंटों और मध्यस्थों से बचना चाहिए।"
      },
      "en": {
        "title": "7,268 Odisha Government Posts Open — 4,219 of Them for Civil Constable; Apply Before November 12",
        "summary": "The Odisha Uniformed Services Staff Selection Commission has notified 7,268 vacancies under the Combined Uniformed Services Examination 2026, including 4,219 Civil Constable posts. Applications, which began on October 23, close on November 12.",
        "body": "The Odisha Uniformed Services Staff Selection Commission (OUSSSC) has notified 7,268 posts across the police, the Odisha Industrial Security Force and the fire services, to be filled through the Combined Uniformed Services (Below Graduate Level) Examination, 2026. Online applications are being accepted on the commission's website, osssc.odisha.gov.in, from October 23, and the window closes at 10 pm on November 12, 2026, for both the application form and the fee. It is a below-graduate-level recruitment, so the educational bar ranges from Class 10 to +2 (intermediate), depending on the post.\n\nThe vacancies are divided among seven categories. Constable (Civil), the regular district police constable on station, patrol and beat duty, accounts for 4,219 posts. Constable in the Odisha Industrial Security Force (OISF), which guards industrial establishments and vital installations, accounts for 2,212 posts. Constable (Communication), for the police wireless and radio communications network, accounts for 300 posts. The fire services account for 317 Firefighter posts and 62 Firefighter Driver posts, the drivers driving the fire tenders and rescue vehicles. Driver (PMT) in the Police Motor Transport wing, which drives and maintains police vehicles, accounts for 154 posts, and Traffic Constable, which regulates traffic movement in the cities, accounts for 4 posts.\n\nAge is reckoned as on January 1, 2026, and the upper age limit is relaxed for candidates of reserved categories in accordance with the rules, as detailed in the notification. Post by post, the eligibility is: Constable (Civil) — age 18 to 26, education +2; Constable (Communication) — age 18 to 23, education +2 in Science with Physics, Chemistry, Mathematics, Computer Science, IT, Statistics, Electronics or an equivalent technical subject; Constable (OISF) — age 18 to 23, education Class 10; Firefighter — age 18 to 25, education +2; Firefighter Driver — age 18 to 25, education +2; Driver (PMT) — age 18 to 25, education Class 10; and Traffic Constable — age 21 to 32, education +2. The driving posts, Driver (PMT) and Firefighter Driver, additionally require the driving licence specified in the notification for the class of vehicle involved, and candidates should verify its class and validity before applying.\n\nCandidates must also meet the physical standards prescribed in the notification, measured against the category they belong to. For men of the unreserved and SEBC categories, the minimum height is 168 cm, the minimum weight 55 kg, and the chest must measure 79 cm unexpanded to 84 cm expanded. For women of the same categories, the minima are 158 cm in height and 47.5 kg in weight. For Scheduled Caste and Scheduled Tribe candidates, men must measure 163 cm in height and 50 kg in weight, with the chest at 76 to 81 cm, and women must measure 153 cm in height and 45 kg in weight. The notification also lists medical conditions that disqualify — knock knees, bow legs, flat feet, varicose veins, squint and colour blindness are named among them — and candidates must be medically fit for the duties of the service they enter.\n\nThe posts are subject to Odisha's reservation provisions for Scheduled Castes, Scheduled Tribes, SEBC and other entitled categories, including women, as set out in the notification, and the notification also carries a district-wise and battalion-wise break-up of the posts. On pay, the posts are placed at Levels 4 and 5 of the state pay matrix, carrying, beyond basic pay, dearness and other allowances and the service benefits that attach to regular state government employment.\n\nSelection runs in stages. The first stage is a written examination, whose detailed syllabus is carried in the notification. Those who clear it proceed to the physical measurement test, on the standards above, and the physical efficiency tests, the events of running and physical performance prescribed in the notification. For the driving posts, there is additionally a driving test. The final stages are medical examination and document verification, where the certificates behind every claim in the application form — age, education, category and, for the driving posts, the licence of the prescribed class — are produced in original and checked, including the Class 10 certificate or board record that proves date of birth, the pass certificates and mark sheets behind the education claimed, and the category certificate issued by the competent authority.\n\nThe application is entirely online. Candidates must complete the basic registration on osssc.odisha.gov.in, log in with the credentials created, fill in the profile with personal and educational details, upload the photograph, signature, thumb impression and documents in the prescribed manner, select the post or posts being applied for and state the preferred examination districts, pay the prescribed application fee, and submit the form, keeping the printout or receipt safely as the record of the application. Every detail entered must match the official documents exactly, as discrepancies surface at document verification, and no changes are possible after final submission. The application exists only on the commission's official portal, and the only money the process asks for is the prescribed application fee payable through it, so candidates should apply early rather than against the November 12 deadline and avoid websites, agents and intermediaries offering to file applications or assure selection."
      }

        "title": "रिलीज़ से पहले ही 20 करोड़ पार: रामायण की एडवांस बुकिंग में बिक चुके 2.25 लाख टिकट",
        "summary": "रणबीर कपूर और यश अभिनीत रामायण की एडवांस बुकिंग ने दुनिया भर में 20 करोड़ रुपये से ज्यादा की कमाई कर ली है। नितेश तिवारी निर्देशित यह फिल्म दीवाली सप्ताह में 5 नवंबर को रिलीज होगी, जबकि 4 नवंबर को पेड प्रीव्यू होंगे।",

ion of the ticket price between the cinemas that show a film and the distributors who supply it. The distributors were demanding 60 per cent of net collections in the first week, 50 per cent in the second and 40 per cent in the third, against the terms exhibitors described as the industry's usual 52.5 per cent, 45 per cent and 37.5 per cent for the same weeks. Exhibitors, per the report, were reluctant to accept the enhanced terms, and negotiations were under way even as the overseas windows opened on schedule."

/* ---------- feed validation + normalization (Phase 3) ----------
   Feed schema (live + bundled): { id, category, sub, breaking, featured,
   trending, publishedAt, source, image, hi:{title,summary,body},
   en:{title,summary,body} }. normalizeArticle() usi schema ko app ke
   internal card/article shape me badalta hai. */
/* Photo rule (fix, 2026-10-27): har story SIRF apni asal photo dikhati hai.
   Jis story ki apni image na ho, us par kisi dusri khabar ya category ki
   photo NAHI lagti — pehle category-photo fallback ki wajah se ek hi photo
   (jaise India = Taj Mahal) baar-baar har bina-photo wali khabar par dikhti
   thi. Bina photo wali story par card ke peeche ka PrimeFeed brand tile
   (category ke rang me "P" + category naam) dikhta hai — kabhi koi galat ya
   duhrai hui photo nahi, kabhi broken-image box nahi. */
function pfHasBody(x){
  if (!x) return false;
  var b = x.body;
  if (typeof b==="string") return b.trim().length>0;
  if (b && typeof b.length==="number") return b.length>0;
  return false;
}
function validArticle(a){
  return !!a && typeof a.id==="string" && a.id.length>0 && typeof a.category==="string" &&
    !!a.hi && typeof a.hi.title==="string" && a.hi.title.length>0 &&
    !!a.en && typeof a.en.title==="string" && a.en.title.length>0 &&
    typeof a.publishedAt==="string" && a.publishedAt.length>0 && !isNaN(Date.parse(a.publishedAt)) &&
    (pfHasBody(a.hi) || pfHasBody(a.en));
}
function validFeed(d){
  return !!d && Object.prototype.toString.call(d.articles)==="[object Array]" && d.articles.filter(validArticle).length>0;
}
/* vc35 (1.8.8): lite feed validation — lite articles me body NAHI hoti
   (sirf title + summary), isliye validArticle ka body wala hissa yahan
   lagu nahi hota; baaki saari checks waisi hi sakht hain. */
function validLiteArticle(a){
  return !!a && typeof a.id==="string" && a.id.length>0 && typeof a.category==="string" &&
    !!a.hi && typeof a.hi.title==="string" && a.hi.title.length>0 &&
    !!a.en && typeof a.en.title==="string" && a.en.title.length>0 &&
    typeof a.publishedAt==="string" && a.publishedAt.length>0 && !isNaN(Date.parse(a.publishedAt));
}
function validLiteFeed(d){
  return !!d && Object.prototype.toString.call(d.articles)==="[object Array]" && d.articles.filter(validLiteArticle).length>0;
}
function catIdOf(name){
  var raw = String(name||"").trim(), n = raw.toLowerCase();
  for (var i=0;i<CATS.length;i++){ if (CATS[i].en.toLowerCase()===n || CATS[i].hi===raw) return CATS[i].id; }
  return "others";
}
function subIdOf(catId, name){
  var arr = SUBCATS[catId]||[], raw = String(name||"").trim(), n = raw.toLowerCase();
  for (var j=0;j<arr.length;j++){ if (arr[j].en.toLowerCase()===n || arr[j].hi===raw) return arr[j].id; }
  return "others";
}
/* ---------- purani → nayi category migration ----------
   Live feed aur bundled snapshot me purane naam aa sakte hain; koi bhi
   publish hui khabar nayi list ke neeche gayab na ho, isliye har khabar
   normalize hote waqt yahi se guzarti hai:
     "Sports" → Cricket & Sports (sports)   • "State" → State & Local (state)
     "Viral" → Viral & Trending (viral)     • India + sub Weather → Weather
     Others + sub Government Schemes → Government Schemes
     Others + sub Agriculture → Agriculture • Auto → Business (sub: Auto)
     Travel → Lifestyle (sub: Travel)       • baaki purani "Others" khabrein
   apna "others" tag rakhti hain — Home/Search me dikhti rehti hain. */
var LEGACY_CAT_NAMES = { sports:"Sports", state:"State", viral:"Viral", auto:"Auto", travel:"Travel", others:"Others" };
function legacyCatIdOf(name){
  var raw = String(name||"").trim(), n = raw.toLowerCase();
  for (var k in LEGACY_CAT_NAMES){ if (LEGACY_CAT_NAMES[k].toLowerCase()===n) return k; }
  if (n==="राज्य") return "state"; if (n==="खेल") return "sports"; if (n==="वायरल") return "viral";
  if (n==="ऑटो") return "auto"; if (n==="यात्रा") return "travel"; if (n==="अन्य") return "others";
  return null;
}
function legacySubIdOf(catId, name){
  var arr = LEGACY_SUBCATS[catId]||[], raw = String(name||"").trim(), n = raw.toLowerCase();
  for (var j=0;j<arr.length;j++){ if (arr[j].en.toLowerCase()===n || arr[j].hi===raw) return arr[j].id; }
  return null;
}
function resolveCatSub(rawCat, rawSub){
  var leg = legacyCatIdOf(rawCat);
  if (leg==="india" || catIdOf(rawCat)==="india" && leg===null){
    if (legacySubIdOf("india", rawSub)==="weather") return { cat:"weather", sub:subIdOf("weather", rawSub) };
  }
  if (leg==="others"){
    var ls = legacySubIdOf("others", rawSub);
    if (ls==="govtschemes") return { cat:"govtschemes", sub:"others" };
    if (ls==="agriculture") return { cat:"agriculture", sub:"others" };
    return { cat:"others", sub:"others" };
  }
  if (leg==="auto") return { cat:"business", sub:"auto" };
  if (leg==="travel") return { cat:"lifestyle", sub:"travel" };
  var nid = catIdOf(rawCat);
  if (nid!=="others") return { cat:nid, sub:subIdOf(nid, rawSub) };
  if (leg) return { cat:leg, sub:subIdOf(leg, rawSub) };
  return { cat:"others", sub:"others" };
}
var MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MON_HI = ["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
function fmtStamp(iso, lang){
  var d = new Date(iso); if (isNaN(d.getTime())) return "";
  var h = d.getHours(), m = d.getMinutes(), mm = (m<10?"0":"")+m, h12 = h%12; if (h12===0) h12 = 12;
  if (lang==="hi"){
    var part = h<12 ? "सुबह" : (h<16 ? "दोपहर" : (h<20 ? "शाम" : "रात"));
    return d.getDate()+" "+MON_HI[d.getMonth()]+" "+d.getFullYear()+", "+part+" "+h12+":"+mm;
  }
  return d.getDate()+" "+MON_EN[d.getMonth()]+" "+d.getFullYear()+", "+h12+":"+mm+" "+(h<12?"AM":"PM");
}
function relTime(iso, lang){
  var d = new Date(iso); if (isNaN(d.getTime())) return "";
  var mins = Math.max(1, Math.round((Date.now()-d.getTime())/60000));
  if (mins < 60) return lang==="hi" ? mins+" मिनट पहले" : mins+" min ago";
  var hrs = Math.round(mins/60);
  if (hrs < 24) return lang==="hi" ? hrs+" घंटे पहले" : (hrs===1 ? "1 hour ago" : hrs+" hours ago");
  var days = Math.round(hrs/24);
  return lang==="hi" ? days+" दिन पहले" : (days===1 ? "1 day ago" : days+" days ago");
}
function kwOf(title, extra){
  var words = String(title||"").replace(/[।,;:!?()\[\]"“”'«»—–-]/g," ").split(/\s+/).filter(function(w){ return w.length>2; });
  return words.concat(extra||[]).slice(0,16);
}
function normLang(x, extraKw){
  x = x || {};
  return { title: x.title||"", ex: x.summary||"",
    body: String(x.body||"").split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(function(p){ return p.length>0; }),
    kw: kwOf(x.title, extraKw) };
}
function normalizeArticle(raw){
  var cs = resolveCatSub(raw.category, raw.sub);
  var catId = cs.cat;
  var subId = cs.sub;
  var c = catById(catId);
  var subBoth = ""; (SUBCATS[catId]||[]).forEach(function(sb){ if (sb.id===subId) subBoth = sb.en+" "+sb.hi; });
  var distName = (typeof raw.district==="string" && raw.district) ? raw.district : "";
  var extra = [c.en, c.hi, subBoth, distName];
  return {
    id: raw.id, cat: catId, sub: subId, district: distName,
    img: (typeof raw.image==="string" && raw.image) ? raw.image : "",
    breaking: !!raw.breaking, featured: !!raw.featured, trending: !!raw.trending,
    source: (typeof raw.source==="string" && raw.source) ? raw.source : "PrimeFeed Desk",
    audioHi: (typeof raw.audioHi==="string" && raw.audioHi) ? raw.audioHi : null,
    audioEn: (typeof raw.audioEn==="string" && raw.audioEn) ? raw.audioEn : null,
    publishedAt: raw.publishedAt,
    time: relTime(raw.publishedAt, "en"), timeHi: relTime(raw.publishedAt, "hi"),
    stamp: fmtStamp(raw.publishedAt, "en"), stampHi: fmtStamp(raw.publishedAt, "hi"),
    hi: normLang(raw.hi, extra), en: normLang(raw.en, extra)
  };
}
/* ---------- duplicate guard ----------
   Ek hi khabar feed me do baar aa jaye (wahi id dobara, ya wahi headline
   naye id ke saath dobara publish ho jaye) to ARTICLES me sirf pehli
   (sabse nayi) copy rehti hai — warna wahi khabar Home par kai baar
   dikhti thi (malik ki shikayat, 2026-10-28). */
function pfTitleKey(a){
  var s = ((a.hi && a.hi.title) || "") + "|" + ((a.en && a.en.title) || "");
  return s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").replace(/\s+/g, " ").trim();
}
function dedupeArticles(list){
  var seenId = {}, seenTitle = {}, out = [];
  list.forEach(function(a){
    if (!a || seenId[a.id]) return;
    var k = pfTitleKey(a);
    if (k && seenTitle[k]) return;
    seenId[a.id] = 1; if (k) seenTitle[k] = 1;
    out.push(a);
  });
  return out;
}
var ARTICLES = dedupeArticles(BUNDLED_FEED.articles.filter(validArticle).map(normalizeArticle).sort(function(x,y){ return Date.parse(y.publishedAt)-Date.parse(x.publishedAt); }));
var feedState = "bundled";
function artById(id){ for (var i=0;i<ARTICLES.length;i++) if (ARTICLES[i].id===id) return ARTICLES[i]; return null; }
function artsByCat(id){ if (id==="district") return artsByDistrict(); return ARTICLES.filter(function(a){ return a.cat===id; }); }
/* ---------- My District: dynamic category from the user's chosen district ----------
   Feed articles can carry a `district` field (exact district name, e.g. "Gonda").
   A story also belongs to the district when the district name appears in its
   title / summary / body — so Desk stories tagged only by text still land here.
   The category exists only when the user has picked a district (PREFS.district). */
function districtCatObj(){
  var d = (typeof PREFS!=="undefined" && PREFS.district) ? PREFS.district : "";
  return { id:"district", hi:"मेरा ज़िला", en:"My District", color:"#e8590c", mono:"जि", districtName:d };
}
function districtLabel(){
  var d = (typeof PREFS!=="undefined" && PREFS.district) ? PREFS.district : "";
  return d ? (t("myDistrict")+" • "+d) : t("myDistrict");
}
function artsByDistrict(){
  var d = (typeof PREFS!=="undefined" && PREFS.district) ? String(PREFS.district).trim() : "";
  if (!d) return [];
  var dl = d.toLowerCase();
  /* Whole-word match: district ka naam text me tabhi mana jayega jab wo
     PURA shabd/phrase ho — dono taraf non-alphanumeric character ya
     text ka start/end. Plain substring search se "Kamle" district
     "Kamlesh" naam ke andar chhup kar galat match ho jata tha.
     Multi-word naam (jaise "Kamrup Metro") poore phrase par wahi
     boundary rule lagta hai. */
  var esc = dl.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var wordRe = new RegExp("(^|[^a-z0-9])" + esc + "([^a-z0-9]|$)");
  function hasWholeWord(txt){ return wordRe.test(String(txt || "").toLowerCase()); }
  return ARTICLES.filter(function(a){
    if (a.district && String(a.district).trim().toLowerCase()===dl) return true;
    var hay = ((a.hi && a.hi.title)||"")+" "+((a.hi && a.hi.ex)||"")+" "+((a.en && a.en.title)||"")+" "+((a.en && a.en.ex)||"");
    if (hasWholeWord(hay)) return true;
    var bodyTxt = ((a.hi && a.hi.body)||[]).join(" ")+" "+((a.en && a.en.body)||[]).join(" ");
    return hasWholeWord(bodyTxt);
  });
}

<script>
/* ---------- persistent state (localStorage) ---------- */
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var S = {
  lang: lsGet("pf_lang", PF_CONFIG.defaultLang),
  theme: lsGet("pf_theme", "light"),
  bookmarks: lsGet("pf_bookmarks", []),
  history: lsGet("pf_history", []),
  recents: lsGet("pf_recents", []),
  readCats: lsGet("pf_readcats", []),
  notif: lsGet("pf_notif", { breaking:true, top:true, sports:true, tech:false, ent:false }),
  fontIdx: lsGet("pf_font", 1),
  readNotifs: lsGet("pf_readnotifs", [])
};
function saveAll(){ lsSet("pf_lang",S.lang); lsSet("pf_theme",S.theme); lsSet("pf_bookmarks",S.bookmarks); lsSet("pf_history",S.history); lsSet("pf_recents",S.recents); lsSet("pf_readcats",S.readCats); lsSet("pf_notif",S.notif); lsSet("pf_font",S.fontIdx); lsSet("pf_readnotifs",S.readNotifs); }

/* ---------- onboarding preferences (single pf_prefs object) ---------- */
function pfDefaultPrefs(){ return { done:false, name:"", state:"", district:"", langMode:"hi", interests:["india","sports","entertainment"] }; }
var PREFS = (function(){
  var d = pfDefaultPrefs();
  var p = lsGet("pf_prefs", null);
  if (p && typeof p === "object"){
    if (typeof p.done === "boolean") d.done = p.done;
    if (typeof p.name === "string") d.name = p.name;
    if (typeof p.state === "string") d.state = p.state;
    if (typeof p.district === "string") d.district = p.district;
    if (p.langMode==="hi" || p.langMode==="en") d.langMode = p.langMode;
    if (Object.prototype.toString.call(p.interests) === "[object Array]") d.interests = p.interests.filter(function(x){ return typeof x === "string" && CATS.some(function(c){ return c.id===x; }); });
  } else if (S.lang==="hi" || S.lang==="en"){ d.langMode = S.lang; }
  if (lsGet("pf_onboarded_v1", false)) d.done = true;
  return d;
})();
function savePrefs(){ lsSet("pf_prefs", PREFS); if (PREFS.done) lsSet("pf_onboarded_v1", true); }
function setLangMode(mode){
  if (mode!=="hi" && mode!=="en") mode = "hi";
  PREFS.langMode = mode;
  S.lang = mode; /* sirf do bhashaayein: "hi" ya "en" */
  lsSet("pf_lang", S.lang);
  savePrefs();
}
S.lang = (PREFS.langMode==="en") ? "en" : "hi";
function t(k){ return (STR[S.lang] && STR[S.lang][k]) || STR.en[k] || k; }
function tagline(){ return S.lang==="hi" ? PF_CONFIG.taglineHi : PF_CONFIG.taglineEn; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function A(a){ return a[S.lang]; }
function timeOf(a){
  /* Card ka time label (malik ki farmaish, 2026-10-29): AAJ ke calendar
     din (raat 12 baje ke baad se) ki khabar par relative samay
     ("2 घंटे पहले" / "2 hours ago") hi rehta hai. Jaise hi khabar ka
     din kal ya usse purana ho jaye — chahe wo sirf 10 ghante purani
     hi kyun na ho — label par uski DATE aati hai ("28 अक्टूबर" /
     "28 Oct"). Ye sirf list cards ke label ke liye hai; article
     screen ka stamp (stampOf) aur Today heading ka clock alag hain,
     wo nahi badle. */
  var d = new Date(a.publishedAt);
  if (!isNaN(d.getTime())){
    var startToday = new Date(); startToday.setHours(0,0,0,0);
    if (d.getTime() < startToday.getTime())
      return S.lang==="hi" ? d.getDate()+" "+MON_HI[d.getMonth()] : d.getDate()+" "+MON_EN[d.getMonth()];
  }
  return S.lang==="hi" ? a.timeHi : a.time;
}
function stampOf(a){ return S.lang==="hi" ? a.stampHi : a.stamp; }
function catName(c){ return c[S.lang]; }
function isSaved(id){ return S.bookmarks.indexOf(id) >= 0; }

function skelRow(){ return '<div class="skel" style="border-radius:14px;"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>'; }
function stateHTML(kind){
  if (kind==="empty") return '<div class="state-box"><div class="sic">'+IC.inbox+'</div><h3>'+t("emptyTitle")+'</h3><p>'+t("emptySub")+'</p><button class="btn-red" data-go="home">'+t("backToHome")+'</button></div>';

}
function appbarHTML(title, opts){

                       : '<button class="icon-btn" data-act="drawer" aria-label="menu">'+IC.menu+'</button>';

function toast(msg){
  var el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._tm); toast._tm = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

/* ---------- notifications: feed articles se banti hain (breaking pehle) ---------- */
var NOTIFS = [];
function buildNotifs(){
  var seen = {}, list = [];
  /* Notification preference switches (S.notif, pf_notif) sach me laagu:
     har notification apni mapped category se bandhi hai — breaking
     khabar → "breaking", featured → "top", Cricket & Sports → "sports",
     Technology → "tech", Entertainment → "ent". Jiski setting band
     hai, wo notification list me aati hi nahi. Koi mapping na ho
     (baaki khabrein) to wo hamesha dikhti hai. */
  function mappedKey(a){
    if (a.breaking) return "breaking";
    if (a.featured) return "top";
    if (a.cat === "sports") return "sports";
    if (a.cat === "technology") return "tech";
    if (a.cat === "entertainment") return "ent";
    return null;
  }
  function push(a){
    if (!a || seen[a.id] || list.length >= 5) return;
    var mk = mappedKey(a);
    if (mk && S.notif && S.notif[mk] === false) return;
    seen[a.id] = 1;
    list.push({ id:"n_"+a.id, art:a.id, key: mk || "top" });
  }
  ARTICLES.filter(function(a){ return a.breaking; }).forEach(push);
  ARTICLES.filter(function(a){ return a.featured; }).forEach(push);
  ARTICLES.filter(function(a){ return a.trending; }).forEach(push);
  ARTICLES.forEach(push);
  NOTIFS = list;
}
buildNotifs();
function unreadCount(){ return NOTIFS.filter(function(n){ return S.readNotifs.indexOf(n.id)<0; }).length; }

/* ---------- live feed: fetch + cache + fallback (Phase 3) ---------- */
var FEED_CACHE_KEY = "pf_feed_cache_v1";
var LITE_CACHE_KEY = "pf_lite_cache_v1";
var appEntered = false;
function setArticles(rawList, state){
  ARTICLES = dedupeArticles(rawList.filter(validArticle).map(normalizeArticle).sort(function(x,y){ return Date.parse(y.publishedAt)-Date.parse(x.publishedAt); }));
  feedState = state;
  buildNotifs();
}
/* vc35 (1.8.8): lite feed merge — lite list ARTICLES ko taaza karti hai
   (headlines turant dikhte hain), lekin jo bodies pehle se loaded hain
   (full feed / cache se) wo lite copy me carry over ho jaati hain,
   taaki khuli hui khabar ka text gayab na ho. Lite me na aayi hui
   purani entries bhi rehti hain (union) — full feed peeche se aakar
   list ko final roop deta hai. */
function articleHasBody(a){ return !!a && ((a.hi && a.hi.body && a.hi.body.length>0) || (a.en && a.en.body && a.en.body.length>0)); }
function setLiteArticles(rawList, state){
  var curById = {};
  ARTICLES.forEach(function(x){ curById[x.id] = x; });
  var merged = rawList.filter(validLiteArticle).map(function(raw){
    var n = normalizeArticle(raw);
    var old = curById[n.id];
    if (old && !articleHasBody(n) && articleHasBody(old)){ n.hi.body = old.hi.body; n.en.body = old.en.body; }
    return n;
  });
  var inLite = {};
  merged.forEach(function(x){ inLite[x.id] = 1; });
  ARTICLES.forEach(function(x){ if (!inLite[x.id]) merged.push(x); });
  ARTICLES = dedupeArticles(merged.sort(function(x,y){ return Date.parse(y.publishedAt)-Date.parse(x.publishedAt); }));
  feedState = state;
  buildNotifs();
}
function finishFeedLoad(){
  if (!appEntered) return;
  if (cur.screen === "home"){ homeLoaded = true; renderHome(); }
  else go(cur.screen, cur.param, true);
  pfTryOpenPending(); /* ?open=<id> / pending notification article — feed aate hi kholo */
}
function feedFallback(manual){
  var c = lsGet(FEED_CACHE_KEY, null);
  if (c && validFeed(c) && feedState === "bundled"){ if (c.updatedAt) pfFeedUpdatedAt = c.updatedAt; setArticles(c.articles, "cached"); }
  if (feedState === "bundled"){ var lc = lsGet(LITE_CACHE_KEY, null); if (lc && validLiteFeed(lc)){ if (lc.updatedAt) pfLiteUpdatedAt = lc.updatedAt; setLiteArticles(lc.articles, "cached"); } }
  if (manual) toast(t("offlineTitle"));
  finishFeedLoad();
}
/* ---------- auto refresh: ek poller + foreground, shared loadFeed path ----------
   Malik ki farmaish (2026-10-29): "Bina refresh kare news aani
   chahiye" — app khula ho to nayi publish hui khabar khud list me aa
   jaye; user ko refresh/pull na karna pade. Isi liye poll har 60
   second me chalta hai + app foreground/focus par turant ek check.
   pfFeedFetching = overlap guard (koi bhi do fetch ek saath nahi).
   pfFeedUpdatedAt = abhi loaded feed ka updatedAt; nayi feed se tulna
   isi se + article ids se hoti hai. Kuch naya ho tabhi re-render hota
   hai, active selection (All / Today / date chip) jaisa hai waisa hi
   rehta hai, aur pfAutoRender scroll anchor se user ki padhne ki
   jagah bhi nahi hilti. */
var pfFeedFetching = false;
var pfFeedUpdatedAt = (typeof BUNDLED_FEED !== "undefined" && BUNDLED_FEED && BUNDLED_FEED.updatedAt) || null;
/* vc35 (1.8.8): lite feed ki alag tracking — pfLiteUpdatedAt = abhi
   loaded lite feed ka updatedAt; pfFullFetching = full (bodies wali)
   feed ke background fetch ka apna overlap guard. */
var pfLiteUpdatedAt = null;
var pfFullFetching = false;
function pfLiteHasNew(d, arts){
  if (d && d.updatedAt && pfLiteUpdatedAt && d.updatedAt !== pfLiteUpdatedAt) return true;
  if (d && d.updatedAt && !pfLiteUpdatedAt) return true;
  var old = {}; for (var i = 0; i < ARTICLES.length; i++) old[ARTICLES[i].id] = 1;
  for (var j = 0; j < arts.length; j++){ if (!old[arts[j].id]) return true; }
  return false;
}
var pfAutoTimer = null;
function pfFeedHasNew(d, arts){
  if (d && d.updatedAt && pfFeedUpdatedAt && d.updatedAt !== pfFeedUpdatedAt) return true;
  var old = {}; for (var i = 0; i < ARTICLES.length; i++) old[ARTICLES[i].id] = 1;
  for (var j = 0; j < arts.length; j++){ if (!old[arts[j].id]) return true; }
  if (d && d.updatedAt && !pfFeedUpdatedAt) return true;
  return false;
}
function pfAutoRender(){
  if (!appEntered || !cur) return;
  if (cur.screen === "article") return; /* padh raha hai — article screen ko bilkul mat chhedo */
  var isList = (cur.screen === "home" || cur.screen === "catlist" || cur.screen === "topstory" || cur.screen === "bookmarks" || cur.screen === "search" || cur.screen === "categories" || cur.screen === "notifications");
  if (!isList) return; /* settings/about/update aadi: sirf data + cache update */
  var st = 0; try{ st = view.scrollTop; }catch(e){}
  /* Scroll anchor: render se pehle jo khabar user ki aankhon ke saamne
     hai (viewport me sabse upar dikh raha [data-open] card), uski id
     aur viewport-top se uski doori note kar lo. Render ke baad wahi
     khabar wapas bilkul usi jagah bitha do — nayi khabrein list ke
     upar judne par bhi user jahan padh raha tha wahin rehta hai,
     screen jump nahi karti. Anchor na mile (ya wo khabar nayi list
     me na ho) to purana scrollTop hi wapas lag jata hai. */
  var anchorId = null, anchorDy = 0;
  try{
    var vTop = view.getBoundingClientRect().top;
    var cards = view.querySelectorAll("[data-open]");
    for (var ci = 0; ci < cards.length; ci++){
      var cr = cards[ci].getBoundingClientRect();
      if (cr.bottom > vTop + 2){ anchorId = cards[ci].getAttribute("data-open"); anchorDy = cr.top - vTop; break; }
    }
  }catch(e){}
  if (cur.screen === "home"){ homeLoaded = true; renderHome(); }
  else if (cur.screen === "topstory") renderTopStory();
  else if (cur.screen === "categories") renderCategories();
  else if (cur.screen === "catlist") renderCatList(cur.param);
  else if (cur.screen === "bookmarks") renderBookmarks();
  else if (cur.screen === "notifications") renderNotifications();
  else if (cur.screen === "search"){
    var inp = document.getElementById("searchInput");
    var q = inp ? inp.value : ((typeof lastQuery !== "undefined") ? lastQuery : "");
    if (q && String(q).trim()) renderSearchBody(q); else return;
  }
  try{
    view.scrollTop = st;
    if (anchorId){
      var aEl = null, all = view.querySelectorAll("[data-open]");
      for (var ai = 0; ai < all.length; ai++){ if (all[ai].getAttribute("data-open") === anchorId){ aEl = all[ai]; break; } }
      if (aEl) view.scrollTop += (aEl.getBoundingClientRect().top - view.getBoundingClientRect().top) - anchorDy;
    }
  }catch(e){}
}
/* ---------- Today (last 24 hours): rolling window ----------
   Membership har render par Date.now() se dobara banti hai — article
   sirf tab bahar hota hai jab uske pure 24 ghante ho jayein; aadhi raat
   ko calendar date badalne se nahi. */
function pfTodayList(){
  var now = Date.now(), cut = now - 24*60*60*1000;
  return ARTICLES.filter(function(a){
    var ts = Date.parse(a.publishedAt);
    return !isNaN(ts) && ts >= cut && ts <= now;
  }).slice(0, 6);
}
function pfTodaySig(){
  return pfTodayList().map(function(a){ return a.id; }).join(",");
}
var pfTodaySigCache = null;
/* ---------- Latest News: date-wise browsing (malik ki farmaish, 2026-10-28) ----------
   Saari date tulna IST (UTC+5:30) calendar din par hoti hai — article ka
   din = uske publishedAt ka IST din. Date key "YYYY-MM-DD" (ISO kram me
   string sort hi newest-first deta hai). */
function pfISTKey(ts){
  var d = new Date(ts + 330*60000);
  var mo = d.getUTCMonth()+1, dy = d.getUTCDate();
  return d.getUTCFullYear() + "-" + (mo<10?"0":"") + mo + "-" + (dy<10?"0":"") + dy;
}
function pfArtISTKey(a){ var ts = Date.parse(a.publishedAt); return isNaN(ts) ? "" : pfISTKey(ts); }
function pfDateLabel(key){
  var p = key.split("-");
  return parseInt(p[2], 10) + " " + (S.lang === "hi" ? MON_HI[parseInt(p[1], 10)-1] : MON_EN[parseInt(p[1], 10)-1]);
}
/* Feed me jin-kin dinon ki khabrein sach me hain, unki keys — newest first.
   Khaali din ki chip kabhi nahi banti. */
function pfFeedDateKeys(){
  var seen = {}, keys = [];
  ARTICLES.forEach(function(a){ var k = pfArtISTKey(a); if (k && !seen[k]){ seen[k] = 1; keys.push(k); } });
  return keys.sort().reverse();
}
/* Combined list ke upar wali row (Today ke seedha neeche, bina kisi
   section heading ke): सभी / आज / कल / har purane din ki
   chip (jin din khabar hai) + आखिर me date picker. Selected chip .on
   (laal) — picker se chuni aisi taarikh jiski chip nahi hai (us din koi
   khabar nahi) to picker chip hi .on hoti hai aur input me wahi taarikh
   dikhti hai. Picker range: feed ki sabse purani khabar se aaj tak.
   Row .home-datebar hai: scroll karne par ye appbar ke seedha neeche
   LOCK (sticky) ho jati hai; sabse upar wapas aane par apni jagah par. */
function latestDateRowHTML(){
  var keys = pfFeedDateKeys();
  var todayK = pfISTKey(Date.now()), yestK = pfISTKey(Date.now() - 86400000);
  var sel = latestDateSel;
  var h = '<div class="subchips home-datebar" style="padding:14px 16px 10px;">';
  h += '<button class="subchip' + (!sel ? " on" : "") + '" data-latestdate="">' + esc(t("dateAll")) + '</button>';
  h += '<button class="subchip' + (sel === todayK ? " on" : "") + '" data-latestdate="' + todayK + '">' + esc(t("dateToday")) + '</button>';
  h += '<button class="subchip' + (sel === yestK ? " on" : "") + '" data-latestdate="' + yestK + '">' + esc(t("dateYest")) + '</button>';
  keys.forEach(function(k){
    if (k === todayK || k === yestK) return;
    h += '<button class="subchip' + (sel === k ? " on" : "") + '" data-latestdate="' + k + '">' + esc(pfDateLabel(k)) + '</button>';
  });
  var oldest = keys.length ? keys[keys.length-1] : todayK;
  var pickedNoChip = sel && sel !== todayK && sel !== yestK && keys.indexOf(sel) < 0;
  h += '<label class="subchip pf-datepick' + (pickedNoChip ? " on" : "") + '">📅 ' + esc(t("pickDate")) + '<input type="date" id="pfDatePick" min="' + oldest + '" max="' + todayK + '" value="' + (sel || "") + '"></label>';
  h += '</div>';
  return h;
}
/* ---------- Today heading ke right side: live date + time ----------
   Device ke local time se banta hai, app ki current bhasha me, EK line:
   Hindi — "बुधवार, 28 अक्टूबर • शाम 6:59" (din/mahina Devanagari shabdon
   me, ank hamesha aam Latin — Devanagari ank kabhi nahi; din ka hissa
   सुबह/दोपहर/शाम/रात, fmtStamp wala hi andaaz).
   English — "Wednesday, 28 October • 6:59 PM".
   Har 20 second me sirf clock ka text update hota hai — poora page
   dobara render nahi hota. */
var DAY_HI = ["रविवार","सोमवार","मंगलवार","बुधवार","गुरुवार","शुक्रवार","शनिवार"];
var DAY_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MON_EN_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function pfNowText(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes(), mm = (m<10?"0":"")+m, h12 = h%12; if (h12===0) h12 = 12;
  if (S.lang === "hi"){
    var part = h<12 ? "सुबह" : (h<16 ? "दोपहर" : (h<20 ? "शाम" : "रात"));
    return DAY_HI[d.getDay()]+", "+d.getDate()+" "+MON_HI[d.getMonth()]+" • "+part+" "+h12+":"+mm;
  }
  return DAY_EN[d.getDay()]+", "+d.getDate()+" "+MON_EN_FULL[d.getMonth()]+" • "+h12+":"+mm+" "+(h<12?"AM":"PM");
}
function pfTickClock(){
  var el = document.getElementById("pfClock");
  if (el) el.textContent = pfNowText();
}
setInterval(pfTickClock, 20000);
/* Auto-poll par: feed me kuch naya na ho tab bhi, agar koi article apne
   24 ghante pure karke Today se bahar ho gaya ho to list views dobara
   render karo (pfAutoRender scroll bacha kar render karta hai), taaki
   article bina manual refresh ke Today se hat jaye aur time labels
   taaza rahein. */
function pfCheckTodayRollover(){
  var sig = pfTodaySig();
  if (pfTodaySigCache === null){ pfTodaySigCache = sig; return; }
  if (sig === pfTodaySigCache) return;
  pfTodaySigCache = sig;
  pfAutoRender();
}
/* vc35 (1.8.8) — LITE-FIRST LOADING (malik ki farmaish, 2026-11-02):
   purani vyavastha me app seedha 7 MB ki puri feed kheenchta tha aur
   sirf 10 second wait karta tha — dheeme net par file kabhi time par
   aati hi nahi thi, isliye app ghanton purani cache par atka rehta tha
   aur "ऑफ़लाइन" strip dikhti rehti thi, jabki desk nayi khabrein
   lagatar publish kar raha hota tha. Ab do hisson me load hota hai:
   (1) LITE feed (articles_lite.json, sirf headlines + summary, ~1.3 MB
   raw / gzip par ~300 KB) 30 second ke timeout ke saath pehle aati
   hai — list turant taaza ho jaati hai, strip hat jaati hai;
   (2) FULL feed (saari bodies ke saath) peeche background me 120
   second ke timeout ke saath aati rehti hai; aate hi bodies merge ho
   jaati hain aur khula article bhi khud bhar jaata hai. */
function loadFeed(manual, isAuto){
  if (pfFeedFetching) return;
  if (!PF_CONFIG.feedUrl || !window.fetch){ if (!isAuto) feedFallback(manual); return; }
  pfFeedFetching = true;
  var url = PF_CONFIG.liteUrl + "?t=" + Date.now();
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, 30000);
  fetch(url, { cache:"no-store", signal: ctl ? ctl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error("lite http " + r.status); return r.json(); })
    .then(function(d){
      clearTimeout(tm);
      pfFeedFetching = false;
      if (!validLiteFeed(d)) throw new Error("lite malformed");
      var arts = d.articles.filter(validLiteArticle);
      var changed = pfLiteHasNew(d, arts);
      lsSet(LITE_CACHE_KEY, { updatedAt: d.updatedAt || null, articles: arts });
      if (changed){
        pfLiteUpdatedAt = d.updatedAt || pfLiteUpdatedAt;
        setLiteArticles(arts, "live");
        if (isAuto){
          pfAutoRender();
          pfTodaySigCache = pfTodaySig();
          if (cur && cur.screen !== "article") pfTryOpenPending();
        } else finishFeedLoad();
      } else {
        if (feedState !== "live"){ feedState = "live"; if (isAuto) pfAutoRender(); else finishFeedLoad(); }
        if (isAuto) pfCheckTodayRollover();
      }
      pfFetchFull();
    })
    .catch(function(){
      clearTimeout(tm);
      pfFeedFetching = false;
      if (isAuto) pfCheckTodayRollover();
      else feedFallback(manual);
      pfFetchFull();
    });
}
/* Full feed (bodies ke saath) background me: safal hone par cache +
   ARTICLES dono full data se refresh ho jaate hain. Article screen
   khula ho aur uski body lite ke kaaran khaali ho, to body aate hi
   wahi article dobara render karke bhar diya jaata hai (scroll ki
   jagah bachakar). Fail hone par khamoshi — lite list pehle hi live
   hai, agla 60s cycle phir koshish karega. */
function pfFetchFull(){
  if (pfFullFetching || !PF_CONFIG.feedUrl || !window.fetch) return;
  pfFullFetching = true;
  var url = PF_CONFIG.feedUrl + "?t=" + Date.now();
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, 120000);
  fetch(url, { cache:"no-store", signal: ctl ? ctl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error("feed http " + r.status); return r.json(); })
    .then(function(d){
      clearTimeout(tm);
      pfFullFetching = false;
      if (!validFeed(d)) return;
      var arts = d.articles.filter(validArticle);
      var hasNew = pfFeedHasNew(d, arts);
      lsSet(FEED_CACHE_KEY, { updatedAt: d.updatedAt || null, articles: arts });
      pfFeedUpdatedAt = d.updatedAt || pfFeedUpdatedAt;
      if (hasNew){
        setArticles(arts, "live");
        if (cur && cur.screen === "article") pfRefillArticleBody();
        else { pfAutoRender(); if (cur && cur.screen !== "article") pfTryOpenPending(); }
        pfTodaySigCache = pfTodaySig();
      } else if (cur && cur.screen === "article"){
        /* updatedAt wahi hai, par ho sakta hai ARTICLES abhi lite-only
           hon (jaise lite cache se start) — bodies chup-chaap merge
           karke khula article bhar do. */
        setArticles(arts, "live");
        pfRefillArticleBody();
      }
    })
    .catch(function(){ clearTimeout(tm); pfFullFetching = false; });
}
function pfRefillArticleBody(){
  if (!cur || cur.screen !== "article" || !cur.param) return;
  var a = artById(cur.param);
  if (!a || !articleHasBody(a)) return;
  var el = document.querySelector(".art-text");
  if (el && el.getAttribute("data-pf-nobody") === "1"){
    var st = 0; try{ st = view.scrollTop; }catch(e){}
    renderArticle(cur.param);
    try{ view.scrollTop = st; }catch(e){}
  }
}
function pfAutoRefresh(){ loadFeed(false, true); }
function pfStartAutoRefresh(){
  if (pfAutoTimer) return;
  pfAutoTimer = setInterval(pfAutoRefresh, 60 * 1000);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && document.visibilityState === "visible") pfAutoRefresh(); });
  window.addEventListener("focus", pfAutoRefresh);
  window.addEventListener("online", pfAutoRefresh);
}
/* Greeting-row refresh button: existing loadFeed(true) ko hi chalata hai
   (cache-busted fetch, success par Home in-place re-render, fail par
   feedFallback purana content rakhta hai + offline toast). Yahan sirf
   icon ki spin state manage hoti hai — page/WebView reload kabhi nahi. */
var pfRefreshing = false;
function pfGreetRefresh(btn){

  var startedAt = Date.now();

        if (b){ b.classList.remove("spinning"); b.disabled = false; }

    }

/* ---------- Pull-to-refresh (Home / category / district lists) ----------
   Main list scroll (#view) me sabse upar se neeche kheenchne par upar

   kheench kar chhodne par wahi manual refresh chalta hai jo pehle
   greeting wale gol button se chalta tha (loadFeed(true) — success par

   hote hi spinner gayab. Auto-refresh isse alag, pehle jaisa hi hai. */
(function(){

  function applyPtr(){
    rafId = 0;
    var d = dist;
    el.style.opacity = d <= 0 ? "0" : String(Math.min(1, d / 38));
    el.style.transform = "translateY(" + (-46 + d * 0.78) + "px)";
    ring.style.transform = "rotate(" + (d * 2.6) + "deg)";
  }
  function queuePtr(){ if (!rafId) rafId = requestAnimationFrame(applyPtr); }
  function cancelPtrFrame(){ if (rafId){ cancelAnimationFrame(rafId); rafId = 0; } }
  /* Chhodne par: .settle class se position + rotation dono lambi eased
     transition se wapas jaate hain — koi achanak gayab/jump nahi. */
  function ptrSettleTo(ty, op){
    el.classList.add("settle");
    el.style.opacity = String(op);
    el.style.transform = "translateY(" + ty + "px)";
    ring.style.transform = "rotate(0deg)";
    if (settleTm) clearTimeout(settleTm);
    settleTm = setTimeout(function(){ el.classList.remove("settle"); }, 420);
  }
  function ptrHide(){ ptrSettleTo(-46, 0); }
  viewEl.addEventListener("touchstart", function(e){
    if (busy || !ptrActive() || e.touches.length !== 1 || viewEl.scrollTop > 0){ startY = null; return; }
    if (settleTm){ clearTimeout(settleTm); settleTm = null; }
    el.classList.remove("settle");
    startY = e.touches[0].clientY; dist = 0;
  }, { passive:true });
  viewEl.addEventListener("touchmove", function(e){
    if (startY === null || busy) return;
    if (viewEl.scrollTop > 0){ startY = null; cancelPtrFrame(); dist = 0; ptrHide(); return; }
    var dy = e.touches[0].clientY - startY;
    if (dy <= 0){ if (dist !== 0){ dist = 0; queuePtr(); } return; }
    dist = easeDist(dy);
    queuePtr();
    if (e.cancelable) e.preventDefault();
  }, { passive:false });
  function ptrEnd(){
    if (startY === null) return;
    startY = null;
    if (busy) return;
    cancelPtrFrame();
    if (dist >= THRESH) ptrDoRefresh(); else { dist = 0; ptrHide(); }
  }
  viewEl.addEventListener("touchend", ptrEnd);
  viewEl.addEventListener("touchcancel", ptrEnd);
  function ptrDoRefresh(){
    busy = true; dist = 0;
    /* Ring pehle .settle se smooth tareeke se hold position par aati
       hai, phir andar wali ring spin karti hai — position aur rotation
       alag elements par hain, isliye spin shuru/band hone par ring
       kabhi jump nahi hoti. List ka re-render pehle jaisa hi hai
       (loadFeed success par in-place render, skeleton kabhi nahi
       dikhta kyunki homeLoaded pehle se true rehta hai). */
    el.classList.add("settle");
    el.style.opacity = "1";
    el.style.transform = "translateY(8px)";
    ring.style.transform = "";
    el.classList.add("spin");
    if (settleTm) clearTimeout(settleTm);
    settleTm = setTimeout(function(){ el.classList.remove("settle"); }, 420);
    var startedAt = Date.now();
    var iv = setInterval(function(){
      if ((!pfFeedFetching && Date.now() - startedAt > 600) || Date.now() - startedAt > 5000){
        clearInterval(iv);
        busy = false;
        el.classList.remove("spin");
        ring.style.transform = "";
        ptrHide();
      }
    }, 120);
    loadFeed(true);
  }
})();

/* ---------- in-app update check ----------
   App start par (splash ke baad, session me sirf ek baar) aur Settings ki
   "Check for updates" row se version.json check hota hai. Koi bhi fail
   (offline, 404, bad JSON) bilkul silent hai — koi error UI nahi, app
   aaram se chalti rehti hai. Apna versionCode page URL ke ?vc=N se aata
   hai (Android shell ?vc=N&vn=X ke saath load karta hai); na ho to 0. */
var APP_VC = (function(){ try{ var m = /[?&]vc=(\d+)/.exec(window.location.search || ""); return m ? (parseInt(m[1], 10) || 0) : 0; }catch(e){ return 0; } })();
/* Display ke liye asli version: shell jo ?vn=X deta hai wahi sach hai;
   na mile to PF_CONFIG.version (current release) fallback hai. Pehle ye
   har jagah hardcoded "1.0.0" dikhta tha — wahi bug Raj ne report kiya. */
var APP_VN = (function(){ try{ var m = /[?&]vn=([0-9][0-9A-Za-z.\-]*)/.exec(window.location.search || ""); return m ? m[1] : ""; }catch(e){ return ""; } })();
var APP_VERSION = APP_VN || PF_CONFIG.version;
var updateChecked = false, updateDismissed = false;
/* Visible update state — ek hi jagah se Home banner, Settings card,
   Update Centre aur popup, chaaro jagah ek saath dikhta hai.
   state: idle | available | downloading | downloaded | failed
   indet = asli progress percent pata nahi (bar indeterminate);
   noBridge = purana shell, PFNative bridge maujood nahi. */
var PF_UPDATE = { info:null, state:"idle", progress:0, timer:null, checkedOnce:false, indet:false, noBridge:false };
function updVerName(){ return PF_UPDATE.info ? String(PF_UPDATE.info.versionName || "") : ""; }
/* ---------- version tulna: update tabhi, jab remote SACH me naya ho ----------
   Asli usool yahi hai: remote versionName ko current APP_VERSION se semver
   ki tarah compare karo (1.6.6 < 1.6.7 — hamesha). Naam na mile tabhi
   versionCode dekho, aur woh bhi tab jab apna code pata ho (APP_VC > 0).
   Barabar ya purana version KABHI "new update" nahi banta — chahe popup ho,
   Home banner, Settings card ya App Update screen. Yahi woh bug tha jo
   1.6.7 par baithe user ko 1.6.6 ko "naya update" dikha raha tha. */
function verParts(v){ return String(v == null ? "" : v).split(".").map(function(x){ var n = parseInt(x, 10); return isNaN(n) ? 0 : n; }); }
function verCmp(a, b){ var pa = verParts(a), pb = verParts(b), n = Math.max(pa.length, pb.length); for (var i = 0; i < n; i++){ var x = pa[i] || 0, y = pb[i] || 0; if (x !== y) return x < y ? -1 : 1; } return 0; }
function isRealUpdate(d){
  if (!d) return false;
  var rn = String(d.versionName || "");
  if (rn) return verCmp(rn, APP_VERSION) > 0;
  return (typeof d.versionCode === "number" && APP_VC > 0) ? d.versionCode > APP_VC : false;
}
/* Atka hua purana/barabar "update" state saaf karo — download chal raha ho to haath mat lagao */

    + '<button class="btn-ghost" data-upd-act="centre">'+esc(t("updCentre"))+'</button></div></div>';

function paintUpdateProgress(){
  var p = Math.round(PF_UPDATE.progress);
  var fills = document.querySelectorAll("[data-upd-fill]");
  for (var i=0;i<fills.length;i++){ fills[i].style.width = p + "%"; if (PF_UPDATE.indet) fills[i].classList.add("indet"); else fills[i].classList.remove("indet"); }
  var pcts = document.querySelectorAll("[data-upd-pct]"); for (var j=0;j<pcts.length;j++) pcts[j].textContent = PF_UPDATE.indet ? "…" : (p + "%");
  var sts = document.querySelectorAll("[data-upd-status]"); for (var k=0;k<sts.length;k++) sts[k].textContent = pfUpdStatusText();
  var bars = document.querySelectorAll(".upd-bar"); for (var m=0;m<bars.length;m++) bars[m].setAttribute("aria-valuenow", String(p));
}
/* ---------- Asli update download (1.8.4) — koi nakli progress nahi ----------
   Download system DownloadManager karta hai (doInstallUpdate ka trigger).
   Shell window.PFNative.updateStatus() se asli bytes/total deta hai —
   wahi har 500ms poll karke sachha percent banta hai. Total na mile to
   bar indeterminate rehti hai; purane shell me bridge hi na ho to
   percent kabhi dikhta hi nahi — sirf sachha "system notification"
   wala sandesh dikhta hai. */
function pfStopUpdPoll(){ if (PF_UPDATE.timer){ clearInterval(PF_UPDATE.timer); PF_UPDATE.timer = null; } }
function pfNativeUpdStatus(){
  try{
    if (!window.PFNative || typeof window.PFNative.updateStatus !== "function") return null;
    var r = window.PFNative.updateStatus();
    if (typeof r === "string") r = JSON.parse(r);
    return (r && typeof r === "object") ? r : null;
  }catch(e){ return null; }
}
function pfUpdFailed(){
  pfStopUpdPoll();
  PF_UPDATE.state = "failed"; PF_UPDATE.indet = false;
  paintUpdateProgress();
  if (cur.screen==="home" || cur.screen==="settings" || cur.screen==="update") go(cur.screen, cur.param, true);
  showUpdatePopup(PF_UPDATE.info, true);
}
function pfPollUpdStatus(){
  pfStopUpdPoll();
  PF_UPDATE.timer = setInterval(function(){
    var st = pfNativeUpdStatus();
    if (!st || !st.state || st.state === "none") return;
    if (st.state === "successful"){
      pfStopUpdPoll();
      PF_UPDATE.state = "downloaded"; PF_UPDATE.progress = 100; PF_UPDATE.indet = false;
      paintUpdateProgress();
      if (cur.screen==="home" || cur.screen==="settings" || cur.screen==="update") go(cur.screen, cur.param, true);
      showUpdatePopup(PF_UPDATE.info, true);
      toast(t("updDownloadDone"));
      return;
    }
    if (st.state === "failed"){ pfUpdFailed(); return; }
    /* running | pending | paused */
    var total = Number(st.total) || 0, bytes = Number(st.bytes) || 0;
    if (total > 0){
      PF_UPDATE.indet = false;
      PF_UPDATE.progress = Math.min(99, Math.round(bytes * 100 / total));
    } else {
      PF_UPDATE.indet = true;
    }
    paintUpdateProgress();
  }, 500);
}
function pfBeginRealDownload(){
  PF_UPDATE.state = "downloading"; PF_UPDATE.progress = 0;
  PF_UPDATE.noBridge = !(window.PFNative && typeof window.PFNative.updateStatus === "function");
  PF_UPDATE.indet = true;
  /* popup, banner aur centre — teeno jagah progress ek saath chalega:
     pehle peeche ki screen refresh (banner/card), phir popup ek hi baar */
  if (cur.screen==="home" || cur.screen==="settings" || cur.screen==="update") go(cur.screen, cur.param, true);
  showUpdatePopup(PF_UPDATE.info, true);
  doInstallUpdate(); /* asli system download ka trigger */
  if (!PF_UPDATE.noBridge) pfPollUpdStatus();
}
function startUpdateDownload(){
  if (!isRealUpdate(PF_UPDATE.info) || PF_UPDATE.state==="downloading"){ clearStaleUpdate(); return; }
  pfBeginRealDownload();
}
/* Update APK sirf bharosemand host se hi download hoga (audit M5):
   https + host allowlist — iske bahar ka link yahin rok diya jaata hai,
   aur native taraf bhi yahi jaanch doosri parat ke roop me lagi hai. */
function pfApkUrlOk(u){
  try{
    var x = new URL(u);
    if (x.protocol !== "https:") return false;
    var h = x.hostname.toLowerCase();
    return h==="github.com" || h==="objects.githubusercontent.com" || h==="primefeed.netlify.app";
  }catch(e){ return false; }
}
function doInstallUpdate(){
  var d = PF_UPDATE.info;
  if (!d || !d.apkUrl){ /* apkUrl nahi (demo/preview) — button dead nahi, saaf wajah batao */
    toast(t("updNoApk"));
    return;
  }
  if (!pfApkUrlOk(d.apkUrl)){ /* apkUrl allowlist se bahar — download shuru hi nahi hoga */
    toast(S.lang==="hi" ? "Update link bharosemand source se nahi hai — update roka gaya" : "Update link is not from a trusted source — update blocked");
    return;
  }
  /* Asli update: Install dabte hi APK file kholni hai. Pehle asli tap ke
     saath ek download-link click; kuchh WebView shell synthetic click ko
     rok dete hain, isliye agar page na badle/blur na ho to seedha usi
     file par navigation bhi kar do — installer/download wahin se khulta hai. */
  var opened = false;
  function markOpened(){ opened = true; }
  window.addEventListener("pagehide", markOpened);
  window.addEventListener("blur", markOpened);
  var a = document.createElement("a"); a.href = d.apkUrl; a.setAttribute("download", "");
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){
    window.removeEventListener("pagehide", markOpened);
    window.removeEventListener("blur", markOpened);
    if (!opened){ try{ window.location.assign(d.apkUrl); }catch(e){} }
  }, 800);
}
function showUpdatePopup(d, keepState){
  if (!isRealUpdate(d)){ /* purana/barabar version popup bankar kabhi nahi aayega */
    clearStaleUpdate();
    var hh = document.getElementById("updHost"); if (hh) hh.innerHTML = "";

  }
  PF_UPDATE.info = d;
  if (!keepState && PF_UPDATE.state==="idle") PF_UPDATE.state = "available";

      + (PF_UPDATE.state==="downloading" ? '<p class="upd-notes">'+esc(t("updDownloadingSub"))+'</p>' : PF_UPDATE.state==="failed" ? '<p class="upd-notes" style="color:var(--red);font-weight:800;">'+esc(pfUpdStatusText())+'</p>' : '<div class="upd-guide">'+esc(t("updInstallGuide"))+'</div>')
      + '<div class="upd-btns">'
      + (PF_UPDATE.state==="downloaded" ? '<button class="btn-red" data-upd-act="install">'+esc(t("updInstallNow"))+'</button>' : PF_UPDATE.state==="failed" ? '<button class="btn-red" data-upd-act="start">'+esc(S.lang==="hi" ? "दोबारा कोशिश करें" : "Retry")+'</button>' : '<button class="btn-red" disabled style="opacity:.65;">'+esc(t("updProgressLbl"))+'…</button>')
      + '<button class="btn-ghost" data-upd-act="later">'+esc(t("updLater"))+'</button></div>';
  } else {
    body = notes
      + '<p class="upd-notes" style="font-weight:700;">'+esc(t("updBannerSub"))+'</p>'
      + '<div class="upd-btns"><button class="btn-red" data-upd-act="start">'+esc(t("updNow"))+'</button><button class="btn-ghost" data-upd-act="later">'+esc(t("updLater"))+'</button></div>';
  }
  host.innerHTML = '<div class="upd-wrap"><div class="upd-card" role="dialog" aria-modal="true" aria-label="'+esc(t("updTitle"))+'">'
    + '<div class="upd-ic">'+IC.refresh+'</div>'
    + '<h3>'+esc(t("updTitle"))+'</h3>'
    + '<p class="upd-ver">PrimeFeed '+esc(String(d.versionName || ""))+'</p>'
    + body
    + '</div></div>';
}
function checkForUpdate(){
  if (updateChecked || updateDismissed) return;
  updateChecked = true;
  if (!window.fetch || !PF_CONFIG.versionUrl) return;
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 5000);
  fetch(PF_CONFIG.versionUrl + "?t=" + Date.now(), { cache:"no-store", signal: ctl ? ctl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error("version http " + r.status); return r.json(); })
    .then(function(d){
      clearTimeout(timer);
      PF_UPDATE.checkedOnce = true;
      if (isRealUpdate(d)){
        PF_UPDATE.info = d; if (PF_UPDATE.state==="idle") PF_UPDATE.state = "available";
        /* sabko dikhe: pehle Home/Settings peeche refresh karke banner lagao, phir popup dikhao */
        if (cur.screen==="home" || cur.screen==="settings") go(cur.screen, cur.param, true);
        showUpdatePopup(d);
      } else {
        /* Remote version barabar ya purana hai (jaise 1.6.6, jab phone par 1.6.7
           pehle se hai) — ye update NAHI hai. Atka hua purana update state bhi
           saaf karo, taaki popup/banner/card kahin 'naya update' na dikhaye. */
        if (PF_UPDATE.state==="idle" || PF_UPDATE.state==="available"){ PF_UPDATE.info = null; PF_UPDATE.state = "idle"; PF_UPDATE.progress = 0; }
        if (cur.screen==="home" || cur.screen==="settings" || cur.screen==="update") go(cur.screen, cur.param, true);
      }
    })
    .catch(function(){ clearTimeout(timer); /* fail silent — checkedOnce nahi set hota, taaki offline par galat 'sabse naya' na dikhe */ });
}

/* ---------- history wiring: Android back button screen-by-screen ----------
   Har forward navigation ek history entry banata hai; system back
   (popstate) wahi entry khaata hai aur pichhli screen dikhata hai.
   Home par stack khaali ho to back app ke paas rehta hai — shell exit
   kar sakta hai. Splash sirf boot par aata hai, back par kabhi nahi. */
var pfPopSuppress = 0;
function pfStepBack(){
  var prev = navStack.pop();
  if (!prev) return false;
  go(prev.screen, prev.param, true);
  /* Back par pichhli screen wapas usi jagah se khule jahan user chhod
     kar gaya tha — go() ne scrollTop 0 kiya tha, ab saved jagah lagao. */
  try{ view.scrollTop = prev.scroll || 0; }catch(e){}
  return true;
}
function goBack(){
  if (!pfStepBack()){ if (cur.screen !== "home") go("home", null, true); return false; }
  pfPopSuppress++; try{ history.back(); }catch(e){ pfPopSuppress = Math.max(0, pfPopSuppress-1); }
  return true;
}
window.addEventListener("popstate", function(){
  if (pfPopSuppress > 0){ pfPopSuppress--; return; }
  pfStepBack();
});
/* Native shell hook: ek step back jaao — true = app ne sambhala, false = Home par hai (shell exit kar sakta hai) */
window.primeFeedGoBack = function(){ return goBack(); };

/* ---------- notification / deep-link se wahi article kholna ----------
   Push notification article id ke saath aata hai. Do raaste:
   (a) page URL me ?open=<article-id> — feed load hote hi wahi article
       Home ke upar khulta hai (Back dabane par Home).
   (b) chalte hue app me shell window.pfOpenArticle(id) bula sakta hai.
   Dono raaste onboarding ke baad hi kaam karte hain: pehli baar ke user
   ko pehle onboarding milta hai, uske baad pending article khulta hai.
   Id feed me na mile to chup chaap Home — koi error, koi khaali screen
   nahi; live feed aane par pending id phir se try hoti hai. */
var pfPendingOpen = null;
try{ pfPendingOpen = new URLSearchParams(window.location.search || "").get("open") || null; }catch(e){ pfPendingOpen = null; }
function pfTryOpenPending(){
  if (!pfPendingOpen) return;
  if (!PREFS.done || !appEntered) return; /* pehle onboarding / splash */
  if (cur.screen !== "home") return;     /* sirf Home ke upar khulta hai */
  var id = pfPendingOpen;
  if (!artById(id)) return;               /* feed me abhi nahi — live feed par phir try hoga */
  pfPendingOpen = null;
  go("article", id);
}
window.pfOpenArticle = function(id){
  if (id === null || id === undefined || id === "") return false;
  id = String(id);
  if (!PREFS.done || !appEntered){ pfPendingOpen = id; return false; }
  if (cur.screen === "article" && cur.param === id) return true;
  if (!artById(id)){ pfPendingOpen = id; return false; }
  go("article", id);
  return true;
};

/* selected tile list ke beech me ho to row ko wahan tak scroll kar do,

function centerCatRow(rowEl){
  if (!rowEl) return;

  var x = (onEl.offsetLeft - rowEl.offsetLeft) - (rowEl.clientWidth/2) + (onEl.offsetWidth/2);

  /* selected tile tak animated slide — seedha scrollLeft set karne se
     row ek jhatke me jump karti thi; ab smooth scroll hoga */
  try{ rowEl.scrollTo({ left:x, behavior: reducedMotion ? "auto" : "smooth" }); }
  catch(e){ rowEl.scrollLeft = x; }

/* vc36 (1.8.9) — HOME AUTO-LOAD (malik ka order, 2026-11-03): sentinel
   scroll me aate hi agla batch (All view +12, date view +20) apne aap
   jud jata hai; "Load More" button dabane ki zaroorat nahi. */
var pfHomeObs = null;
function pfSetupHomeAutoLoad(){
  if (pfHomeObs){ try{ pfHomeObs.disconnect(); }catch(e){} pfHomeObs = null; }
  var s = document.getElementById("pfHomeSentinel");
  if (!s || !("IntersectionObserver" in window)) return;
  pfHomeObs = new IntersectionObserver(function(entries){
    if (!entries.length || !entries[0].isIntersecting) return;
    if (cur.screen !== "home" || !document.getElementById("pfHomeSentinel")){
      if (pfHomeObs){ try{ pfHomeObs.disconnect(); }catch(e){} pfHomeObs = null; }
      return;
    }
    if (!latestDateSel) latestShown += 12; else dateShown += 20;
    renderHome();
  }, { rootMargin: "700px 0px" });
  pfHomeObs.observe(s);
}

/* ---------- ARTICLE LISTEN (Suniye) ----------
   Do source, is kram me: (1) feed ki recorded MP3 (article.audioHi /
   audioEn) — HTML audio element, seek slider + elapsed/total time ke
   saath; (2) device voice fallback (speechSynthesis) — title, summary,
   phir poori body, sentence chunks ek-ek karke queue me (lambe single
   utterance Android WebView me kat jaate hain). Ek samay par sirf ek
   playback; go() har navigation par lbStopAll() bulata hai. */
var LB = { artId:null, mode:null, state:"idle", chunks:[], idx:0, gen:0 };
var lbAudio = null;
function lbEl(){
  if (!lbAudio){
    lbAudio = new Audio();
    lbAudio.preload = "metadata";
    lbAudio.addEventListener("timeupdate", lbFileTick);
    lbAudio.addEventListener("loadedmetadata", lbFileTick);
    lbAudio.addEventListener("ended", function(){
      LB.state = "idle"; lbPaint();
      var sk = document.getElementById("lbSeek"); if (sk) sk.value = 0;
      var tm = document.getElementById("lbTime"); if (tm && isFinite(lbAudio.duration)) tm.textContent = "0:00 / " + lbFmt(lbAudio.duration);
    });
    lbAudio.addEventListener("error", function(){ if (LB.mode==="file"){ LB.state = "idle"; lbPaint(); } });
  }
  return lbAudio;
}
function lbFmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ":" + ("0" + (s % 60)).slice(-2); }
function lbFileTick(){
  if (LB.mode !== "file" || !lbAudio) return;
  var sk = document.getElementById("lbSeek"), tm = document.getElementById("lbTime");
  if (sk && isFinite(lbAudio.duration) && lbAudio.duration > 0) sk.value = Math.round(lbAudio.currentTime / lbAudio.duration * 1000);
  if (tm) tm.textContent = lbFmt(lbAudio.currentTime) + " / " + (isFinite(lbAudio.duration) ? lbFmt(lbAudio.duration) : "0:00");
}
function lbFileFor(a){
  if (!a) return null;
  return (artDispLang() === "hi" ? a.audioHi : a.audioEn) || null;
}
function lbPaint(){
  var btn = document.getElementById("lbPlayBtn"); if (!btn) return;
  var playing = LB.state === "playing";
  btn.innerHTML = playing ? ic('<rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/>', true)
                          : ic('<path d="M8.5 5.8v12.4L18.6 12z"/>', true);
  btn.setAttribute("aria-label", playing ? t("lbPause") : t("lbPlay"));
  var prog = document.getElementById("lbProg");
  if (prog){
    if (LB.mode === "tts" && LB.chunks.length)
      prog.textContent = (S.lang === "hi" ? "भाग " + Math.min(LB.idx + 1, LB.chunks.length) + " / " + LB.chunks.length
                                          : "Part " + Math.min(LB.idx + 1, LB.chunks.length) + " of " + LB.chunks.length);
    else prog.textContent = "";
  }
}
function lbStopAll(){
  LB.gen++;
  if (lbAudio){ try{ lbAudio.pause(); lbAudio.removeAttribute("src"); lbAudio.load(); }catch(e){} }
  if ("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  LB.artId = null; LB.mode = null; LB.state = "idle"; LB.chunks = []; LB.idx = 0;
  lbPaint();
  var sk = document.getElementById("lbSeek"); if (sk) sk.value = 0;
  var tm = document.getElementById("lbTime"); if (tm) tm.textContent = "0:00 / 0:00";
}
function lbSentences(text){
  var parts = String(text || "").match(/[^.!?।\n]+[.!?।]*/g) || [];
  var out = [];
  parts.forEach(function(p){
    p = p.trim(); if (!p) return;
    while (p.length > 220){
      var cut = p.lastIndexOf(",", 220); if (cut < 80) cut = p.lastIndexOf(" ", 220); if (cut < 80) cut = 220;
      out.push(p.slice(0, cut + 1).trim()); p = p.slice(cut + 1).trim();
    }
    if (p) out.push(p);
  });
  return out;
}
function lbChunksFor(a){
  var chunks = [];
  var L = artDispLang(), v = a[L], lang = (L === "hi" ? "hi-IN" : "en-IN");
  [v.title, v.ex].concat(v.body).forEach(function(tx){
    lbSentences(tx).forEach(function(s){ chunks.push({ text:s, lang:lang }); });
  });
  return chunks;
}
function lbSpeakNext(){
  var gen = LB.gen;
  if (LB.idx >= LB.chunks.length){ LB.state = "idle"; LB.mode = null; LB.chunks = []; lbPaint(); return; }
  var c = LB.chunks[LB.idx];
  var u = new SpeechSynthesisUtterance(c.text);
  u.lang = c.lang;
  function advance(err){
    if (gen !== LB.gen) return;
    if (err && err.error === "interrupted") return;
    LB.idx++;
    if (LB.idx >= LB.chunks.length){ LB.state = "idle"; LB.mode = null; LB.chunks = []; lbPaint(); }
    else { lbPaint(); lbSpeakNext(); }
  }
  u.onend = function(){ advance(null); };
  u.onerror = function(ev){ advance(ev); };
  window.speechSynthesis.speak(u);
  lbPaint();
}
function lbToggle(){
  if (cur.screen !== "article") return;
  var a = artById(cur.param); if (!a) return;
  if (LB.state === "playing"){
    if (LB.mode === "file") lbEl().pause();
    else if (LB.mode === "tts" && "speechSynthesis" in window){ try{ window.speechSynthesis.pause(); }catch(e){} }
    LB.state = "paused"; lbPaint(); return;
  }
  if (LB.state === "paused"){
    if (LB.mode === "file"){ var pr0 = lbEl().play(); if (pr0 && pr0.catch) pr0.catch(function(){ LB.state = "idle"; lbPaint(); }); }
    else if (LB.mode === "tts" && "speechSynthesis" in window){ try{ window.speechSynthesis.resume(); }catch(e){} }
    LB.state = "playing"; lbPaint(); return;
  }
  lbStopAll();
  LB.artId = a.id;
  var f = lbFileFor(a);
  if (f){
    LB.mode = "file"; LB.state = "playing";
    var au = lbEl(); au.src = f;
    var pr = au.play(); if (pr && pr.catch) pr.catch(function(){ LB.state = "idle"; lbPaint(); });
    lbPaint(); return;
  }
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){ LB.mode = null; LB.state = "idle"; return; }
  LB.mode = "tts"; LB.chunks = lbChunksFor(a); LB.idx = 0;
  if (!LB.chunks.length){ LB.mode = null; LB.state = "idle"; return; }
  LB.state = "playing";
  lbSpeakNext();
}

/* ---------- ARTICLE LANGUAGE ----------
   Article by default chuni hui app-bhasha (Hindi ya English) me dikhta hai —
   headline, summary, body aur Listen player sab usi ek version se aate hain.
   Article page ke Translate button se SIRF khuli hui khabar ki bhasha badli
   ja sakti hai (app ki bhasha waisi ki waisi rehti hai); chunaav artLangMap
   me article-id ke hisaab se sirf is session ke liye rehta hai. */
var artLangMap = {};
function artDispLang(){
  if (cur && cur.screen==="article" && cur.param && artLangMap[cur.param]) return artLangMap[cur.param];
  return S.lang;
}
function artVersion(a){ var v = a[artDispLang()]; if (!v || !v.title) v = a[S.lang] || a.en || a.hi; return v; }

/* ---------- LIKE + COMMENTS (Firebase, lazy) ----------
   Compat SDK sirf article khulne par load hota hai (app start par
   kabhi nahi); pehle article par anonymous sign-in, uid session bhar
   rehta hai. Har failure (SDK blocked, offline, auth fail) par article
   bina gadbad render hota hai aur Like/Comments "internet needed"
   note dikhate hain — koi fake data kabhi nahi. */
var FB = { state:"idle", uid:null, db:null, unsubL:null, unsubC:null, artId:null, liked:false, count:null, myLikes: lsGet("pf_mylikes", []) };
var fbPromise = null;
var FB_HEART = '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>';
function fbLoadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error("sdk load failed")); };
    document.head.appendChild(s);
  });
}
function fbEnsure(){
  if (fbPromise) return fbPromise;
  FB.state = "loading";
  var base = "https://www.gstatic.com/firebasejs/10.12.2/";
  var chain = fbLoadScript(base + "firebase-app-compat.js")
    .then(function(){ return fbLoadScript(base + "firebase-auth-compat.js"); })
    .then(function(){ return fbLoadScript(base + "firebase-firestore-compat.js"); })
    .then(function(){
      if (!window.firebase || !firebase.initializeApp) throw new Error("firebase missing");
      if (!firebase.apps.length) firebase.initializeApp(PF_FIREBASE);
      var auth = firebase.auth();
      if (auth.currentUser){ FB.uid = auth.currentUser.uid; return null; }
      return auth.signInAnonymously();
    })
    .then(function(){
      var u = firebase.auth().currentUser;
      FB.uid = u ? u.uid : null;
      if (!FB.uid) throw new Error("no uid");
      FB.db = firebase.firestore();
      FB.state = "ready";
    })
    .catch(function(){ FB.state = "off"; });
  fbPromise = Promise.race([chain, new Promise(function(res){ setTimeout(res, 15000); })]).then(function(){
    if (FB.state === "loading") FB.state = "off";
    if (FB.state === "off") fbPromise = null; /* agli koshish par retry */
  });
  return fbPromise;
}
function fbDetach(){
  if (FB.unsubL){ try{ FB.unsubL(); }catch(e){} FB.unsubL = null; }
  if (FB.unsubC){ try{ FB.unsubC(); }catch(e){} FB.unsubC = null; }
  FB.artId = null;
}
function fbSyncMyLikes(id){
  var i = FB.myLikes.indexOf(id);
  if (FB.liked && i < 0) FB.myLikes.push(id);
  if (!FB.liked && i >= 0) FB.myLikes.splice(i, 1);
  lsSet("pf_mylikes", FB.myLikes);
}
function fbPaintLike(){
  var btn = document.getElementById("likeBtn"); if (!btn) return;
  btn.classList.toggle("liked", !!FB.liked);
  btn.innerHTML = ic(FB_HEART, !!FB.liked) + '<span>' + esc(FB.liked ? t("likedLbl") : t("likeLbl")) + '</span>'
    + (FB.count !== null && FB.count !== undefined ? '<span class="like-n">' + FB.count + '</span>' : '');
}
function fbPaintCommentsNote(txt){
  var title = document.getElementById("cmtTitle"); if (title) title.textContent = t("comments") + " (0)";
  var list = document.getElementById("cmtList"); if (list) list.innerHTML = '<p class="cmt-note">' + esc(txt) + '</p>';
}
function fbPaintOffline(){ FB.count = null; fbPaintLike(); fbPaintCommentsNote(t("cmtNet")); }
function fbPaintComments(items){
  var title = document.getElementById("cmtTitle"); if (title) title.textContent = t("comments") + " (" + items.length + ")";
  var list = document.getElementById("cmtList"); if (!list) return;
  if (!items.length){ list.innerHTML = '<p class="cmt-note">' + esc(t("cmtEmpty")) + '</p>'; return; }
  list.innerHTML = items.map(function(cm){
    var when = "";
    try{ var d = (cm.ts && cm.ts.toDate) ? cm.ts.toDate() : new Date(); when = relTime(d.toISOString(), S.lang); }catch(e){}
    return '<div class="cmt-item"><div class="cmt-meta"><span class="cmt-name">' + esc(cm.name || t("cmtGuest")) + '</span><span class="cmt-time">' + esc(when) + '</span></div><div class="cmt-text">' + esc(cm.text) + '</div></div>';
  }).join("");
}
function fbAttachArticle(id){
  fbDetach();
  FB.artId = id; FB.count = null; FB.liked = FB.myLikes.indexOf(id) >= 0;
  fbPaintLike();
  fbEnsure().then(function(){
    if (FB.artId !== id) return;
    if (FB.state !== "ready" || !FB.db){ fbPaintOffline(); return; }
    var db = FB.db;
    FB.unsubL = db.collection("likes").doc(id).collection("voters").onSnapshot(function(snap){
      if (FB.artId !== id) return;
      FB.count = snap.size;
      FB.liked = !!FB.uid && snap.docs.some(function(d){ return d.id === FB.uid; });
      fbSyncMyLikes(id); fbPaintLike();
    }, function(){ if (FB.artId === id) fbPaintOffline(); });
    FB.unsubC = db.collection("comments").doc(id).collection("items").orderBy("ts", "desc").limit(100).onSnapshot(function(snap){
      if (FB.artId !== id) return;
      var items = [];
      snap.forEach(function(d){ var v = d.data() || {}; items.push({ name: (v.name == null ? "" : String(v.name)), text: (v.text == null ? "" : String(v.text)), ts: v.ts }); });
      fbPaintComments(items);
    }, function(){ if (FB.artId === id) fbPaintOffline(); });
  });
}
function fbToggleLike(){
  var id = FB.artId || cur.param; if (!id) return;
  if (FB.state !== "ready" || !FB.uid || !FB.db){ toast(t("cmtNet")); fbAttachArticle(id); return; }
  var was = FB.liked, prev = FB.count;
  FB.liked = !was;
  if (FB.count !== null && FB.count !== undefined) FB.count = Math.max(0, FB.count + (FB.liked ? 1 : -1));
  fbSyncMyLikes(id); fbPaintLike();
  var ref = FB.db.collection("likes").doc(id).collection("voters").doc(FB.uid);
  var p = FB.liked ? ref.set({}) : ref.delete();
  if (p && p.catch) p.catch(function(){ FB.liked = was; FB.count = prev; fbSyncMyLikes(id); fbPaintLike(); toast(t("cmtNet")); });
}
function fbPostComment(){
  var ta = document.getElementById("cmtInput"); if (!ta) return;
  var text = ta.value.replace(/^\s+|\s+$/g, ""); if (!text) return;
  var id = FB.artId || cur.param; if (!id) return;
  if (FB.state !== "ready" || !FB.uid || !FB.db){ toast(t("cmtNet")); return; }
  var btn = document.getElementById("cmtPostBtn"); if (btn) btn.disabled = true;
  var name = (PREFS.name || "").replace(/^\s+|\s+$/g, "") || t("cmtGuest");
  FB.db.collection("comments").doc(id).collection("items").add({
    name: name, text: text.slice(0, 500),
    ts: firebase.firestore.FieldValue.serverTimestamp(), uid: FB.uid
  }).then(function(){
    ta.value = "";
    var cc = document.getElementById("cmtCount"); if (cc) cc.textContent = "0/500";
    if (btn) btn.disabled = false;
  }).catch(function(){ if (btn) btn.disabled = false; toast(t("cmtNet")); });
}
document.addEventListener("input", function(e){
  if (e.target && e.target.id === "cmtInput"){ var cc = document.getElementById("cmtCount"); if (cc) cc.textContent = e.target.value.length + "/500"; }
});
