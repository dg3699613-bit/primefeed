      "en": {
        "title": "From 154 for 9 to History: Shadab Khan's Record 113 Breaks a 51-Year-Old Mark as Pakistan Beat England by One Wicket",
        "summary": "Pakistan were reeling at 154 for 9 chasing 242 against England in Lahore, but Shadab Khan's unbeaten 113 and a record 89-run last-wicket stand with Haris Rauf sealed a famous one-wicket win. The victory also took Pakistan into the ODI tri-series final.",
        "body": "Some innings win matches. Shadab Khan's on Sunday night in Lahore rewrote two record books at once. Chasing 242 against England in the third match of the ODI tri-series, Pakistan had collapsed to 103 for 6 when Shadab walked in at No. 8, and were 154 for 9 — beaten, by every reasonable measure — when last man Haris Rauf joined him. What followed was an unbeaten 113 off 96 balls from Shadab, the highest score ever made by a batter at No. 8 or lower in men's One-Day International cricket, and an unbroken tenth-wicket partnership of 89 runs with Rauf, the largest tenth-wicket stand in a successful ODI run chase in the game's history. Pakistan finished on 243 for 9 in 47.1 overs, winning by one wicket with 17 balls to spare, and booked their place in the tri-series final on October 31 with a perfect record of three wins from three matches.\n\nTo understand the scale of the rescue, it is worth sitting with the scorecard's arithmetic. England's 241 all out, made in 46.4 overs, was a modest total but not a trivial one on a Lahore surface offering something for the bowlers, and Pakistan's reply disintegrated in instalments. Six wickets were down for 103 when Shadab arrived — the chase already in the hands of the lower order — and the slide continued around him. By the 34th over, Pakistan were 154 for 9: nine wickets down, 88 runs still required, one batter at the crease who was a bowling all-rounder by trade, and a No. 11 in Rauf whose job amounted to surviving long enough for the other man to do something miraculous. Pakistan's captain, Shaheen Shah Afridi, described it afterwards with a shake of the head. \"I can't say anything. To be very honest, I've never seen (anything) like that in my life,\" Shaheen said. \"I'm so happy for Shadab Khan. He played an unbelievable innings. I did a victory lap with him because I have never seen anything like that in my life.\"\n\nShadab's innings was constructed in two distinct halves, and the discipline of the first is what made the second possible. When he walked in at 103 for 6, the match situation forbade adventurism: England's bowlers had their tails up, the required rate was climbing, and every additional wicket shortened Pakistan's chances from slim to theoretical. Shadab's response was to treat the innings as a long negotiation — rotating strike, protecting his partners from the strike bowlers where he could, and refusing the low-percentage shots that had accounted for the top order. As wickets continued to fall at the other end, the negotiation became a siege. The ninth wicket went down at 154, and the equation simplified to its starkest form: Shadab, on strike or farming it, had to score almost all of 88 runs himself, against a full-strength attack, without making a single fatal mistake — while Rauf's job was simply, and terrifyingly, to still be there at the end of each over. Rauf finished unbeaten on 7 off 19 balls. In the context of the partnership, those 19 balls were worth as much as many fifties: every over he survived transferred the problem back to England, whose fielders could feel the game draining away one blocked ball at a time. With a No. 11 at the other end, the set batter must also find boundaries early enough in each over to keep the rate, but delay the strike-turning single until the over's final balls, so the tailender faces the fewest possible deliveries. Shadab executed that pattern with a discipline that belied the chaos around him.\n\nThe climax arrived with Shadab in the nineties and the finish line suddenly visible. On 97, he was given out lbw to Gus Atkinson — a decision that, had it stood, would have ended the innings, the match and the miracle in a single moment. Shadab reviewed. The replay showed what he had felt: a thick inside edge onto the pad. The decision was overturned, and the reprieve detonated what remained of England's composure. Shadab responded with consecutive boundaries off Atkinson to bring up his hundred — a maiden ODI century, raised from No. 8, in a chase that had been dead — and then launched a six later in the same over that left Pakistan needing just three runs. It was left to Rauf, of all people, to apply the final touch: facing debutant Henry Crocombe, handed the 48th over with three runs to defend and a No. 11 on strike, the fast bowler drove the winning boundary down the ground, and Lahore erupted.\n\nEngland's 241 had been a constructed total, and it had a clear author. Ben Duckett's 105 was an innings of sustained problem-solving: where partners came and went — captain Harry Brook among them, dismissed for a single run — Duckett kept the innings' spine intact, working Pakistan's spinners through the middle overs and choosing his moments against the seamers. Sam Curran's 42 provided the late thrust that pushed the total into territory England's bowlers could defend. Those bowlers were kept in check, from the other side, by the man who would end the night as the winning captain: Shaheen took four wickets, a return that kept England below the 260-plus their platform at various points had threatened. England were also bowled out in 46.4 overs, leaving 20 balls of their allocation unused — on a night decided by one wicket and 17 balls, those were runs never scored.\n\nThe first of the records is the individual one. Shadab's 113 not out is now the highest score by a batter at No. 8 or lower in the history of men's ODI cricket. The mark he surpassed was an even hundred, reached twice before: by Ireland's Simi Singh, who made an unbeaten 100 against South Africa in 2021, and by Bangladesh's Mehidy Hasan Miraz, whose unbeaten 100 against India became an instant classic of the genre. Batters at eight are bowlers who can bat, or all-rounders kept in reserve; they face the old ball, the set fields and the death overs, usually with a brief to improvise quick runs rather than build an innings. A hundred from No. 8 requires an early collapse, a long tail, a defendable target, and a player with the technique and temperament to bat for two hours in a format that normally gives him twenty minutes. Shadab's innings had all of it, plus a finale none of its predecessors could match: his hundred did not merely decorate a lost cause or pad a total; it won the match, with the last pair at the crease. He finished with 13 fours and five sixes, at a strike rate near 118, having outlasted four partners and managed a No. 11 through some fifteen overs of exposure.\n\nThe second record is the partnership, and it carries the richer history. Eighty-nine unbroken runs for the tenth wicket is the highest last-wicket stand ever compiled in a successful ODI chase, surpassing one of the most famous passages in the game's history. At Edgbaston on June 11, 1975, in the very first World Cup, Pakistan made 266 for 7 against the West Indies — Majid Khan 60, Mushtaq Mohammad 55, Wasim Raja 58 — and, despite Sarfraz Nawaz taking four wickets, the West Indies' ninth wicket fell at 203 with 64 runs still needed. Wicketkeeper Deryck Murray, who finished unbeaten on 61, and fast bowler Andy Roberts, unbeaten on 24, added an unbroken 64 to carry the West Indies home with two balls to spare; Pakistan went out in the group stage, while the West Indies went on to win the inaugural World Cup. Roberts later told Reuters: \"Pakistan helped us because they bowled their best bowler out — Sarfraz. I think I only faced one ball from Sarfraz. And to be honest, at no stage did I think we would lose.\" For 51 years, that 64 not out stood as the benchmark. Shadab and Rauf extended it by 25 runs, against a modern attack, in an era of deeper analysis, stronger fielding and vastly more athletic attacks. Their 89 not out is also the fourth-highest tenth-wicket partnership in all ODI cricket, behind Viv Richards and Michael Holding's 106 not out for the West Indies against England in 1984, Mohammad Amir and Saeed Ajmal's 103 for Pakistan against New Zealand in 2009, and Ravi Rampaul and Kemar Roach's 99 not out for the West Indies against India in 2011 — and ahead of Aayan Afzal Khan and Hazrat Bilal's 83 not out for the UAE against Nepal in 2022.\n\nThat such stands are so rare is built into their structure: the set batter must score at close to the required rate while facing only part of the bowling, and the No. 11 must survive against bowlers attacking the stumps with their best deliveries, over after over, with England needing one good ball. They nearly got it — the lbw against Shadab on 97 was, for the seconds it took to review, the winning moment of the match — and the inside edge that saved him was measured in millimetres. Last-wicket stands that win chases are not built on dominance but on the sustained avoidance of a single error.\n\nEngland's part in the drama should not be forgotten, because for most of the evening they were the better side, and their attack defended 241 with enough skill to reduce Pakistan to 154 for 9 — a winning position on ninety-nine evenings out of a hundred. Brook was honest afterwards about where the match had been shaped. \"I'm sure Shadab would say it was [one of the best innings],\" Brook said. \"It was an unbelievable knock. The bowlers did an exceptional job for us. We probably didn't quite get enough runs.\"\n\nFor Pakistan, the consequences are immediate and pleasant. Three wins from three matches have them top of the tri-series table and already through to the final at Lahore on October 31, with the luxury of managing workloads and combinations in their remaining group fixture. Sri Lanka, the third side in the series, and England — winless from two matches and anchored to the bottom of the table — must scrap for the other place in the final, with England's tournament now dependent on beating Sri Lanka and on results elsewhere. The larger significance, though, sits in the dressing room. The tri-series, staged in Lahore as the centrepiece of Pakistan's home season, had been framed as a testing ground for a question that has followed Pakistan's ODI side for several seasons: the absence of a lower-order batter who can be trusted to finish chases when the specialists are gone. Shadab, long valued as a leg-spinner who could bat, has now produced the definitive proof that his batting can carry a match on its own. For both the highest score by a No. 8-or-lower batter and the highest tenth-wicket stand in a successful chase to be rewritten in the same innings, by the same partnership, on the same night, is the statistical signature of how far outside the normal shape of a cricket match this one travelled — and why Sunday's innings will be cited whenever a chase reaches nine down with runs still needed, in the same sentence as Edgbaston, 1975."

        "body": "आठ साल पुराना आपराधिक मानहानि का मामला सोमवार को राहुल गांधी के बरी होने के साथ समाप्त हो गया। उत्तर प्रदेश के सुल्तानपुर की एक विशेष सांसद/विधायक अदालत ने कांग्रेस नेता को उस आरोप से मुक्त कर दिया जो मई 2018 में बेंगलुरु में एक संवाददाता सम्मेलन में अमित शाह — तब भारतीय जनता पार्टी के राष्ट्रीय अध्यक्ष, अब केंद्रीय गृह मंत्री — के बारे में की गई उनकी टिप्पणियों से उपजा था। अतिरिक्त मुख्य न्यायिक मजिस्ट्रेट शुभम वर्मा, जिन्होंने गांधी की अदालत में उपस्थिति में फैसला सुनाया, ने कहा कि प्रश्नगत टिप्पणियां मानहानिकारक प्रकृति की नहीं थीं। रायबरेली से 56 वर्षीय सांसद, जो फैसले के लिए सुल्तानपुर गए थे, ने आदेश सुना, अदालत को नमस्ते किया और चले गए।\n\nमामला 4 अगस्त 2018 को शुरू हुआ, जब स्थानीय भाजपा नेता और सुल्तानपुर जिला सहकारी बैंक के पूर्व अध्यक्ष विजय मिश्रा ने गांधी के खिलाफ आपराधिक शिकायत दर्ज की। शिकायत में भारतीय दंड संहिता की धाराएं 499 और 500 लगाई गईं — वे प्रावधान जो मानहानि को परिभाषित करते हैं और उसकी सजा निर्धारित करते हैं, जो दो साल तक के साधारण कारावास, या जुर्माना, या दोनों तक हो सकती है। मिश्रा का मामला कर्नाटक विधानसभा चुनाव अभियान के दौरान गांधी की टिप्पणियों पर टिका था: बेंगलुरु में एक संवाददाता सम्मेलन में तत्कालीन कांग्रेस अध्यक्ष ने उस हत्या के मामले की ओर इशारा करके भाजपा नेतृत्व को निशाना बनाया था जिसमें शाह कभी आरोपी रहे थे। शिकायत में दर्ज और कार्यवाही के दौरान रिपोर्ट की गई बातों के अनुसार, गांधी ने कुछ इस तरह कहा था कि भारत के लोग भूल जाते हैं कि भाजपा के अध्यक्ष एक हत्या के आरोपी हैं — \"यही सच्चाई है\" — और कि जो पार्टी ईमानदारी और शालीनता की बात करती है, उसका अध्यक्ष वह व्यक्ति है जिस पर हत्या का आरोप लगा है। मिश्रा का कहना था कि टिप्पणियों ने भाजपा कार्यकर्ताओं की भावनाओं को ठेस पहुंचाई और पार्टी को नुकसान पहुंचाया। मामले के दौरान भाजपा का व्यापक आरोप यह रहा कि गांधी ने शाह को \"हत्या के आरोपी\" बताया और उन पर आपराधिक मामले बताए, जबकि शाह को वर्षों पहले एक अदालत ने डिस्चार्ज कर दिया था।\n\n\"हत्या के आरोपी\" का संदर्भ सोहराबुद्दीन शेख मामले से था। सोहराबुद्दीन शेख को 2005 में गुजरात पुलिस के साथ एक मुठभेड़ में मारा गया था, एक ऐसी कार्रवाई में जिसे जांचकर्ताओं ने बाद में फर्जी बताया; उनकी पत्नी कौसर बी की भी मृत्यु हो गई। शाह, जो तब गुजरात के गृह राज्य मंत्री थे, को 2010 में केंद्रीय जांच ब्यूरो (सीबीआई) ने मामले के संबंध में गिरफ्तार किया और बाद में जमानत पर रिहा कर दिया गया। दिसंबर 2014 में एक विशेष सीबीआई अदालत ने शाह को डिस्चार्ज कर दिया, यह कहते हुए कि सबूत उन्हें मुकदमे में खड़ा करने के लिए अपर्याप्त हैं — डिस्चार्ज का मतलब है कि मामला मुकदमा शुरू होने से पहले ही समाप्त हो जाता है, इस आधार पर कि एकत्रित सामग्री आगे बढ़ने को न्यायोचित नहीं ठहराती। यही डिस्चार्ज सुल्तानपुर में शिकायतकर्ता के तर्क की रीढ़ था: चूंकि एक अदालत ने गांधी के बोलने से चार साल पहले शाह को मुकदमे का सामना करने से भी मुक्त कर दिया था, इसलिए 2018 में उन्हें \"हत्या के आरोपी\" कहना, शिकायत का तर्क था, उचित राजनीतिक टिप्पणी के बजाय एक मानहानिकारक झूठ था। लंबी कार्यवाही के दौरान गांधी का बचाव विपरीत पाठ पर टिका था — कि उनके शब्द उस ऐतिहासिक तथ्य का संदर्भ देते थे कि शाह उस मामले में आरोपी रहे थे, एक सार्वजनिक व्यक्ति के बारे में सार्वजनिक रिकॉर्ड का मामला, जो एक राजनीतिक प्रतिद्वंद्वी के बारे में चुनाव अभियान की गर्मी में कहा गया।\n\nमुकदमा खुद इसी अंतर पर मुड़ा। शिकायतकर्ता की सामग्री बेंगलुरु संवाददाता सम्मेलन की रिकॉर्डिंग पर निर्भर थी, और मिश्रा के वकील ने चोट को इस सुझाव के रूप में रखा कि जिस व्यक्ति को एक अदालत ने डिस्चार्ज कर दिया था, वह लंबित आरोप के बादल के नीचे रहा। गांधी पक्ष ने उन्हीं रिकॉर्डिंग से विपरीत जोर के साथ जवाब दिया कि शब्द, संदर्भ में, यह कहते थे कि शाह एक हत्या के मामले में आरोपी रहे थे — भाजपा के नैतिक दावों के बारे में एक तर्क के रूप में, किसी अदालत फाइल की स्थिति के बारे में सूचना के रूप में नहीं। मजिस्ट्रेट का निष्कर्ष — कि टिप्पणियां मानहानिकारक प्रकृति की नहीं थीं — ने उस प्रतियोगिता को गांधी के पक्ष में निपटाया। पूर्ण तर्क तभी ज्ञात होगा जब लिखित आदेश का अध्ययन होगा।\n\nअगस्त 2018 में दर्ज शिकायत अपने पहले पांच वर्षों में धीमी चली। अदालत ने 27 नवंबर 2023 को गांधी को समन जारी किया। वे 20 फरवरी 2024 को सुल्तानपुर अदालत में उपस्थित हुए और उन्हें व्यक्तिगत बांड पर जमानत मिली, 2024 के आम चुनाव की तैयारी के बीच। 2024, 2025 और 2026 तक मुकदमा सबूतों और तर्कों के माध्यम से आगे बढ़ा, जिसमें गांधी का प्रतिनिधित्व वकील काशी प्रसाद शुक्ला ने किया। एक सहायक लड़ाई में शिकायतकर्ता ने गांधी की आवाज का नमूना लेने के लिए आवेदन किया, संभवतः 2018 के संवाददाता सम्मेलन की रिकॉर्डिंग से मिलान के लिए; निचली अदालत ने मई 2026 में उस आवेदन को खारिज कर दिया, और अस्वीकृति के खिलाफ मिश्रा की चुनौतियों को सत्र न्यायालय और इलाहाबाद उच्च न्यायालय ने खारिज कर दिया। सुनवाई पूरी होने के बाद फैसला सुरक्षित रखा गया और निर्णय शुरू में 13 अक्टूबर के लिए तय था; फिर उसे 26 अक्टूबर तक टाला गया, जब मजिस्ट्रेट वर्मा ने कड़ी सुरक्षा के बीच अदालत में बरी करने का फैसला सुनाया।\n\nअदालत परिसर के अंदर, उच्च-प्रोफ़ाइल सुनवाई के लिए सुरक्षा कड़ी की गई थी, और इकट्ठा हुए कांग्रेस कार्यकर्ताओं ने फैसले को पटाखों, ढोलों और मिठाइयों के वितरण के साथ मनाया, पार्टी के झंडे लहराते हुए। कांग्रेस एमएलसी दीपक सिंह ने फैसले का स्वागत किया, कहा कि कांग्रेस अदालत के निर्णय को स्वीकार करती है, कि सच्चाई की जीत हुई है, और कि गांधी को लंबी कार्यवाही के दौरान कठिनाइयों का सामना करना पड़ा था। रिपोर्टों के अनुसार, दिन में पहले सुल्तानपुर जाते समय गांधी के काफिले के कुछ वाहन पूर्वांचल एक्सप्रेसवे पर टकरा गए, हालांकि गांधी खुद अदालत गए और अपना कार्यक्रम पूरा किया, जिसमें एक मृत पार्टी कार्यकर्ता के बेटे के परिवार के प्रति संवेदना यात्रा शामिल थी।\n\nबरी होना 2023 में घटी घटना की वजह से अतिरिक्त वजन रखता था। उस वर्ष मार्च में गुजरात के सूरत की एक अदालत ने 2019 के चुनाव अभियान की उनकी \"मोदी उपनाम\" टिप्पणी पर एक अलग आपराधिक मानहानि मामले में गांधी को दोषी ठहराया, और उन्हें दो साल के कारावास की सजा सुनाई — धारा के तहत अधिकतम, और ठीक वह सीमा जो जन प्रतिनिधित्व अधिनियम के तहत संसद से अयोग्यता को ट्रिगर करती है। गांधी ने संक्षेप में अपनी लोकसभा सीट खो दी, इससे पहले कि सर्वोच्च न्यायालय ने सजा पर रोक लगाई, अन्य बातों के अलावा अपने निर्वाचन क्षेत्र के मतदाताओं के लिए एक बेरोक सजा के परिणामों को देखते हुए, और उनकी सदस्यता बहाल हो गई। सुल्तानपुर मामले में वही धाराएं और वही सैद्धांतिक अधिकतम सजा शामिल थीं; इसलिए इसका बरी होना न सिर्फ एक मामला बंद करता है, बल्कि उस भेद्यता का दूसरा मोर्चा भी। भाजपा के लिए, जिसने शिकायतकर्ता के माध्यम से तर्क दिया था कि गांधी के शब्द टिप्पणी से झूठ की सीमा पार कर गए थे, फैसला उस लंबे समय से चल रहे तर्क में एक झटका है जो पार्टी गांधी की बयानबाजी के बारे में देती आई है — कि वे बिना आधार के उसके नेताओं के खिलाफ गंभीर आरोप लगाते हैं। कांग्रेस के लिए, फैसला चुनावी भाषण के उतार-चढ़ाव के बारे में एक न्यायिक समर्थन के रूप में पढ़ा जाएगा।\n\nबरी होना एक राजनीतिक रूप से संवेदनशील पल में भी आया है: गांधी वर्तमान में मतदाता सूचियों के विवादास्पद संशोधन — विशेष गहन पुनरीक्षण, जिसके माध्यम से, विपक्ष का आरोप है, मृत लोगों और अवैध आप्रवासियों के नामों को इस तरह से संभाला जा रहा है जो असली मतदाताओं को खतरे में डालता है — पर प्रधानमंत्री नरेंद्र मोदी और मुख्य चुनाव आयुक्त के खिलाफ एक संयुक्त विपक्षी अभियान का नेतृत्व कर रहे हैं। कांग्रेस और उसके सहयोगी नियमित रूप से आरोप लगाते हैं कि जांच एजेंसियों और आज्ञाकारी शिकायतकर्ताओं का इस्तेमाल विपक्षी नेताओं को उलझाए रखने के लिए किया जाता है — एक आरोप जिसे वे मतदाता सूची संशोधन तक बढ़ाते हैं, जिसे पार्टी कागजी कार्रवाई द्वारा मताधिकार हरण बताती है। भाजपा नियमित रूप से जवाब देती है कि कोई भी कानून से ऊपर नहीं है, कि अदालतों ने गांधी के खिलाफ भी बार-बार फैसले दिए हैं जितने उनके पक्ष में — सुल्तानपुर की तरह सूरत भी — और कि एक राजनेता जो प्रतिद्वंद्वियों के खिलाफ गंभीर आरोप लगाता है, वह शिकायत नहीं कर सकता जब प्रतिद्वंद्वी कानून द्वारा दिए गए उपायों का उपयोग करते हैं।\n\nइस तरह के शिकायत मामले में बरी होने को शिकायतकर्ता उच्च न्यायालय के समक्ष, उस अदालत की अनुमति से, चुनौती दे सकता है, और शिकायतकर्ता का उपाय, यदि वह उसे आगे बढ़ाने का चुनाव करता है, इलाहाबाद उच्च न्यायालय के समक्ष बरी होने के खिलाफ अपील में है। फैसले से पहले मिश्रा के वकील संतोष पांडेय ने कहा था कि उनका मुवक्किल अदालत जो भी तय करे स्वीकार करेगा — क्या वह स्वीकृति लिखित फैसले का विस्तृत तर्क उपलब्ध होने के बाद बनी रहती है, यह देखना बाकी है। गांधी के भाषणों से उपजी अन्य मानहानि शिकायतें अपनी-अपनी अदालतों में विभिन्न चरणों में बनी हुई हैं। गांधी के तत्काल कार्यक्रम के लिए, व्यावहारिक प्रभाव सरल है: विपक्ष के नेता अपनी सीट पर तलवार लटके बिना मतदाता सूची पुनरीक्षण अभियान में लौटते हैं, और कांग्रेस को एक अदालती सुर्खी मिलती है जिसे वह सर्दियों की राजनीतिक लड़ाइयों में ले जा सकती है।"
      },
      "en": {
        "title": "Eight Years On, Rahul Gandhi Walks Free: Sultanpur Court Acquits Him in Defamation Case Over 2018 Remark on Amit Shah",
        "summary": "A court in Sultanpur, Uttar Pradesh, on Monday acquitted Congress leader Rahul Gandhi in a defamation case linked to a 2018 election campaign speech. The complaint had been filed by a BJP member over a remark about Amit Shah.",
        "body": "An eight-year-old criminal defamation case against Rahul Gandhi ended on Monday with his acquittal. A special MP/MLA court in Sultanpur, Uttar Pradesh, cleared the Congress leader of the charge arising from remarks he made about Amit Shah — then the Bharatiya Janata Party's national president, now the Union Home Minister — at a press conference in Bengaluru in May 2018. Additional Chief Judicial Magistrate Shubham Verma, who delivered the verdict with Gandhi present in the courtroom, held that the remarks in question were not defamatory in nature. The 56-year-old MP from Raebareli, who had travelled to Sultanpur for the pronouncement, heard the order, offered a Namaste to the court, and left.\n\nThe case began on August 4, 2018, when Vijay Mishra, a local BJP leader and former chairman of the Sultanpur District Cooperative Bank, filed a criminal complaint against Gandhi. The complaint invoked Sections 499 and 500 of the Indian Penal Code — the provisions that define defamation and prescribe its punishment, which can extend to simple imprisonment of up to two years, or a fine, or both. Mishra's case rested on comments Gandhi made during the Karnataka Assembly election campaign: at a press conference in Bengaluru, the then Congress president had targeted the BJP's leadership by pointing to the murder case in which Shah had once been an accused. As recorded in the complaint and reported during the proceedings, Gandhi said words to the effect that people in India forget that the president of the BJP is a murder accused — \"that's the truth\" — and that the party which talks about honesty and decency has a person who has been accused of murder as its president. Mishra contended that the remarks hurt the sentiments of BJP workers and damaged the party. The BJP's wider allegation through the case was that Gandhi had described Shah as a \"murder accused\" and as facing criminal cases, despite Shah having been discharged by a court years earlier.\n\nThe \"murder accused\" reference was to the Sohrabuddin Sheikh case. Sohrabuddin Sheikh was killed in an encounter with the Gujarat Police in 2005, in an operation that investigators later alleged had been staged; his wife, Kausar Bi, also died. Shah, who was then Gujarat's minister of state for home, was arrested by the Central Bureau of Investigation in 2010 in connection with the case and later released on bail. In December 2014, a special CBI court discharged Shah, holding that the evidence was insufficient to put him on trial — a discharge ends the case before trial begins, on the ground that the material collected does not justify proceeding. That discharge formed the spine of the complainant's argument in Sultanpur: since a court had cleared Shah of even facing trial four years before Gandhi spoke, describing him in 2018 as a \"murder accused\", the complaint argued, was a defamatory falsehood rather than fair political comment. Gandhi's defence was anchored in the opposite reading — that his words referred to the historical fact that Shah had been an accused in the case, a matter of public record about a public figure, spoken in the heat of an election campaign about a political opponent.\n\nThe trial turned on that distinction. The complainant's material relied on recordings of the Bengaluru press conference, and Mishra's counsel framed the injury as the suggestion that a person a court had discharged remained under a cloud of pending accusation. Gandhi's side answered from the same recordings that the words, in context, asserted that Shah had been an accused in a murder case, as an argument about the BJP's moral claims, not as a bulletin about the state of any court file. The magistrate's conclusion — that the remarks were not defamatory in nature — resolved that contest in Gandhi's favour. The full reasoning will only be known when the written order is studied.\n\nFiled in August 2018, the complaint moved slowly for its first five years. The court issued summons to Gandhi on November 27, 2023. He appeared before the Sultanpur court on February 20, 2024, and was granted bail on personal bonds, in the middle of the build-up to the 2024 general election. Through 2024, 2025 and into 2026, the trial proceeded through evidence and arguments, with Gandhi represented by counsel Kashi Prasad Shukla. In a subsidiary battle, the complainant applied for Gandhi's voice sample to be taken, presumably to match against recordings of the 2018 press conference; the trial court rejected that application in May 2026, and Mishra's challenges to the rejection were dismissed in turn by the sessions court and by the Allahabad High Court. With hearings concluded, the verdict was reserved and the judgment was initially fixed for October 13; it was then put over to October 26, when Magistrate Verma pronounced the acquittal in a courtroom under tight security.\n\nInside the court complex, security was tightened for the high-profile hearing, and Congress workers who had gathered marked the verdict with crackers, drums and the distribution of sweets, waving party flags. Congress MLC Deepak Singh welcomed the judgment, saying the Congress accepts the court's decision, that the truth had prevailed, and that Gandhi had faced hardship through the prolonged proceedings. Some vehicles in Gandhi's convoy were involved in a collision on the Purvanchal Expressway while he was travelling to Sultanpur earlier in the day, according to reports, though Gandhi himself proceeded to court and completed his schedule, which included a condolence visit to the family of a deceased party worker's son.\n\nThe acquittal carried extra weight because of what happened in 2023. In March that year, a court in Surat, Gujarat, convicted Gandhi in a separate criminal defamation case over his \"Modi surname\" remark from the 2019 election campaign, and sentenced him to two years in prison — the maximum under the section, and precisely the threshold that triggers disqualification from Parliament under the Representation of the People Act. Gandhi briefly lost his Lok Sabha seat before the Supreme Court stayed the conviction, observing among other things the consequences that an unstayed conviction would have for his constituents, and his membership was restored. The Sultanpur case involved the same sections and the same theoretical maximum punishment; its acquittal therefore closes not just a case but a second front of that vulnerability. For the BJP, which had argued through the complainant that Gandhi's words crossed the line from comment into falsehood, the verdict is a setback in a long-running argument the party has made about Gandhi's rhetoric — that he makes serious allegations against its leaders without basis. For the Congress, the judgment will be read as a judicial endorsement of the rough-and-tumble of election speech about public figures.\n\nThe acquittal also lands at a politically charged moment: Gandhi is currently leading a united opposition campaign against Prime Minister Narendra Modi and the Chief Election Commissioner over the controversial revision of electoral rolls — the Special Intensive Revision through which, the opposition alleges, the names of dead people and illegal immigrants are being handled in ways that threaten genuine voters. The Congress and its allies routinely allege that investigative agencies and pliant complainants are deployed to keep opposition leaders entangled, a charge they extend to the electoral-roll revision, which the party describes as disenfranchisement by paperwork. The BJP routinely answers that no one is above the law, that courts have repeatedly ruled against Gandhi as well as for him — Surat as well as Sultanpur — and that a politician who makes grave allegations against rivals cannot complain when rivals invoke the remedies the law provides.\n\nAn acquittal in a complaint case of this kind can be challenged by the complainant before the High Court, with that court's leave, and the complainant's remedy, if he chooses to pursue it, lies in an appeal against acquittal before the Allahabad High Court. Before the verdict, Mishra's counsel Santosh Pandey had said his client would accept whatever the court decided — whether that acceptance survives the written judgment's detailed reasoning, once it is available, remains to be seen. Other defamation complaints arising from Gandhi's speeches remain at various stages in their respective courts. For Gandhi's immediate programme, the practical effect is simpler: the Leader of the Opposition returns to the SIR campaign without a sword over his seat, and the Congress gets a courtroom headline it can carry into the winter's political battles."

        "title": "दिन के निचले स्तर से 1,000 से ज़्यादा अंकों की छलांग: सेंसेक्स 483 अंक चढ़कर बंद, निफ़्टी 22,753 पर",
        "summary": "सोमवार को शेयर बाजार ने शुरुआती गिरावट से जोरदार वापसी की। सेंसेक्स 482.92 अंक चढ़कर 73,606.75 पर और निफ्टी 153.20 अंक बढ़कर 22,753.20 पर बंद हुआ। मेटल और फार्मा शेयरों में सबसे ज्यादा तेजी रही।",
        "body": "भारतीय शेयर बाजारों ने सोमवार 26 अक्टूबर को दृढ़ वापसी की और पिछले सप्ताह की तेज बिकवाली में गंवाई गई जमीन का एक हिस्सा वापस हासिल किया, क्योंकि कच्चे तेल की कीमतें लगभग छह महीने के उच्च स्तर से नरम हुईं और खरीदार पिटे हुए धातु और फार्मास्युटिकल शेयरों की ओर लौटे। बीएसई सेंसेक्स 73,606.75 पर बंद हुआ, 482.92 अंक यानी 0.66 प्रतिशत ऊपर, जबकि एनएसई निफ्टी 50 22,753.20 पर समाप्त हुआ, 153.20 अंक यानी 0.68 प्रतिशत अधिक। इस वापसी ने बेंचमार्क सूचकांकों की चार दिन की गिरावट की लड़ी तोड़ दी। मिड-कैप और स्मॉल-कैप शेयरों ने बेहतर प्रदर्शन किया, सत्र भर बाजार की चौड़ाई सकारात्मक रही, और निफ्टी के 50 घटकों में से 37 हरे में बंद हुए। फिर भी व्यापारी और विश्लेषक इसे नई प्रवृत्ति की शुरुआत नहीं, बल्कि एक दायरे के भीतर की वापसी बताने पर एकमत थे, क्योंकि सूचकांक अभी भी सुपरिभाषित स्तरों के बीच फंसा है और आगे वैश्विक घटनाओं का भरा कैलेंडर है।\n\nदोनों बेंचमार्क दबाव में खुले और सेंसेक्स पर 72,514.57 तथा निफ्टी पर 22,387.35 के दैनिक निम्न स्तर तक फिसल गए, जिससे पिछले सप्ताह की घबराहट आगे बढ़ी, इससे पहले कि वापसी गति पकड़ती — सेंसेक्स अपने निम्न स्तर से बंद तक 1,000 से ज़्यादा अंकों की छलांग लगा गया। निफ्टी के निम्न स्तर का तकनीकी महत्व था: 22,387 पर सूचकांक शुक्रवार के निम्न स्तर 22,372 के बिल्कुल करीब आया और उसे बनाए रखा। एचडीएफसी सिक्योरिटीज के डिप्टी वाइस प्रेसिडेंट नंदिश शाह ने अपने बाजार-बाद आकलन में कहा, \"निफ्टी ने शुक्रवार के 22,372 के निम्न स्तर का बचाव किया है और दिन के उच्च स्तर के निकट बंद होने में सफल रहा।\" दोपहर की चढ़ाई ने निफ्टी को 22,800 के उस निशान के करीब बंद किया जो अब बाजार की तत्काल रेखा है। शाह ने व्यापक बाजार में खरीदारी की वापसी भी नोट की: उन्होंने कहा, \"पिछले सप्ताह की तेज बिकवाली के बाद व्यापक बाजार — मिडकैप और स्मॉलकैप सूचकांक — तेजी से वापस उछले,\" जिसमें निफ्टी मिडकैप 100 में 1.19 प्रतिशत और निफ्टी स्मॉलकैप 100 में 1.38 प्रतिशत की बढ़त दर्ज हुई।\n\nधातु और फार्मास्युटिकल सबसे आगे रहे, प्रत्येक में दिन में करीब 2 प्रतिशत की बढ़त रही। कोटक नियो की समापन गणना के अनुसार निफ्टी फार्मा सूचकांक 1.76 प्रतिशत और निफ्टी हेल्थकेयर सूचकांक 1.77 प्रतिशत बढ़ा। शेयर-स्तर पर डॉ. रेड्डीज लेबोरेटरीज निफ्टी की शीर्ष लाभार्थी रही, 6.6 प्रतिशत उछलकर, उसके बाद धातु समूह से जेएसडब्ल्यू स्टील, एक्सचेंज संचालक बीएसई, अडाणी पोर्ट्स और खाद्य-डिलीवरी व क्विक-कॉमर्स कंपनी ईटरनल रहीं। पिछड़े शेयर वित्तीय और उपभोग क्षेत्रों में केंद्रित थे: श्रीराम फाइनेंस, टाटा कंज्यूमर प्रोडक्ट्स, बजाज फाइनेंस, एचडीएफसी लाइफ और एचडीएफसी बैंक सूचकांक के प्रमुख हारने वाले थे। नामित पांच हारने वालों में से चार वित्तीय कंपनियां थीं, और बैंक व ऋणदाता निफ्टी में सबसे अधिक वजन रखते हैं, यही वजह है कि सूचकांक की 0.68 प्रतिशत बढ़त दिन की अन्यत्र की ताकत को कम करके दिखाती है। मीडिया और उपभोक्ता वस्तुओं (कंज्यूमर ड्यूरेबल्स) के शेयर भी दिन के पिछड़ों में थे।\n\nचौड़ाई के आंकड़ों ने वापसी की कहानी में एक दूसरा, शांत करने वाला स्तर जोड़ा। नेशनल स्टॉक एक्सचेंज पर 2,081 शेयर बढ़े, 1,504 घटे और 92 अपरिवर्तित रहे, कुल 3,677 शेयरों के व्यापार में से — गिनती के हिसाब से आराम से सकारात्मक सत्र। बीएसई पर बढ़त-गिरावट अनुपात 1.21 रहा, सकारात्मक लेकिन उत्साह से दूर। दिन के सबसे चौंकाने वाले आंकड़े चरमों में थे: एनएसई पर मात्र 20 शेयर नए 52-सप्ताह के उच्च स्तरों पर पहुंचे, जबकि 443 नए 52-सप्ताह के निम्न स्तरों को छू गए। यह असममितता उस बाजार का संकेत है जो ब्रेकआउट मनाने के बजाय अभी सुधार से गुजर रहा है। विश्लेषकों ने बेंचमार्क की मजबूती — निफ्टी ने दो सत्रों में दो बार अपने निम्न का बचाव किया — और उसके नीचे की क्षति के बीच अंतर किया, जिसे पिछले सप्ताह की बिकवाली ने बढ़ाया है और एक हरा सत्र जिसकी मरम्मत नहीं करता।\n\nयह वापसी उस सप्ताह के सामने मापी जाती है जो उससे पहले आया। बेंचमार्क हाल के सप्ताहों की सबसे तेज बिकवाली में लगातार चार सत्र फिसले थे, और बाजार प्रतिभागियों की रिपोर्टें दो कारकों पर एकत्रित होती हैं, दोनों बाहरी। पहला था कच्चा तेल: कीमतें पिछले सप्ताह के अंत में लगभग छह महीने के उच्च स्तर तक उछल गई थीं, सऊदी अरब पर जारी हमलों और पश्चिम एशिया से ऊर्जा आपूर्ति के बारे में बढ़ती चिंताओं के बीच। दूसरा कारक अमेरिकी 10-वर्षीय ट्रेजरी यील्ड की अस्थिरता थी, जिसके उतार-चढ़ाव उभरते बाजारों के लिए पूंजी की लागत तय करते हैं। सोमवार को तत्काल दबाव वाल्व कच्चा तेल था: तेल की कीमतें अपने उच्च स्तरों से नरम हुईं — ब्रेंट दिसंबर वायदा लगभग $110.19 प्रति बैरल और अमेरिकी वेस्ट टेक्सास इंटरमीडिएट दिसंबर वायदा लगभग $101.42 पर देर-दोपहर व्यापार में उद्धृत हुए — किसी भी निरपेक्ष अर्थ में कम कीमतें नहीं, लेकिन किनारे से एक कदम पीछे, और शुक्रवार के निम्न स्तर के बचाव के साथ मिलकर मूल्य खरीदारों और शॉर्ट-कवररों को एक साथ बाजार में लाने के लिए पर्याप्त।\n\nआने वाले दिनों के लिए तकनीकी नक्शा बंद होने के बाद प्रसारित आकलनों में दो विश्लेषकों ने असामान्य संगति से बनाया। ग्लोब कैपिटल मार्केट्स के एवीपी रिसर्च विपिन कुमार को उम्मीद है कि निफ्टी निकट अवधि में 22,180 और 23,200 के बीच दायरे में रहेगा, 22,800–22,850 पर तत्काल प्रतिरोध के साथ: उन्होंने कहा, \"22,850 के ऊपर एक निर्णायक बंद रैली को 23,200 की ओर बढ़ा सकता है,\" और नीचे की ओर जोड़ा कि \"22,500 के नीचे टूटने से सूचकांक 22,180 की ओर खिंच सकता है।\" एचडीएफसी सिक्योरिटीज के शाह ने शुक्रवार के निम्न स्तर से ऊपर वही भूगोल बनाया: उन्होंने कहा, \"निफ्टी को तेजी की प्रवृत्ति के लिए 22,800 के ऊपर टिकना होगा, जो फिर उसे 23,175 के स्तर की ओर धकेल सकता है,\" जबकि \"22,372 के नीचे टूटने से वह 22,100–22,200 के समर्थन क्षेत्र की ओर और खिंच सकता है।\" सोमवार का 22,753.20 पर बंद होना उस संकरे दायरे के शीर्ष के निकट बैठता है। कुमार की सावधानी वातावरण तक फैलती है: बढ़ती कच्चे तेल की कीमतों और अस्थिर अमेरिकी 10-वर्षीय यील्ड के बीच अस्थिरता ऊंची रहने की उम्मीद है, और उन्होंने अमेरिकी फेडरल रिजर्व के दर निर्णय, अमेरिकी महंगाई आंकड़ों और बड़ी तकनीकी कंपनियों की कमाई पर नजर रखने की सलाह दी — वैश्विक घटनाओं की एक तिकड़ी, सभी दिनों के भीतर आती हुई, जिनमें से कोई भी तेल की कीमत, डॉलर और वैश्विक जोखिम भूख को हिला सकती है जिसे भारतीय बाजारों को अगले खुलने पर सोखना होगा।\n\nकमोडिटी परिसर ने दिन के मिले-जुले संकेतों को दोहराया। मल्टी कमोडिटी एक्सचेंज पर सोना दिसंबर वायदा 0.66 प्रतिशत बढ़कर ₹1,42,964 प्रति 10 ग्राम हो गया, और चांदी दिसंबर वायदा 0.12 प्रतिशत बढ़कर ₹1,95,959 प्रति किलोग्राम हो गया — ऐसी कीमतें जो उस सुरक्षित-आश्रय बोली को दर्शाती रहती हैं जिसे भू-राजनीतिक तनाव शेयरों की वापसी वाले दिनों में भी बनाए रखता है। कंपनी समाचारों ने दिन को दो भविष्य-उन्मुख फुटनोट दिए: एलएंडटी टेक्नोलॉजी सर्विसेज ने नोकिया के साथ पांच वर्षीय समझौते की घोषणा की, जो भारत में इंजीनियरिंग सेवाओं और अनुसंधान व विकास कार्य को कवर करता है; और गोकलदास एक्सपोर्ट्स ने कहा कि वह अपने यूरोपीय व्यापार का विस्तार कर रहा है, उम्मीद है कि प्रस्तावित व्यापार सौदे के बल पर क्षेत्र की उसके निर्यात में हिस्सेदारी लगभग दोगुनी हो जाएगी, जबकि परिधान निर्यातक अमेरिकी बाजार पर अपनी पारंपरिक निर्भरता से परे विविधीकरण कर रहा है। दोनों में से किसी घोषणा ने सोमवार के सूचकांकों को नहीं हिलाया।\n\nसोमवार के लिए फैसला संकरा और वास्तविक है — गिरावट रुकी, फर्श टिका, और साबित करने का बोझ पांच सत्रों में पहली बार खरीदारों से विक्रेताओं पर चला गया। मंगलवार का खुलना, सोमवार की तरह, रात भर की घटनाओं द्वारा लिखा जाएगा — कच्चे तेल का रास्ता, वॉल स्ट्रीट का बंद और एशिया की सुबह — और क्या 22,372 का बचाव करने वाले खरीदार 22,800 की छत पर उसी विश्वास के साथ लौटेंगे, यह सत्र का पहला और सबसे जानकारीपूर्ण सवाल होगा।"

        "title": "Sensex Swings Over 1,000 Points From the Day's Low to Close 483 Up; Nifty Ends at 22,753",
        "summary": "Indian markets staged a strong recovery on Monday, recovering more than 1,000 points from the day's lows. The Sensex closed 482.92 points higher at 73,606.75 and the Nifty ended at 22,753.20, with metal and pharma stocks leading the gains.",
        "body": "Indian equities staged a determined recovery on Monday, October 26, clawing back a portion of the ground lost in last week's sharp sell-off as crude oil prices eased from near six-month highs and buyers returned to beaten-down metal and pharmaceutical stocks. The BSE Sensex closed at 73,606.75, up 482.92 points or 0.66 per cent, while the NSE Nifty 50 ended at 22,753.20, higher by 153.20 points or 0.68 per cent. The rebound snapped a four-day losing streak on the benchmarks. Mid-cap and small-cap stocks outperformed, market breadth stayed positive through the session, and 37 of the Nifty's 50 constituents ended in the green. Yet traders and analysts were united in describing it as a recovery within a range rather than the start of a new trend, with the index still trapped between well-defined levels and a crowded calendar of global events ahead.\n\nBoth benchmarks opened under pressure and slid to intraday lows of 72,514.57 on the Sensex and 22,387.35 on the Nifty, extending the nervousness of the previous week, before the recovery gathered pace — a swing of more than 1,000 points on the Sensex from its low to its close. The Nifty's low carried technical significance: at 22,387, the index came within a whisker of Friday's low of 22,372 and held it. \"The Nifty has defended its Friday's low of 22,372 and managed to close near the day's high,\" said Nandish Shah, Deputy Vice President at HDFC Securities, in his post-market assessment. The afternoon's climb carried the Nifty to a close within sight of the 22,800 mark that now stands as the market's immediate line in the sand. Shah also noted the return of buying in the broader market: \"Broader markets Midcap and Smallcap indices pulled back sharply, after last week's sharp sell-off,\" he said, recording gains of 1.19 per cent for the Nifty Midcap 100 and 1.38 per cent for the Nifty Smallcap 100.\n\nMetals and pharmaceuticals led the advance, each gaining around 2 per cent on the day; by Kotak Neo's closing tally, the Nifty Pharma index rose 1.76 per cent and the Nifty Healthcare index 1.77 per cent. Dr Reddy's Laboratories was the Nifty's top gainer, surging 6.6 per cent, followed by JSW Steel, the exchange operator BSE, Adani Ports and the food-delivery and quick-commerce company Eternal. The laggards were concentrated in finance and consumption: Shriram Finance, Tata Consumer Products, Bajaj Finance, HDFC Life and HDFC Bank were the index's principal losers — four of the five named losers were financial companies, and banks and lenders carry the heaviest weight in the Nifty, which is why the index's 0.68 per cent gain understates the day's strength elsewhere. Media and consumer durables stocks were also among the day's laggards.\n\nBreadth data added a sobering layer to the recovery. On the National Stock Exchange, 2,081 stocks advanced against 1,504 decliners, with 92 unchanged, out of 3,677 that traded. On the BSE, the advance-decline ratio stood at 1.21, positive but hardly euphoric. Only 20 stocks scaled fresh 52-week highs on the NSE, while 443 touched fresh 52-week lows — the fingerprint of a market still working through a correction rather than celebrating a breakout. Analysts drew a distinction between the benchmark's resilience — the Nifty defended its low twice in two sessions — and the damage beneath it, which last week's sell-off enlarged and one green session does not repair.\n\nThe rebound is measured against the week that preceded it. The benchmarks had slid through four consecutive sessions in the sharpest sell-off of recent weeks, and market participants converged on two drivers, both external. The first was crude oil: prices had surged to near six-month highs late last week amid continued attacks on Saudi Arabia and mounting concerns about energy supplies from West Asia. The second was the volatility of the US 10-year Treasury yield, whose gyrations set the cost of capital for emerging markets. On Monday, crude eased from its highs — Brent December futures were quoted around $110.19 a barrel and US West Texas Intermediate December futures around $101.42 in late-afternoon trade — not low prices in any absolute sense, but a step back from the ledge, and enough, combined with the defence of Friday's low, to bring value buyers and short-coverers into the market together.\n\nTwo analysts whose assessments circulated after the close drew the same map for the days ahead. Vipin Kumar, AVP Research at Globe Capital Markets, expects the Nifty to remain range-bound between 22,180 and 23,200 in the near term, with immediate resistance at 22,800–22,850: \"A decisive close above 22,850 could extend the rally towards 23,200,\" he said, adding that on the downside, \"a break below 22,500 may drag the index towards 22,180.\" Shah of HDFC Securities drew the same geography from Friday's low upward: \"Nifty has to sustain above 22,800 to turn the trend bullish, which could then push it towards 23,175 level,\" he said, while \"a break below 22,372 could drag it further down to the 22,100–22,200 support zone.\" Monday's close at 22,753.20 sits near the top of that narrow battlefield. Kumar's caution extends to the environment itself: volatility is expected to remain elevated amid rising crude prices and the volatile US 10-year yield, and he advised watching the US Federal Reserve's rate decision, US inflation data and big-tech earnings — a trio of global events, all landing within days, any one of which can move the oil price, the dollar and global risk appetite that Indian markets must then absorb at the following open.\n\nThe commodities complex echoed the day's mixed signals. On the Multi Commodity Exchange, gold December futures rose 0.66 per cent to ₹1,42,964 per 10 grams, and silver December futures added 0.12 per cent to ₹1,95,959 per kilogram — prices that continue to reflect the safe-haven bid that geopolitical tension sustains even on days when equities recover. Company news supplied two forward-looking footnotes: L&T Technology Services announced a five-year agreement with Nokia covering engineering services and research-and-development work to be executed in India; and Gokaldas Exports said it is expanding its European business, expecting the region's share of its exports to nearly double on the back of a proposed trade deal, as the apparel exporter diversifies beyond its traditional reliance on the US market. Neither announcement moved Monday's indices.\n\nFor Monday, the verdict is narrow and real: the fall stopped, the floor held, and the burden of proof passed, for the first time in five sessions, from the buyers to the sellers. Tuesday's opening will be written, as Monday's was, by overnight events — the crude price's path, Wall Street's close and Asia's morning — and whether the buyers who defended 22,372 return with the same conviction at the 22,800 ceiling will be the session's first and most informative question."

        "title": "भारत में हुंडई की पहली AI कार आ गई: 9.99 लाख रुपये में लॉन्च हुई बेयॉन, लेवल 2 ADAS के साथ",
        "summary": "हुंडई मोटर इंडिया ने सोमवार को अपनी नई एसयूवी बेयॉन लॉन्च की, जिसकी शुरुआती एक्स-शोरूम कीमत 9.99 लाख रुपये रखी गई है। यह कंपनी की पहली कार है जिसमें बिल्ट-इन जेनरेटिव एआई वॉयस असिस्टेंट दिया गया है।",
        "body": "हुंडई मोटर इंडिया ने बेयॉन लॉन्च की है, एक कॉम्पैक्ट एसयूवी जिसे कंपनी के प्रबंध निदेशक और सीईओ तरुण गर्ग ने भारत में \"अगले उत्पाद चक्र की शुरुआत\" कहा है। कीमतें ₹9.99 लाख (एक्स-शोरूम) से शुरू होती हैं, बुकिंग ₹11,000 पर डीलरशिपों और ऑनलाइन खुली है, और डिलीवरी त्योहारी सीजन में शुरू होने की उम्मीद है। बेयॉन भारत में बनी है और यहां से 50 से अधिक बाजारों में निर्यात की जाएगी।\n\nयह लाइन-अप में नीचे वेन्यू और ऊपर क्रेटा के बीच बैठती है, उन खरीदारों के लिए जो वेन्यू वर्ग को छोटा और क्रेटा को महंगा पाते हैं। 4,245 मिमी लंबी यह कार वेन्यू, टाटा नेक्सन और मारुति सुजुकी ब्रेज़ा की तरह चार मीटर से कम की कार नहीं है। ग्लोबल K एन्हैंस्ड प्लेटफॉर्म पर बनी बेयॉन का व्हीलबेस 2,600 मिमी, बूट 505 लीटर और ग्राउंड क्लीयरेंस 205 मिमी है। इसके आधार वेरिएंट चार-मीटर-से-कम एसयूवी के शीर्ष वेरिएंट के सामने हैं, जबकि मैनुअल और ऑटोमैटिक रूप में कई वेरिएंट में आने वाले ऊपरी ट्रिम ₹10–15 लाख बैंड में क्रेटा के निचले क्षेत्र तक पहुंचते हैं। मोनोटोन, ड्यूल-टोन और मैट फिनिश सहित दस बाहरी रंग विकल्प हैं।\n\nबेयॉन में 1.5-लीटर, चार-सिलेंडर MPi पेट्रोल इंजन है, जो 115 PS और 143.8 Nm टॉर्क देता है। इसके साथ छह-स्पीड मैनुअल गियरबॉक्स या हुंडई का iVT ऑटोमैटिक मिलता है, कंपनी की इंटेलिजेंट वेरिएबल ट्रांसमिशन, जो चेन बेल्ट से इंजीनियर की गई CVT है। लॉन्च लाइन-अप में कोई टर्बो-पेट्रोल और कोई डीजल नहीं है।\n\nकेबिन का केंद्रबिंदु दोहरी-घुमावदार पैनोरमिक डिस्प्ले है, कांच के एक ही फैलाव के नीचे दो 12.3-इंच स्क्रीन, इंस्ट्रूमेंट क्लस्टर और इंफोटेनमेंट के लिए, जो NVIDIA ग्राफिक्स द्वारा संचालित हैं। यह हुंडई का कनेक्टेड कार नेविगेशन कॉकपिट चलाता है और 70 से अधिक ब्लूलिंक कार्यों से जुड़ता है, जिनमें रिमोट संचालन, वाहन-स्वास्थ्य रिपोर्टिंग, स्थान सेवाएं और अलर्ट शामिल हैं। 19 इलेक्ट्रॉनिक नियंत्रकों तक के लिए ओवर-द-एयर अपडेट मिलते हैं, जिससे वर्कशॉप जाए बिना इलेक्ट्रॉनिक सिस्टम सुधरे और बढ़ाए जा सकते हैं, केवल नक्शे और ऐप नहीं।\n\nमुख्य आकर्षण वॉयस असिस्टेंट है। बेयॉन भारत में बिकने वाली पहली हुंडई है जिसमें बिल्ट-इन जेनरेटिव एआई वॉयस असिस्टेंट है, जो परप्लेक्सिटी और साउंडहाउंड एआई प्रौद्योगिकी के साथ विकसित किया गया है। निश्चित निर्देश पहचानने वाले पारंपरिक सिस्टमों से अलग, यह संवादी भाषा में प्राकृतिक सवाल और अनुवर्ती प्रश्न ले सकता है, जैसे यात्रा योजनाएं, गंतव्य का मौसम या समाचार, जिन्हें हुंडई उजागर करती है।\n\nहुंडई 80 से अधिक सुरक्षा सुविधाओं का दावा करती है। छह एयरबैग, इलेक्ट्रॉनिक स्थिरता नियंत्रण और हिल-स्टार्ट असिस्ट कंट्रोल मानक हैं। हुंडई स्मार्टसेंस, लेवल 2 प्रो रूप में, संयोजित कैमरा-और-रडार सेटअप पर 23 ADAS कार्य देता है। लेवल 2 का अर्थ है कि कार एक साथ स्टीयरिंग और गति दोनों में सहायता कर सकती है, जबकि ड्राइवर पूरी तरह जिम्मेदार और सतर्क रहता है।\n\nबेयॉन नाम का यूरोपीय अतीत है: मार्च 2021 में यह यूरोप के लिए हुंडई की सबसे छोटी एसयूवी के रूप में पेश हुई थी, नाम दक्षिण-पश्चिम फ्रांस के शहर बेयॉन पर रखा गया, यह तीसरी पीढ़ी की i20 पर आधारित थी और तुर्की के इज़मित में बनी थी, और जनवरी 2024 में इसका फेसलिफ्ट आया। भारतीय कार उसकी पुनर-इंजीनियरिंग है, प्रत्यारोपण नहीं: वह बड़ी है (यूरोपीय कार 2,580 मिमी व्हीलबेस पर 4,180 मिमी लंबी थी) और यूरोप के 1.0-लीटर टर्बो व 1.2-लीटर इंजनों के बजाय 1.5-लीटर पेट्रोल का उपयोग करती है।\n\nहुंडई ने दो जानकारियां अभी विस्तृत नहीं की हैं जो खरीदार चाहेंगे: वेरिएंट-वार कीमतें, क्योंकि ₹9.99 लाख केवल प्रवेश बिंदु है और पूर्ण डिस्प्ले, ADAS और एआई विशिष्टता वाले शीर्ष ट्रिमों की लागत तय करेगी कि बेयॉन वास्तव में क्रेटा के सामने कहां बैठती है, और दोनों गियरबॉक्स के साथ 1.5-लीटर इंजन के प्रमाणित ईंधन-दक्षता आंकड़े।"

      "en": {
        "title": "Hyundai's First AI Car in India Is Here: Bayon Launched at ₹9.99 Lakh With Level 2 ADAS",
        "summary": "Hyundai Motor India on Monday launched the Bayon utility vehicle with prices starting at Rs 9.99 lakh (ex-showroom). It is the company's first model in India with a built-in generative AI voice assistant, and it will be made in India for export to over 50 markets.",
        "body": "Hyundai Motor India has launched the Bayon, a compact SUV that Managing Director and CEO Tarun Garg called \"the start of the next product cycle\" in India. Prices begin at ₹9.99 lakh (ex-showroom), bookings are open at ₹11,000 at dealerships and online, and deliveries are expected during the festive season. The Bayon is built in India and will be exported to more than 50 markets.\n\nIt slots between the Venue below and the Creta above, for buyers who find the sub-four-metre class too small and the Creta too costly. At 4,245 mm long, it is not a sub-four-metre car like the Venue, the Tata Nexon and the Maruti Suzuki Brezza. On the Global K Enhanced Platform, it has a 2,600 mm wheelbase, a 505-litre boot and 205 mm of ground clearance. Its base variants sit against top variants of the sub-four-metre SUVs, while its upper trims, across multiple variants in manual and automatic form, reach into the Creta's lower reaches in the ₹10–15 lakh band. There are ten exterior colours, including monotone, dual-tone and matte finishes.\n\nPower comes from a 1.5-litre, four-cylinder MPi petrol engine producing 115 PS and 143.8 Nm of torque, with either a six-speed manual or Hyundai's iVT automatic, its intelligent variable transmission, a CVT engineered with a chain belt. There is no turbo-petrol and no diesel in the launch line-up.\n\nThe cabin's centrepiece is a dual-curved panoramic display: two 12.3-inch screens under one sweep of glass, for the instrument cluster and infotainment, powered by NVIDIA graphics. It runs Hyundai's Connected Car Navigation Cockpit and connects to more than 70 Bluelink functions, including remote operations, vehicle-health reporting, location services and alerts. Over-the-air updates cover up to 19 electronic controllers, so electronic systems, not just maps and apps, can be improved without a workshop visit.\n\nThe headline feature is the voice assistant. The Bayon is the first Hyundai sold in India with a built-in generative AI voice assistant, developed with Perplexity and SoundHound AI technology. Unlike conventional systems that recognise a fixed menu of commands, it can field natural questions and follow-ups in conversational language, such as travel plans, the weather at a destination, or the news, as Hyundai highlights.\n\nHyundai claims more than 80 safety features. Six airbags, electronic stability control and hill-start assist control are standard. Hyundai SmartSense, in Level 2 Pro form, offers 23 ADAS functions on a fused camera-and-radar setup. Level 2 means the car can assist with steering and speed together, while the driver remains fully responsible and attentive.\n\nThe name has a European past: revealed in March 2021 as Hyundai's smallest SUV for Europe, named after Bayonne in south-west France, based on the third-generation i20 and built in İzmit, Turkey, with a facelift in January 2024. The Indian car is a re-engineering, not a transplant: it is larger (Europe's car was 4,180 mm long on a 2,580 mm wheelbase) and uses the 1.5-litre petrol instead of Europe's 1.0-litre turbo and 1.2-litre engines.\n\nHyundai has not yet detailed two things buyers will want: variant-wise prices, since ₹9.99 lakh is only the entry point and the top trims carrying the full display, ADAS and AI specification will decide how it truly sits against the Creta, and certified fuel-efficiency figures for the 1.5-litre engine with both gearboxes."
      }

      "hi": {
        "title": "भारत के 11 नेविगेशन उपग्रहों में सिर्फ़ 3 काम पर — 30 अक्टूबर का NVS-03 लॉन्च NavIC के लिए संजीवनी",
        "summary": "इसरो 30 अक्टूबर को श्रीहरिकोटा से जीएसएलवी एमके II रॉकेट पर NVS-03 नेविगेशन उपग्रह लॉन्च करेगा। इससे भारत की स्वदेशी नेविगेशन प्रणाली NavIC को स्वतंत्र पोजिशनिंग के लिए जरूरी मजबूती मिलने की उम्मीद है।",
        "body": "30 अक्टूबर को श्रीहरिकोटा के सतीश धवन अंतरिक्ष केंद्र से एक जीएसएलवी एमके II रॉकेट एनवीएस-03 को लेकर उड़ान भरेगा, लगभग 2,232 किलोग्राम का एक उपग्रह जिसका काम अग्लैमरस और अनिवार्य है: भारत की अपनी नेविगेशन प्रणाली को जिंदा रखना। नाविक (NavIC) — नेविगेशन विद इंडियन कॉन्स्टेलेशन — वह क्षेत्रीय उपग्रह-नेविगेशन नेटवर्क है जिस पर भारतीय जीवन का एक बढ़ता हिस्सा चुपचाप निर्भर करता है, यात्रियों की जेबों में फोन और रेलवे नेटवर्क में ट्रैक किए जाने वाले ट्रेनों से लेकर राष्ट्रीय बिजली ग्रिड के सिंक्रनाइजेशन तक। वह इस समय धुएं पर चल रही एक प्रणाली भी है। 2013 से भारत ने जो ग्यारह नेविगेशन उपग्रह लॉन्च किए हैं, उनमें से केवल तीन वर्तमान में स्थिति, नेविगेशन और समय (PNT) सेवाएं देने के लिए कार्यात्मक हैं। एक स्वतंत्र नेविगेशन फिक्स के लिए न्यूनतम चार चाहिए। एनवीएस-03, जो मंजूरी के लिए लगभग तीन महीनों से श्रीहरिकोटा में इंतजार कर रहा है, वह पूर्ति है जिस पर अब तारामंडल की विश्वसनीयता टिकी है — और उसका लॉन्च, जिसकी पुष्टि इसरो अध्यक्ष डॉ. वी. नारायणन ने 15–20 अक्टूबर की एक पहले अस्थायी खिड़की को आगे बढ़ाए जाने के बाद की, परिणामस्वरूप वर्ष के सबसे परिणामी भारतीय अंतरिक्ष मिशनों में से एक है।\n\nस्थिति, नेविगेशन और समय सेवाओं के लिए वर्तमान में कार्यात्मक तीन उपग्रह आईआरएनएसएस-1बी, आईआरएनएसएस-1एल और आईआरएनएसएस-1जे हैं — अंतिम वाला एनवीएस-01 है, दूसरी पीढ़ी की एनवीएस श्रृंखला का पहला उपग्रह। दृष्टि में चार से कम उपग्रहों के साथ, एक नेविगेशन रिसीवर एक स्वतंत्र त्रि-आयामी स्थिति की गणना बिल्कुल नहीं कर सकता। समय सेवाएं अधिक मजबूत हैं — एक ही उपग्रह एक घड़ी को अनुशासित करने के लिए पर्याप्त है — इसीलिए नाविक के समय उपयोगकर्ता कम जोखिम में रहे हैं। लेकिन तारामंडल का मुख्य वादा, भारत और उसकी सीमाओं से 1,500 किमी तक फैले क्षेत्र में स्थिति निर्धारण, वर्तमान में एक तिकड़ी पर टिका है जहां डिज़ाइन सात की मांग करता है। उस विफलता से पहले ही, सरकार ने पिछले वर्ष संसद को बताया था कि लॉन्च किए गए ग्यारह नेविगेशन उपग्रहों में से केवल चार PNT सेवाओं के लिए परिचालन में थे। यह नाजुकता इस वर्ष मार्च में गहरी हुई, जब आईआरएनएसएस-1एफ पर लगी खरीदी गई परमाणु घड़ी 13 मार्च को काम करना बंद कर गई; इसरो के 14 मार्च के बयान ने विफलता की पुष्टि की, यह नोट करते हुए कि उपग्रह एकतरफा प्रसारण संदेश के लिए उपयोग होता रहता है लेकिन अब स्थिति निर्धारण में योगदान नहीं देता।\n\nनुकसानों का एक पैटर्न है। जुलाई 2013 से लगभग ₹2,250 करोड़ की प्रणाली के लिए ग्यारह लॉन्च; छह उपग्रह रास्ते में विफल हुए — मुख्य रूप से, कार्यक्रम के आवर्ती दुर्भाग्य में, दोषपूर्ण आयातित परमाणु घड़ियों के कारण, कुछ नुकसान कक्षीय मुद्दों से। एनवीएस-02, जनवरी 2025 में आईआरएनएसएस-1के के रूप में लॉन्च हुआ, इंजन विफलता का शिकार हुआ और अपनी इरादा की गई कक्षा तक नहीं पहुंच सका। पैटर्न लॉन्च विफलता का नहीं है — भारत के रॉकेटों ने आम तौर पर इन उपग्रहों को अंतरिक्ष तक पहुंचाया है — बल्कि कक्षा में युवा मरने वाले उपग्रहों का है, घटक स्तर पर। यही बात इस लॉन्च को एक नियमित पूर्ति के बजाय संजीवनी बनाती है: एनवीएस-03 केवल क्षमता नहीं जोड़ता, वह वह चार-उपग्रह न्यूनतम बहाल करता है जिसके बिना स्वतंत्र स्थिति निर्धारण संभव ही नहीं है।\n\nएनवीएस-03 खुद तारामंडल को दो अक्षों पर मजबूत करने के लिए बना है: जीवित रहना और उपयोगिता। एनवीएस-01 की तरह उसके पहले, यह उन नेविगेशन पेलोड को लिए है जिनमें L1 बैंड शामिल है — दुनिया के बड़े-बाजार स्थिति चिपों द्वारा उपयोग किया जाने वाला संकेत बैंड, और इसलिए वह बैंड जो नाविक को केवल विशेष रिसीवरों के बजाय साधारण स्मार्टफोन के साथ स्वाभाविक रूप से संगत बनाता है। पहली पीढ़ी के आईआरएनएसएस उपग्रह L5 और एस बैंड में प्रसारित करते थे, जो रणनीतिक और विशेष उपयोगकर्ताओं की अच्छी सेवा करते थे लेकिन नाविक को GPS के वर्चस्व वाले उपभोक्ता उपकरण पारिस्थितिकी तंत्र से दूरी पर रखते थे; एनवीएस श्रृंखला में L1 का जोड़ कार्यक्रम का हर जेब में फोन तक का पुल है। भू-समकालिक कक्षा में रखा गया एनवीएस-03 लगभग बारह वर्षों के मिशन जीवन के लिए डिज़ाइन किया गया है — उन पहली पीढ़ी के उपग्रहों के डिज़ाइन जीवन का लगभग दोगुना जिन्हें वह पूरक बनाता है। अपनी श्रृंखला के भीतर उसका नमूना उत्साहजनक है: एनवीएस-01, मई 2023 में लॉन्च हुआ, दूसरी पीढ़ी का पहला था, L1 पेलोड ले जाने वाला पहला और लंबे-जीवन डिज़ाइन के लिए बना पहला — और वह आज स्थिति सेवाओं के लिए कार्यात्मक बने तीन उपग्रहों में से एक है।\n\nभारत अपनी प्रणाली क्यों बनाए रखता है, जब GPS मुफ्त और वैश्विक है? एक स्वतंत्र भारतीय नेविगेशन क्षमता पर काम 1999 में कारगिल संघर्ष के बाद शुरू हुआ, जिसके दौरान भारतीय बलों ने खुद को उस सटीक स्थिति निर्धारण के लिए अमेरिकी GPS का उपयोग करने में असमर्थ पाया जिसकी युद्ध को मांग थी — एक सबक, जो भारतीय रणनीतिक प्रतिष्ठान भर में सोखा गया, कि किसी अन्य राज्य के नियंत्रण वाली स्थिति अवसंरचना एक सुविधा है जिसे ठीक तब घटाया या मना किया जा सकता है जब उसकी सबसे अधिक जरूरत हो। नाविक उसका परिणाम था: एक क्षेत्रीय तारामंडल, डिज़ाइन से सात उपग्रह, पूरे विश्व के बजाय भारत और उसके पड़ोस को कवर करता हुआ, अंत-से-अंत भारत के स्वामित्व वाला। उसकी सेवाएं नागरिक उपयोगकर्ताओं के लिए एक खुली मानक स्थिति सेवा और अधिकृत रणनीतिक उपयोगकर्ताओं के लिए एक प्रतिबंधित, एन्क्रिप्टेड सेवा के बीच बंटी हैं। उसके बाद के वर्षों में, नागरिक मामला रणनीतिक मामले जितना बड़ा हो गया है। नाविक संकेत और नाविक-सक्षम रिसीवर अब रेलवे नेटवर्क में वास्तविक-समय ट्रैकिंग का आधार हैं — लगभग 8,700 लोकोमोटिव और ट्रेनें पहले से सुसज्जित हैं, लगभग 12,000 के लक्ष्य के खिलाफ — परिवहन और लॉजिस्टिक्स ट्रैकिंग, आपदा और आपातकालीन प्रतिक्रिया, जियो-टैगिंग अनुप्रयोगों, और बिजली ग्रिड के सिंक्रनाइजेशन के साथ। तारामंडल की एकतरफा संदेश क्षमता — वही कार्य जो आईआरएनएसएस-1एफ अपनी घड़ी की विफलता के बाद भी करता रहता है — समुद्र में दूर, मोबाइल नेटवर्क की पहुंच से परे, मछुआरों को मौसम और चक्रवात की चेतावनियां प्रसारित करने के लिए उपयोग होती है। एक क्षेत्रीय प्रणाली, दूसरे शब्दों में, चुपचाप भार-वहन करने वाला राष्ट्रीय अवसंरचना बन गई है — जो वर्तमान उपग्रह कमी को इंजीनियरिंग शर्मिंदगी से नीति समस्या तक ऊंचा उठाता है।\n\nतारामंडल के डिज़ाइन से उसकी दक्षता और उसका जोखिम दोनों समझ आते हैं। अमेरिकी GPS के विपरीत, जिसके लगभग तीस उपग्रह ग्रह के हर बिंदु की सेवा के लिए मध्यम पृथ्वी कक्षा में पृथ्वी का चक्कर लगाते हैं, नाविक मात्र सात उपग्रहों से बनी एक क्षेत्रीय प्रणाली है: तीन भूस्थिर कक्षा में, भूमध्य रेखा के ऊपर खड़े जहां वे आकाश में स्थिर दिखाई देते हैं, और चार झुकी हुई भू-समकालिक कक्षाओं में, जो हर दिन उपमहाद्वीप के ऊपर आठ की आकृति बनाते हैं। वह ज्यामिति तारामंडल का ध्यान स्थायी रूप से भारत और उसकी सीमाओं से 1,500 किमी तक पर केंद्रित करती है, इसीलिए सात भारतीय उपग्रह क्षेत्रीय उपयोगकर्ताओं को कवरेज का वह घनत्व दे सकते हैं जो एक वैश्विक प्रणाली कहीं बड़े बेड़े से ही प्राप्त करती है। इसका उल्टा वह गणित है जो आज कार्यक्रम को सता रहा है: सात-उपग्रह डिज़ाइन के तीन कार्यात्मक सदस्यों तक घटने पर, खर्च करने के लिए कोई अतिरेक नहीं है। हर नुकसान वास्तुकला का सातवां हिस्सा घटाता है; हर पूर्ति — पहले एनवीएस-03, फिर एनवीएस-04 और एनवीएस-05 — क्षमता का असमानुपातिक हिस्सा वापस करती है। इसीलिए दूसरी पीढ़ी का बारह-वर्षीय डिज़ाइन जीवन रणनीतिक रूप से मायने रखता है: जिसके सदस्य बारह साल टिकते हैं, वह तारामंडल लॉन्च क्षमता और बजट उस दर से नहीं खाता जिस दर से वह तारामंडल खाता है जिसे हर पांच से सात साल में पूरा करना पड़े।\n\nलॉन्च वर्षों में इसरो के सामने आए सबसे परीक्षात्मक दौर के बीच में भी आता है, और इस मिशन के इर्द-गिर्द एजेंसी की सावधानी उस संदर्भ में पढ़ी जा सकती है। वर्कहॉर्स पीएसएलवी — दशकों तक भारतीय लॉन्च विश्वसनीयता का पर्याय — को लगातार विफलताओं का सामना करना पड़ा, 18 मई 2025 को और फिर इस वर्ष जनवरी में, कार्यक्रम के लिए एक अभूतपूर्व क्रम। उन झटकों ने अपनी छाया आगे डाली है: गगनयान कार्यक्रम की मानवरहित परीक्षण उड़ानें, जिनकी एक समय 2026 के मध्य के आसपास उम्मीद थी, 2026 के अंत या 2027 की शुरुआत तक खिसक गई हैं। उपग्रह के अंतरिक्ष बंदरगाह पर लगभग तीन महीनों का प्रवास रिपोर्टों में मंजूरी प्रक्रिया से जोड़ा गया है — वे मिशन-तैयारी समीक्षाएं जिनके माध्यम से पिछले दो वर्षों की हर विसंगति को एक उलटी गिनती पर विचार होने से पहले जवाब देना पड़ा है। उस पृष्ठभूमि के सामने, एनवीएस-03 के लिए वाहन का चुनाव अपना संदेश लिए है: जीएसएलवी एमके II, भारत के स्वदेशी क्रायोजेनिक ऊपरी चरण द्वारा संचालित, ने 2021 से छह लगातार सफल मिशन उड़ाए हैं। एनवीएस श्रृंखला अपने पूर्ववर्तियों से भारी मशीन भी है — पहली पीढ़ी के आईआरएनएसएस उपग्रहों का वजन लगभग 1,425 किलोग्राम था, जबकि एनवीएस श्रृंखला लगभग 2,232 किलोग्राम पर उससे अधिक है जिसे छोटा पीएसएलवी आवश्यक कक्षा तक उठा सकता था, जो खुद इस बात का हिस्सा है कि यह पूर्ति जीएसएलवी पर क्यों उड़ती है।\n\n30 अक्टूबर को एक सफल उड़ान इसलिए मिशन की शुरुआत है, उसका निष्कर्ष नहीं। जीएसएलवी एनवीएस-03 को एक दीर्घवृत्ताकार भू-समकालिक स्थानांतरण कक्षा में रखेगा, जिसके बाद उपग्रह का अपना प्रणोदन कक्षा को वृत्ताकार करेगा और उसे क्षेत्र के ऊपर भू-समकालिक चाप में उसके सौंपे गए स्थान तक ले जाएगा, जहां उसकी प्रणालियों और नेविगेशन पेलोड का कक्षा में परीक्षण होगा इससे पहले कि उसके संकेत परिचालन सेवा में शामिल किए जाएं। तारामंडल को अपना चौथा सदस्य तब मिलता है जब कमीशनिंग समाप्त होती है, कुछ सप्ताह बाद, उससे पहले नहीं — और उसके साथ स्वतंत्र स्थिति निर्धारण की बहाली भी।\n\nपूर्ति का रोडमैप, जैसा सरकार ने रखा है, इस एकल लॉन्च से आगे जाता है। अंतरिक्ष राज्य मंत्री डॉ. जितेंद्र सिंह ने 2025 के मध्य में संसद को बताया था कि एनवीएस-03 के बाद एनवीएस-04 और एनवीएस-05 लगभग छह महीने के अंतराल पर आएंगे, \"सेवाओं की निरंतरता सुनिश्चित करने के लिए उन्नत सुविधाओं के साथ नाविक आधार परत तारामंडल को बढ़ाने के लिए\" — एक क्रम जो तारामंडल को ताकत तक दोबारा बनाने और फिर उसे वहां बनाए रखने के लिए है। कैलेंडर की मांग वाली स्पष्टवादिता यह है कि वह क्रम पहले ही खिसक चुका है: उसी बयान में एनवीएस-03 के 2025 के अंत तक उड़ने की परिकल्पना थी, और वह अक्टूबर 2026 के अंत में उड़ता है, श्रीहरिकोटा में अपने तीन महीने के इंतजार के बाद। एक सफलता गति को फिर खोलती है — एनवीएस-04 पहुंच के भीतर, तारामंडल अपने न्यूनतम व्यवहार्य ताकत से अपने डिज़ाइन किए गए सात की ओर वापस चढ़ता हुआ। एक विफलता, या अपने घटकों से मरता एक और युवा उपग्रह, पुनर्निर्माण को उन वर्षों में धकेल देगा जिनमें विदेशी प्रणालियों पर भारत की नेविगेशन निर्भरता — वही स्थिति जिसे समाप्त करने के लिए नाविक मौजूद है — डिफ़ॉल्ट रूप से गहरी होती है। 30 अक्टूबर को सफलता वर्ष की विफलताओं को नहीं मिटाएगी; वह कुछ अधिक उपयोगी करेगी, जो यह दिखाना है कि उनका जवाब दिया गया।"

      "en": {
        "title": "Only 3 of India's 11 Navigation Satellites Still Work — ISRO's October 30 NVS-03 Launch Is NavIC's Lifeline",
        "summary": "ISRO will launch the NVS-03 navigation satellite aboard a GSLV Mk II from Sriharikota on October 30. The mission is aimed at restoring standalone positioning strength to NavIC, India's regional navigation system.",
        "body": "On October 30, a GSLV Mk II rocket will lift off from the Satish Dhawan Space Centre at Sriharikota carrying NVS-03, a satellite of about 2,232 kilograms whose job is unglamorous and indispensable: to keep India's own navigation system alive. NavIC — Navigation with Indian Constellation — is the regional satellite-navigation network on which a widening share of Indian life silently depends, from the phones in commuters' pockets and the trains tracked across the railway network to the synchronisation of the national power grid. It is also, at this moment, a system running on fumes. Of the eleven navigation satellites India has launched since 2013, only three are currently functional for providing position, navigation and timing services. A standalone navigation fix requires a minimum of four. NVS-03, which has been waiting at Sriharikota for nearly three months for clearance to fly, is the replenishment on which the constellation's credibility now rests — and its launch, confirmed by ISRO Chairman Dr V. Narayanan after an earlier tentative window of October 15–20 was moved, is consequently one of the most consequential Indian space missions of the year.\n\nThe three satellites presently functional for position, navigation and timing (PNT) services are IRNSS-1B, IRNSS-1L and IRNSS-1J — the last of those being NVS-01, the first satellite of the second-generation NVS series. With fewer than four satellites in view, a navigation receiver cannot compute a standalone three-dimensional position at all. Timing services are hardier — a single satellite suffices to discipline a clock — which is why NavIC's timing users have been less exposed. But the constellation's core promise, positioning over India and a region extending up to 1,500 km beyond its borders, currently rests on a trio where the design calls for seven. Even before this year, the government had told Parliament last year that only four of the eleven navigation satellites launched were operational for PNT services. The fragility deepened in March this year, when the procured atomic clock aboard IRNSS-1F stopped working on March 13; ISRO's statement of March 14 confirmed the failure, noting that the satellite continues to be used for one-way broadcast messaging but no longer contributes to positioning.\n\nThe losses follow a pattern. Eleven launches for the roughly ₹2,250-crore system since July 2013; six satellites failed along the way — mainly, in the programme's recurring misfortune, because of defective imported atomic clocks, with some losses to orbital issues. NVS-02, launched in January 2025 as IRNSS-1K, suffered an engine failure and could not reach its intended orbit. The pattern is not one of launch failure — India's rockets have generally delivered these satellites to space — but of satellites dying young in orbit, at the component level. That is what makes this launch a lifeline rather than a routine replenishment: NVS-03 does not merely add capacity, it restores the four-satellite minimum without which standalone positioning is not possible at all.\n\nNVS-03 itself is built to strengthen the constellation on two axes: survival and usability. Like NVS-01 before it, it carries navigation payloads that include the L1 band — the signal band used by the world's mass-market positioning chips, and therefore the band that makes NavIC natively compatible with ordinary smartphones rather than only with specialised receivers. The first-generation IRNSS satellites broadcast in the L5 and S bands, which served strategic and specialised users well but kept NavIC at arm's length from the consumer device ecosystem dominated by GPS; the NVS series' addition of L1 is the programme's bridge to the phone in every pocket. Placed in geosynchronous orbit, NVS-03 is designed for a mission life of about twelve years — roughly double the design life of the first-generation satellites it supplements. The template within its own series is encouraging: NVS-01, launched in May 2023, was the first of the second generation, the first to carry the L1 payload and the first built to the longer-life design — and it is today one of the three satellites still functional for positioning services.\n\nWhy does India maintain its own system at all, when GPS is free and global? Work on an independent Indian navigation capability began in 1999, after the Kargil conflict, during which Indian forces found themselves unable to use the American GPS for the precision positioning the war demanded — a lesson, absorbed across the Indian strategic establishment, that positioning infrastructure controlled by another state is a facility that can be degraded or denied exactly when it is needed most. NavIC was the result: a regional constellation, seven satellites by design, covering India and its neighbourhood rather than the whole globe, owned end-to-end by India. Its services are split between an open standard positioning service for civilian users and a restricted, encrypted service for authorised strategic users. In the years since, the civilian case has grown as large as the strategic one. NavIC signals and NavIC-capable receivers now underpin real-time tracking across the railway network — about 8,700 locomotives and trains are already equipped, against a goal of roughly 12,000 — along with transport and logistics tracking, disaster and emergency response, geo-tagging applications, and the synchronisation of the power grid. The constellation's one-way messaging capability — the very function IRNSS-1F continues to perform even after its clock's failure — is used to broadcast weather and cyclone warnings to fishermen far at sea, beyond the reach of mobile networks. A regional system has quietly become load-bearing national infrastructure, which is what elevates the present satellite shortage from an engineering embarrassment to a policy problem.\n\nThe constellation's design explains both its efficiency and its exposure. Unlike the American GPS, whose roughly thirty satellites circle the globe in medium earth orbit, NavIC is a regional system built from just seven satellites: three in geostationary orbit, parked over the equator where they appear fixed in the sky, and four in inclined geosynchronous orbits, which trace a figure-of-eight over the subcontinent across each day. That geometry concentrates the constellation's attention permanently on India and up to 1,500 km beyond its borders, which is why seven Indian satellites can offer regional users a density of coverage that a global system achieves only with far larger fleets. The obverse is the arithmetic that haunts the programme today: in a seven-satellite design worn down to three functioning members, there is no redundancy to spend. Each loss subtracts a seventh of the architecture; each replenishment — NVS-03 first, then NVS-04 and NVS-05 — restores a disproportionate share of capability. It is also why the second generation's twelve-year design life matters: a constellation whose members endure for twelve years does not consume launch capacity and budgets at the rate of one that must be replenished every five to seven years.\n\nThe launch also arrives in the middle of the most testing period ISRO has faced in years, and the agency's caution around this mission is legible in that context. The workhorse PSLV — for decades the byword for Indian launch reliability — suffered successive failures, on May 18, 2025 and again in January this year, an unprecedented sequence for the programme. The setbacks have cast their shadow forward: the Gaganyaan programme's uncrewed test flights, once expected around the middle of 2026, have slipped to late 2026 or early 2027. The satellite's nearly three months at the spaceport are attributed in reports to the clearance process — the mission-readiness reviews through which the anomalies of the past two years have had to be answered before a countdown could be contemplated. Against that background, the choice of vehicle carries its own message: the GSLV Mk II, powered by India's indigenous cryogenic upper stage, has flown six successive successful missions since 2021. The NVS series is also a heavier machine than its predecessors — the first-generation IRNSS satellites weighed about 1,425 kg, while the NVS series, at roughly 2,232 kg, exceeds what the smaller PSLV could lift to the required orbit, which is itself part of why this replenishment flies on the GSLV.\n\nA successful lift-off on October 30 is therefore the beginning of the mission, not its conclusion. The GSLV will place NVS-03 into an elliptical geosynchronous transfer orbit, after which the satellite's own propulsion will circularise the orbit and walk it to its assigned slot in the geosynchronous arc over the region, where its systems and navigation payloads will be tested in orbit before its signals are admitted to the operational service. The constellation gets its fourth member when the commissioning ends, some weeks later, and not before — and with it, the restoration of standalone positioning.\n\nThe replenishment roadmap, as the government has laid it out, extends beyond this single launch. The Minister of State for Space, Dr Jitendra Singh, told Parliament in mid-2025 that NVS-03 would be followed by NVS-04 and NVS-05 at intervals of about six months, \"to augment the NavIC base layer constellation with enhanced features for ensuring continuity of services\" — a sequence intended to rebuild the constellation to strength and then hold it there. The candour required by the calendar is that the sequence has already slipped: the same statement envisaged NVS-03 flying by the end of 2025, and it flies at the end of October 2026, after its three-month wait at Sriharikota. A success reopens the cadence — NVS-04 within reach, the constellation climbing back through its minimum viable strength towards its designed seven. A failure, or another young satellite dying of its components, would push the rebuilding into years in which India's navigation dependence on foreign systems — the very condition NavIC exists to end — deepens by default. Success on October 30 will not erase the year's failures; it will do something more useful, which is to demonstrate that they were answered."
