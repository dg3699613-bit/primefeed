/* ---------- SEARCH ---------- */
var searchTimer = null, lastQuery = "";
function doSearch(q){
  q = (q||"").trim().toLowerCase(); if (!q) return [];
  return ARTICLES.filter(function(a){
    var c = catById(a.cat);
    var subBoth = "";
    (SUBCATS[a.cat]||[]).forEach(function(sb){ if (sb.id===a.sub) subBoth = sb.hi + " " + sb.en; });
    var hay = [a.hi.title, a.en.title, c.hi, c.en, a.hi.ex, a.en.ex, subBoth].concat(a.hi.kw||[]).concat(a.en.kw||[]).join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
}
function renderSearch(){
  var h = appbarHTML(t("search"), {});
  h += '<div class="search-box">'+IC.search+'<input id="searchInput" type="search" placeholder="'+esc(t("searchHint"))+'" autocomplete="off"><button class="bm-btn hidden" id="searchClear" data-act="clearsearch">'+IC.x+'</button></div>';
  h += '<div id="searchBody">';
  if (S.recents.length){
    h += '<div class="mini-head"><h3>'+t("recent")+'</h3><button data-act="clearrecents">'+t("clearAll")+'</button></div><div class="chips">'+S.recents.map(function(r){ return '<button class="chip" data-chip="'+esc(r)+'">'+IC.clock.replace('viewBox','width="13" height="13" style="vertical-align:-2px;margin-right:5px;" viewBox')+esc(r)+'</button>'; }).join("")+'</div>';
  }
  var pops = S.lang==="hi" ? ["क्रिकेट","चक्रवात","ISRO","सेंसेक्स","रामायण","Hyundai"] : ["cricket","cyclone","ISRO","Sensex","Ramayana","Hyundai"];
  h += '<div class="mini-head"><h3>'+t("popular")+'</h3></div><div class="chips">'+pops.map(function(p){ return '<button class="chip" data-chip="'+esc(p)+'">'+esc(p)+'</button>'; }).join("")+'</div>';
  h += '</div>';
  view.innerHTML = h;
  var inp = document.getElementById("searchInput");
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 60);
  inp.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var q = inp.value;
    document.getElementById("searchClear").classList.toggle("hidden", !q);
    if (!q.trim()){ renderSearchBody(""); return; }
    document.getElementById("searchBody").innerHTML = '<p style="padding:16px;color:var(--muted);font-weight:600;font-size:13.5px;">'+t("searching")+'</p><div class="stack">'+skelRow()+skelRow()+'</div>';
    searchTimer = setTimeout(function(){ renderSearchBody(q); }, 380);
  });
  inp.addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); addRecent(inp.value); renderSearchBody(inp.value); } });
}
function renderSearchBody(q){
  var body = document.getElementById("searchBody"); if (!body) return;
  q = (q||"").trim();
  if (q !== lastQuery) searchShown = 20; /* nayi khoj = cap reset (audit M10) */
  lastQuery = q;
  if (!q){ renderSearch(); return; }
  var res = doSearch(q);
  if (!res.length){
    body.innerHTML = '<div class="state-box" style="margin:22px 16px;"><div class="sic">'+IC.search+'</div><h3>'+t("noResults")+'</h3><p>'+t("noResultsSub")+'</p></div>';
    return;
  }
  body.innerHTML = '<div class="mini-head"><h3>'+t("resultsFor")+' “'+esc(q)+'” ('+res.length+')</h3></div><div class="stack" style="margin-top:8px;">'+res.slice(0, searchShown).map(function(a){ return rowCardHTML(a); }).join("")+'</div>'
    + (res.length > searchShown ? '<button class="loadmore" data-act="loadmoresearch">'+t("loadMore")+'</button>' : '');
}
function addRecent(q){
  q = (q||"").trim(); if (!q) return;
  S.recents = [q].concat(S.recents.filter(function(r){ return r.toLowerCase()!==q.toLowerCase(); })).slice(0,6); saveAll();
}

/* ---------- SHARE APP (Settings) ----------
   Ek hi share system: PF_CONFIG.shareLink hamesha sabse naye release ki
   APK par jaata hai. Native share sheet (navigator.share) pehle; na ho to
   link copy. WhatsApp / Telegram ke seedhe share link bhi yahin se. */
function appShareLink(){ return PF_CONFIG.shareLink; }
function copyTextToClip(txt, okMsg){
  function legacy(){
    try{ var ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta); if (ok){ toast(okMsg); return; } }
    catch(e){}
    toast(txt);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); }, legacy); return; }
  legacy();
}
function shareAppNative(){
  var link = appShareLink(), msg = t("shareMsg");
  if (navigator.share){ navigator.share({ title:"PrimeFeed", text:msg, url:link }).catch(function(){}); }
  else copyTextToClip(msg + "\n" + link, t("appLinkCopied"));
}
function shareAppCardHTML(){
  return '<div class="share-card"><h3>'+IC.share+esc(t("shareApp"))+'</h3><p>'+esc(t("shareAppSub"))+'</p>'
    + '<div class="share-link">'+esc(appShareLink())+'</div>'
    + '<div class="share-btns"><button class="btn-red" data-act="shareapp">'+esc(t("shareNow"))+'</button><button class="btn-ghost" data-act="copyapplink">'+esc(t("copyLink"))+'</button></div>'

/* ---------- global click handling ---------- */
document.addEventListener("click", function(e){
  var el;
  if ((el = e.target.closest("[data-obact]"))){ e.preventDefault(); obHandleAct(el.getAttribute("data-obact")); return; }
  if ((el = e.target.closest("[data-oblang]"))){ e.preventDefault(); if (!obDraft) obDraft = obFreshDraft(); var lm = el.getAttribute("data-oblang"); obDraft.langMode = lm; setLangMode(lm); if (cur.screen==="ob") renderOb(parseInt(cur.param, 10) || 2); return; }
  if ((el = e.target.closest("[data-obstate]"))){ e.preventDefault(); if (!obDraft) obDraft = obFreshDraft(); var sn = el.getAttribute("data-obstate"); if (obDraft.state !== sn) obDraft.district = ""; obDraft.state = sn; obPlaceStage = "district"; renderOb(4); return; }
  if ((el = e.target.closest("[data-obdistrict]"))){ e.preventDefault(); if (!obDraft) obDraft = obFreshDraft(); obDraft.district = el.getAttribute("data-obdistrict"); renderOb(4); return; }
  if ((el = e.target.closest("[data-obint]"))){ e.preventDefault(); if (!obDraft) obDraft = obFreshDraft(); var cid = el.getAttribute("data-obint"); var cix = obDraft.interests.indexOf(cid); if (cix>=0) obDraft.interests.splice(cix, 1); else obDraft.interests.push(cid); renderOb(5); return; }
  if ((el = e.target.closest("[data-obedit]"))){ e.preventDefault(); obCtx = "settings"; obDraft = obFreshDraft(); var ed = el.getAttribute("data-obedit"); obPlaceStage = obDraft.state ? "district" : "state"; go("ob", ed==="lang" ? 2 : ed==="name" ? 3 : ed==="place" ? 4 : 5); return; }
  if ((el = e.target.closest("[data-langcycle]"))){ e.preventDefault(); var order = ["hi","en"]; var nx = order[(order.indexOf(PREFS.langMode)+1)%2]; setLangMode(nx); go(cur.screen, cur.param, true); return; }
  if ((el = e.target.closest("[data-langmode]"))){ e.preventDefault(); if (PREFS.langMode !== el.getAttribute("data-langmode")){ setLangMode(el.getAttribute("data-langmode")); go(cur.screen, cur.param, true); } return; }
  if ((el = e.target.closest("[data-lang]"))){ e.preventDefault(); if (PREFS.langMode !== el.getAttribute("data-lang")){ setLangMode(el.getAttribute("data-lang")); go(cur.screen, cur.param, true); } return; }
  if ((el = e.target.closest("[data-artlang]"))){ e.preventDefault(); var aid = el.getAttribute("data-artlang"); if (artById(aid)){ artLangMap[aid] = (artDispLang()==="hi") ? "en" : "hi"; toast(t("artTranslated")); go("article", aid, true); } return; }
  if ((el = e.target.closest("[data-listen]"))){ e.preventDefault(); var lac = el.getAttribute("data-listen"); if (lac==="toggle") lbToggle(); else if (lac==="stop") lbStopAll(); return; }
  if ((el = e.target.closest("[data-like]"))){ e.preventDefault(); fbToggleLike(); return; }
  if ((el = e.target.closest("[data-cmtpost]"))){ e.preventDefault(); fbPostComment(); return; }
  if ((el = e.target.closest("[data-bm]"))){ e.preventDefault(); e.stopPropagation(); var id = el.getAttribute("data-bm");
    if (isSaved(id)){ S.bookmarks = S.bookmarks.filter(function(x){ return x!==id; }); toast(t("bookmarkRemoved")); }
    else { S.bookmarks.unshift(id); toast(t("bookmarkAdded")); }
    saveAll(); go(cur.screen, cur.param, true); return; }
  if ((el = e.target.closest("[data-open]"))){ e.preventDefault(); var oid = el.getAttribute("data-open"); var n = NOTIFS.filter(function(x){ return x.art===oid; })[0]; if (n && S.readNotifs.indexOf(n.id)<0){ S.readNotifs.push(n.id); saveAll(); } go("article", oid); return; }
  if ((el = e.target.closest("[data-hometile]"))){ e.preventDefault(); closeDrawer(); curSub = "all"; lastCat = null; go("home"); return; }
  if ((el = e.target.closest("[data-cat]"))){ e.preventDefault(); closeDrawer(); curSub = "all"; lastCat = el.getAttribute("data-cat"); go("catlist", lastCat); return; }
  if ((el = e.target.closest("[data-sub]"))){ curSub = el.getAttribute("data-sub"); renderCatList(curCat); return; }
  if ((el = e.target.closest("[data-latestdate]"))){ var dk = el.getAttribute("data-latestdate"); latestDateSel = dk ? dk : null; dateShown = 20; if (cur.screen==="home") renderHome(); return; }
  if ((el = e.target.closest("[data-bmtab]"))){ bmTab = el.getAttribute("data-bmtab"); renderBookmarks(); renderNav("bookmarks"); return; }
  if ((el = e.target.closest("[data-notif]"))){ var k = el.getAttribute("data-notif"); S.notif[k] = !S.notif[k]; saveAll(); buildNotifs(); renderNotifications(); return; }
  if ((el = e.target.closest("[data-chip]"))){ var q = el.getAttribute("data-chip"); var inp = document.getElementById("searchInput"); if (inp){ inp.value = q; addRecent(q); renderSearchBody(q); } return; }
  if ((el = e.target.closest("[data-go]"))){ e.preventDefault(); closeDrawer(); var s = el.getAttribute("data-go"); if (s==="search" && cur.screen==="search") return; go(s); return; }
  if ((el = e.target.closest("[data-greetrefresh]"))){ e.preventDefault(); pfGreetRefresh(el); return; }
  if ((el = e.target.closest("[data-upd-act]"))){ e.preventDefault(); var ua = el.getAttribute("data-upd-act");
    if (ua==="start"){ startUpdateDownload(); }
    else if (ua==="install"){ doInstallUpdate(); }
    else if (ua==="later"){ /* Baad me = popup band, lekin banner/card Home+Settings par bana rahega — update chhupa nahi */ document.getElementById("updHost").innerHTML = ""; if (PF_UPDATE.state==="available") updateDismissed = false; }
    else if (ua==="centre"){ document.getElementById("updHost").innerHTML = ""; go("update"); }
    else if (ua==="check"){ updateChecked = false; updateDismissed = false; toast(t("updChecking")); checkForUpdate(); setTimeout(function(){ if (cur.screen==="update" || cur.screen==="settings") go(cur.screen, cur.param, true); if (PF_UPDATE.info) showUpdatePopup(PF_UPDATE.info); }, 650); }
    return; }
  if ((el = e.target.closest("[data-act]"))){
    var act = el.getAttribute("data-act");
    if (act==="back") goBack();
    else if (act==="drawer") openDrawer();
    else if (act==="closedrawer") closeDrawer();
    else if (act==="retry"){ loadFeed(true); go(cur.screen, cur.param, true); }
    else if (act==="refresh"){ homeLoaded = false; renderHome(); loadFeed(true); }
    else if (act==="loadmore"){ latestShown += 4; renderHome(); }
    else if (act==="loadmoredate"){ dateShown += 20; renderHome(); }
    else if (act==="loadmorecat"){ catShown += 20; renderCatList(curCat); }
    else if (act==="loadmoresearch"){ searchShown += 20; renderSearchBody(lastQuery); }
    else if (act==="clearhistory"){ S.history = []; saveAll(); toast(t("historyCleared")); go(cur.screen, cur.param, true); }
    else if (act==="clearrecents"){ S.recents = []; saveAll(); renderSearch(); }
    else if (act==="clearsearch"){ var i2 = document.getElementById("searchInput"); if (i2){ i2.value=""; renderSearch(); } }
    else if (act==="markread"){ S.readNotifs = NOTIFS.map(function(n){ return n.id; }); saveAll(); renderNotifications(); }
    else if (act==="checkupdate"){ updateChecked = false; checkForUpdate(); }
    else if (act==="themetoggle"){ S.theme = (S.theme==="dark") ? "light" : "dark"; document.getElementById("phone").setAttribute("data-theme", S.theme); saveAll(); renderSettings(); }
    else if (act==="fontsize"){ S.fontIdx = (S.fontIdx+1)%3; saveAll(); go(cur.screen, cur.param, true); }
    else if (act==="shareapp"){ shareAppNative(); }
    else if (act==="copyapplink"){ copyTextToClip(appShareLink(), t("appLinkCopied")); }
    else if (act==="sharewa"){ window.open("https://wa.me/?text=" + encodeURIComponent(t("shareMsg") + "\n" + appShareLink()), "_blank"); }
    else if (act==="sharetg"){ window.open("https://t.me/share/url?url=" + encodeURIComponent(appShareLink()) + "&text=" + encodeURIComponent(t("shareMsg")), "_blank"); }
    else if (act==="share"){
      var a = artById(cur.param); if (!a) return;
      var txt = A(a).title + " — PrimeFeed";
      if (navigator.share){ navigator.share({ title:"PrimeFeed", text:txt, url:PF_CONFIG.shareLink }).catch(function(){}); }
      else if (navigator.clipboard && navigator.clipboard.writeText){ var ctxt = txt + "\n" + PF_CONFIG.shareLink; navigator.clipboard.writeText(ctxt).then(function(){ toast(t("linkCopied")); }, function(){ toast(ctxt); }); }
      else toast(txt + "\n" + PF_CONFIG.shareLink);
    }
    return;
  }
});

var obCtx = "onboarding"; /* "onboarding" | "settings" */
var obDraft = null;
var obPlaceStage = "state"; /* "state" | "district" */

function obEscA(s){ return esc(s).replace(/"/g,"&quot;"); }
function obFreshDraft(){
  var d = { name:PREFS.name||"", state:PREFS.state||"", district:PREFS.district||"", langMode:PREFS.langMode||"hi", interests:(PREFS.interests||[]).slice() };
  /* First launch: NOTHING is pre-selected. Language starts unchosen and the
     interest grid starts empty — the user must pick, or use Skip (which is
     what applies the sensible defaults). Settings editors keep saved values. */
  if (obCtx==="onboarding"){ d.langMode = ""; d.interests = []; }
  return d;
}
/* The gate: in onboarding, Continue stays blocked until the step's selection
   has actually been made — a language picked, a name typed, state AND
   district picked, at least 1 interest chosen. Skip is the only way past a
   step without selecting. Settings editors are never gated (their draft
   holds the user's saved values; the button there is Save). */
function obCanContinue(step){
  if (obCtx!=="onboarding") return true;
  if (!obDraft) return false;
  if (step===2) return !!obDraft.langMode;
  if (step===3) return (obDraft.name||"").trim().length>0;
  if (step===4) return !!obDraft.state && !!obDraft.district;
  if (step===5) return (obDraft.interests||[]).length>=1;
  return true;
}
function obSyncNext(step){
  var b = view.querySelector(".ob-next");
  if (b) b.disabled = !obCanContinue(step);
}
function langModeLabel(m){ m = m || PREFS.langMode; return m==="en" ? "EN" : "हिंदी"; }
function langModeName(m){ m = m || PREFS.langMode; return m==="en" ? "English" : "हिंदी"; }

function obHead(step, title, sub){
  var bars = "";
  for (var i=1;i<=5;i++) bars += '<i class="'+(i<=step?"on":"")+'"></i>';
  var h = '<div class="ob-top"><div class="ob-prog"><div class="ob-bars">'+bars+'</div>'
    + (obCtx==="onboarding" && step>1 ? '<span class="ob-step-txt">'+esc(t("obStep").replace("{n}", step))+'</span>' : '')
    + '</div></div>';
  h += '<h2 class="ob-title">'+esc(title)+'</h2>';
  if (sub) h += '<p class="ob-sub">'+esc(sub)+'</p>';
  return h;
}
function obFoot(step, opts){
  opts = opts || {};
  var primary = obCtx==="settings" ? t("saveBtn") : t("continueBtn");
  var h = '<div class="ob-foot"><div class="ob-navrow">'
    + '<button class="btn-ghost ob-back" data-obact="back">'+esc(t("backBtn"))+'</button>'
    + '<button class="btn-red ob-next" data-obact="next"'+(obCanContinue(step) ? "" : " disabled")+'>'+esc(primary)+'</button></div>';
  if (opts.skip && obCtx==="onboarding") h += '<button class="ob-skip" data-obact="skip">'+esc(t("skip"))+'</button>';
  h += '</div>';
  return h;
}
function obStateListHTML(q){
  q = (q||"").trim().toLowerCase();
  var list = PF_STATES.filter(function(s){ return !q || s.n.toLowerCase().indexOf(q)>=0 || s.h.indexOf(q)>=0; });
  if (!list.length) return '<p class="ob-nomatch">'+esc(t("noMatch"))+'</p>';
  return list.map(function(s){
    var on = obDraft.state===s.n;
    return '<button class="ob-item'+(on?" on":"")+'" data-obstate="'+obEscA(s.n)+'"><span class="ob-item-tx"><b>'+esc(s.n)+'</b><small>'+esc(s.h)+'</small></span>'+(on?'<span class="ob-check">✓</span>':'<span class="ob-chev">'+IC.chev+'</span>')+'</button>';
  }).join("");
}
function obDistrictListHTML(q){
  q = (q||"").trim().toLowerCase();
  var list = pfDistricts(obDraft.state).filter(function(d){ return !q || d.toLowerCase().indexOf(q)>=0; });
  if (!list.length) return '<p class="ob-nomatch">'+esc(t("noMatch"))+'</p>';
  return list.map(function(d){
    var on = obDraft.district===d;
    return '<button class="ob-item'+(on?" on":"")+'" data-obdistrict="'+obEscA(d)+'"><span class="ob-item-tx"><b>'+esc(d)+'</b></span>'+(on?'<span class="ob-check">✓</span>':'')+'</button>';
  }).join("");
}

function renderOb(step){
  step = parseInt(step, 10) || 1;
  if (!obDraft) obDraft = obFreshDraft();
  var h = '<div class="ob">';
  if (step===1){
    /* ---- SCREEN 1: WELCOME ---- */
    h += '<div class="ob-welcome">'
      + '<div class="pf-stage"><svg class="pf-ring" viewBox="0 0 124 124" aria-hidden="true"><circle class="pf-ring-track" cx="62" cy="62" r="54"/><circle class="pf-ring-arc" cx="62" cy="62" r="54"/></svg><img class="logo-badge" src="app_badge.png" alt=""></div>'
      + '<h1 class="ob-brand">Prime<b>Feed</b></h1>'
      + '<p class="ob-tag">'+esc(tagline())+'</p>'
      + '<h2 class="ob-title" style="text-align:center;">'+esc(t("welcomeTitle"))+'</h2>'
      + '<p class="ob-sub" style="text-align:center;margin-bottom:0;">'+esc(t("welcomeMsg"))+'</p>'
      + '</div>'
      + '<div class="ob-foot"><button class="btn-red ob-big" data-obact="start">'+esc(t("getStarted"))+'</button>'
      + '<button class="ob-skip" data-obact="skip">'+esc(t("skip"))+'</button></div>';
  }
  else if (step===2){
    /* ---- SCREEN 2: LANGUAGE ---- */
    h += obHead(2, t("langQ"), t("langSubQ"));
    var modes = [
      ["hi",   "हिंदी",          t("langHiDesc"),   "हिं"],
      ["en",   "English",        t("langEnDesc"),   "EN"]
    ];
    h += modes.map(function(m){
      var on = obDraft.langMode===m[0];
      return '<button class="lang-card'+(on?" on":"")+'" data-oblang="'+m[0]+'"><span class="lang-ic">'+esc(m[3])+'</span><span class="lang-tx"><b>'+esc(m[1])+'</b><small>'+esc(m[2])+'</small></span><span class="lang-radio'+(on?" on":"")+'"></span></button>';
    }).join("");
    h += obFoot(2, { skip:true });
  }
  else if (step===3){
    /* ---- SCREEN 3: NAME ---- */
    h += obHead(3, t("nameQ"), t("nameSub"));
    h += '<input id="obName" class="ob-input" type="text" maxlength="40" autocomplete="name" placeholder="'+obEscA(t("namePh"))+'" value="'+obEscA(obDraft.name)+'">';
    h += obFoot(3, { skip:true });
  }
  else if (step===4){
    /* ---- SCREEN 4: STATE & DISTRICT ---- */
    if (obPlaceStage==="district" && obDraft.state){
      var st = pfStateByName(obDraft.state);
      h += obHead(4, t("districtQ"), obDraft.state + (st ? " • " + st.h : ""));
      h += '<div><button class="ob-change" data-obact="changestate">'+esc(t("changeState"))+': '+esc(obDraft.state)+'</button></div>';
      h += '<div class="search-box ob-search">'+IC.search+'<input id="obSearch" type="search" placeholder="'+obEscA(t("searchDistrictPh"))+'" autocomplete="off"></div>';
      h += '<div class="ob-list" id="obList">'+obDistrictListHTML("")+'</div>';
    } else {
      h += obHead(4, t("placeQ"), t("placeSub"));
      h += '<div class="search-box ob-search">'+IC.search+'<input id="obSearch" type="search" placeholder="'+obEscA(t("searchStatePh"))+'" autocomplete="off"></div>';
      h += '<div class="ob-list" id="obList">'+obStateListHTML("")+'</div>';
    }
    h += obFoot(4, { skip:true });
  }
  else if (step===5){
    /* ---- SCREEN 5: NEWS INTERESTS — the app's 16 original categories ---- */
    h += obHead(5, t("intQ"), t("intSub"));
    h += '<div><span class="ob-count">'+esc(t("selectedCount").replace("{n}", obDraft.interests.length))+'</span></div>';
    h += '<div class="int-grid">'+CATS.map(function(c){
      var on = obDraft.interests.indexOf(c.id)>=0;
      return '<button class="int-chip'+(on?" on":"")+'" data-obint="'+c.id+'"><span class="int-ic" style="background:'+c.color+'">'+esc(c.mono)+'</span><span class="int-name">'+esc(catName(c))+'</span><span class="int-check">'+(on?"✓":"")+'</span></button>';
    }).join("")+'</div>';
    h += obFoot(5, { skip:true });
  }
  h += '</div>';
  view.innerHTML = h;
  /* per-step wiring (kept out of the global click handler: inputs, not clicks) */
  if (step===3){
    var ni = document.getElementById("obName");
    if (ni){
      ni.addEventListener("input", function(){ obDraft.name = ni.value; obSyncNext(3); });
      ni.addEventListener("focus", function(){ setTimeout(function(){ try{ ni.scrollIntoView({ block:"center", behavior: reducedMotion ? "auto" : "smooth" }); }catch(e){} }, 260); });
    }
  }
  if (step===4){
    var si = document.getElementById("obSearch");
    if (si) si.addEventListener("input", function(){
      var host = document.getElementById("obList"); if (!host) return;
      host.innerHTML = (obPlaceStage==="district" && obDraft.state) ? obDistrictListHTML(si.value) : obStateListHTML(si.value);
    });
  }
}

function renderObDone(){
  var h = '<div class="ob"><div class="ob-done-wrap">'
    + '<div class="ob-done-ic">'+IC.check+'</div>'
    + '<h2 class="ob-title" style="text-align:center;">'+esc(t("doneTitle"))+'</h2>'
    + '<p class="ob-sub" style="text-align:center;">'+esc(PREFS.name ? t("doneSubName").replace("{name}", PREFS.name) : t("doneSub"))+'</p>'
    + '<button class="btn-red ob-big" data-obact="finish">'+esc(t("seeNews"))+'</button>'
    + '</div></div>';
  view.innerHTML = h;
  if (obDoneTimer) clearTimeout(obDoneTimer);
  obDoneTimer = setTimeout(function(){ if (cur.screen==="obdone") obGoHome(); }, reducedMotion ? 900 : 2000);
}
function obGoHome(){
  if (obDoneTimer){ clearTimeout(obDoneTimer); obDoneTimer = null; }
  navStack = []; homeLoaded = false; go("home", null, true);
  pfTryOpenPending(); /* onboarding khatm — notification wala pending article ab kholo */
}
function obComplete(){
  PREFS.done = true; savePrefs();
  navStack = []; go("obdone", null, true);
}
function obSkip(step){
  if (obCtx==="settings") return;
  if (step===1){
    obDraft = { name:"", state:"", district:"", langMode:"hi", interests:["india","sports","entertainment"] };
    PREFS.name = ""; PREFS.state = ""; PREFS.district = ""; PREFS.interests = obDraft.interests.slice();
    setLangMode("hi");
    obComplete(); return;
  }
  if (step===2){ obDraft.langMode = "hi"; setLangMode("hi"); go("ob", 3); return; }
  if (step===3){ obDraft.name = ""; PREFS.name = ""; savePrefs(); go("ob", 4); return; }
  if (step===4){ obDraft.state = ""; obDraft.district = ""; PREFS.state = ""; PREFS.district = ""; savePrefs(); go("ob", 5); return; }
  if (step===5){ obDraft.interests = ["india","sports","entertainment"]; PREFS.interests = obDraft.interests.slice(); obComplete(); return; }
}
function obNext(step){
  if (obCtx==="onboarding" && !obCanContinue(step)) return; /* bina select kiye aage nahi — sirf Skip */
  if (obCtx==="settings"){
    if (step===3) PREFS.name = (obDraft.name||"").trim();
    if (step===4){ PREFS.state = obDraft.state||""; PREFS.district = obDraft.district||""; }
    if (step===5) PREFS.interests = obDraft.interests.slice();
    savePrefs(); goBack(); return;
  }
  if (step===2){ go("ob", 3); return; }
  if (step===3){ PREFS.name = (obDraft.name||"").trim(); savePrefs(); go("ob", 4); return; }
  if (step===4){ PREFS.state = obDraft.state||""; PREFS.district = obDraft.district||""; savePrefs(); go("ob", 5); return; }
  if (step===5){ PREFS.interests = obDraft.interests.slice(); obComplete(); return; }
}
function obDoReset(){
  obResetArmed = false;
  PREFS = pfDefaultPrefs();
  lsSet("pf_prefs", PREFS); lsSet("pf_onboarded_v1", false);
  S.lang = "hi"; lsSet("pf_lang", "hi");
  obCtx = "onboarding"; obDraft = obFreshDraft(); obPlaceStage = "state";
  navStack = []; go("ob", 1, true);
  toast(t("resetDone"));
}
function obHandleAct(act){
  var step = (cur.screen==="ob") ? (parseInt(cur.param, 10) || 1) : 0;
  if (act==="start") go("ob", 2);
  else if (act==="skip") obSkip(step);
  else if (act==="back") goBack();
  else if (act==="next") obNext(step);
  else if (act==="changestate"){ obPlaceStage = "state"; renderOb(4); }
  else if (act==="finish") obGoHome();
  else if (act==="resetob"){ obResetArmed = true; renderSettings(); }
  else if (act==="resetobno"){ obResetArmed = false; renderSettings(); }
  else if (act==="resetobyes") obDoReset();
}

/* ---------- init / splash ----------
   Launch animation plays ONCE per session (sessionStorage flag — a fresh app
   launch on a later day shows it again). The feed fetch below starts
   immediately in parallel: the splash never waits for data, data never
   waits for the splash. */
document.getElementById("phone").setAttribute("data-theme", S.theme);
document.getElementById("splashTag").textContent = tagline();
document.getElementById("splashLoading").textContent = t("loading");
var splashDone = false;
var reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} }
function finishSplash(){
  if (splashDone) return; splashDone = true;
  document.getElementById("splash").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  appEntered = true;
  navStack = [];
  if (!PREFS.done){ obCtx = "onboarding"; obDraft = obFreshDraft(); obPlaceStage = "state"; go("ob", 1, true); }
  else go("home", null, true);
  pfTryOpenPending(); /* returning user: ?open=<id> wala article Home ke upar kholo */
  checkForUpdate(); /* splash ke baad, session me ek baar; fail silent hai */
}
function enterApp(){
  if (splashDone) return;
  var sp = document.getElementById("splash");
  if (!sp || sp.classList.contains("hidden")){ splashDone = true; return; }
  if (reducedMotion){ finishSplash(); return; }
  sp.classList.add("leaving");
  setTimeout(finishSplash, 420);
}
loadFeed(false);
pfStartAutoRefresh();
document.getElementById("splash").addEventListener("click", enterApp);
if (ssGet("pf_splash_seen")){
  /* already shown this session — straight to Home, no animation */
  finishSplash();
} else {
  ssSet("pf_splash_seen", "1");
  if (reducedMotion){
    /* static splash, briefly — no sweep/scale motion */
    setTimeout(finishSplash, 450);
  } else {
    document.getElementById("splash").classList.add("anim");
    setTimeout(enterApp, 1980); /* + 0.42s exit fade ≈ 2.4s total */
  }
}
</script>
</body>
</html>
