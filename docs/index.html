<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#e63229" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PrimeFeed" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:," />
<title>PrimeFeed — Hindi or English News</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ font-family:"Mukta",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; }
  img{ display:block; }

  /* ============ FULL-SCREEN APP ============ */
  .phone{
    --bg:#ffffff; --surface:#f4f5f8; --surface2:#eceef3; --ink:#101c33; --ink2:#42506a; --muted:#7c8698;
    --line:#e4e7ee; --red:#e63229; --red-dark:#b8151f; --navy:#0d1b33; --chip:#f1f2f6;
    background:var(--bg); color:var(--ink); overflow:hidden; position:relative;
    width:100%; height:100dvh; display:flex; flex-direction:column;
  }
  .phone[data-theme="dark"]{
    --bg:#0e1524; --surface:#16203a; --surface2:#1c2947; --ink:#eef2fa; --ink2:#b9c4da; --muted:#8593ad;
    --line:#243354; --chip:#1a2745; --navy:#e8edf7;
  }
  /* ============ SPLASH ============ */
  .splash{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; background:var(--bg); position:relative; padding:24px; text-align:center; }
  .splash .waves{ position:absolute; left:0; right:0; bottom:0; width:100%; height:180px; pointer-events:none; }
  .logo-mark{ width:84px; height:84px; border-radius:26px; background:#e63229; display:flex; align-items:center; justify-content:center; box-shadow:0 14px 30px rgba(230,50,41,.35); }
  .logo-mark span{ color:#fff; font-family:"Archivo",sans-serif; font-weight:800; font-size:50px; line-height:1; }
  .logo-mark.sm{ width:38px; height:38px; border-radius:12px; box-shadow:none; }
  .logo-mark.sm span{ font-size:22px; }
  .splash h1{ font-family:"Archivo",sans-serif; font-size:40px; margin:14px 0 2px; letter-spacing:-.5px; color:var(--ink); }
  .splash h1 b{ color:var(--red); font-weight:800; }
  .splash .tag{ font-size:16.5px; font-weight:600; color:var(--ink2); margin:0; }
  .splash .sub{ font-size:12.5px; color:var(--muted); margin-top:6px; letter-spacing:.4px; }
  /* launch sequence (~2.4s): logo fade+scale → one red arc sweep → wordmark → tagline → fade/slide to Home.
     Animations only run while .anim is on the splash; without it everything below stays statically visible. */
  .pf-stage{ position:relative; width:124px; height:124px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .pf-ring{ position:absolute; inset:0; width:124px; height:124px; transform:rotate(-90deg); pointer-events:none; }
  .pf-ring circle{ fill:none; }
  .pf-ring-track{ stroke:var(--surface2); stroke-width:2; }
  .pf-ring-arc{ stroke:var(--red); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:112 228; opacity:0; }
  .splash.anim .pf-stage{ animation:pfLogoIn .7s cubic-bezier(.22,.8,.3,1) both; will-change:transform,opacity; }
  .splash.anim .pf-ring{ animation:pfSweep .95s cubic-bezier(.45,.05,.3,1) .5s both; will-change:transform; }
  .splash.anim .pf-ring-arc{ animation:pfArcFade .95s ease .5s both; }
  /* 1.8.7: new badge artwork replaces the CSS "P" mark everywhere (one asset: app_badge.png) */
  .logo-badge{ width:84px; height:84px; display:block; }
  .logo-badge.sm{ width:38px; height:38px; }
  .appbar .logo-badge.sm{ width:30px; height:30px; }
  .splash-badge{ position:relative; z-index:2; filter:drop-shadow(0 14px 22px rgba(230,50,41,.35)); }
  .pf-pulse{ position:absolute; left:50%; top:50%; width:92px; height:92px; margin:-46px 0 0 -46px; border:2px solid #e63229; border-radius:50%; opacity:0; pointer-events:none; z-index:1; }
  .splash.anim .pf-pulse{ animation:pfPulse 2.8s cubic-bezier(.22,.61,.36,1) infinite; will-change:transform,opacity; }
  .splash.anim .pf-pulse.p2{ animation-delay:1.4s; }
  .splash.anim .splash-badge{ animation:pfBadgeIn .45s ease-out both; }
  @keyframes pfBadgeIn{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
  @keyframes pfPulse{ 0%{ transform:scale(.68); opacity:.5; } 70%{ opacity:.14; } 100%{ transform:scale(1.38); opacity:0; } }
  .splash.anim h1{ animation:pfRise .5s ease .8s both; }
  .splash.anim .tag{ animation:pfFade .55s ease 1.2s both; }
  .splash.anim .sub{ animation:pfFade .55s ease 1.45s both; }
  .splash.leaving{ animation:pfOut .42s ease both; }
  @keyframes pfLogoIn{ from{ opacity:0; transform:scale(.93); } to{ opacity:1; transform:scale(1); } }
  @keyframes pfSweep{ from{ transform:rotate(-90deg); } to{ transform:rotate(270deg); } }
  @keyframes pfArcFade{ 0%{ opacity:0; } 15%{ opacity:1; } 78%{ opacity:1; } 100%{ opacity:0; } }
  @keyframes pfRise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @keyframes pfFade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes pfOut{ to{ opacity:0; transform:translateY(-10px); } }
  @media (prefers-reduced-motion: reduce){
    .splash.anim .pf-stage, .splash.anim .pf-ring, .splash.anim .pf-ring-arc,
    .splash.anim .pf-pulse, .splash.anim .splash-badge,
    .splash.anim h1, .splash.anim .tag, .splash.anim .sub, .splash.leaving{ animation:none !important; }
    .pf-ring-arc{ opacity:0 !important; }
    .spinner{ animation:none !important; }
  }
  .spinner{ margin-top:44px; width:26px; height:26px; border-radius:50%; border:3px solid var(--surface2); border-top-color:var(--red); animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .splash .loading-txt{ margin-top:10px; font-size:12px; color:var(--muted); }
  .sample-pill{ display:inline-flex; align-items:center; gap:5px; background:#fff4e0; color:#8a5a00; border:1px solid #f3d492; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.2px; }
  .phone[data-theme="dark"] .sample-pill{ background:#3a2c07; color:#f3c96b; border-color:#6b5518; }

  /* ============ APP SHELL ============ */
  .app{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .hidden{ display:none !important; }
  #view{ flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; scrollbar-width:none; overscroll-behavior-y:contain; }
  #view::-webkit-scrollbar{ display:none; }

  .appbar{ position:sticky; top:0; z-index:30; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; align-items:center; gap:10px; }
  .appbar .brand{ display:flex; align-items:center; gap:8px; min-width:0; }
  .appbar .brand .bname{ font-family:"Archivo",sans-serif; font-weight:800; font-size:20px; letter-spacing:-.3px; white-space:nowrap; }
  .appbar .brand .bname b{ color:var(--red); }
  .appbar .spacer{ flex:1; }
  .icon-btn{ width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; position:relative; flex:0 0 auto; }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn .dot{ position:absolute; top:8px; right:9px; width:8px; height:8px; border-radius:50%; background:var(--red); border:2px solid var(--bg); }
  .icon-btn.active{ color:var(--red); border-color:var(--red); }
  .lang-switch{ display:flex; background:var(--surface2); border-radius:999px; padding:3px; flex:0 0 auto; }
  .lang-switch button{ border:none; background:transparent; padding:5px 12px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink2); }
  .lang-switch button.on{ background:var(--red); color:#fff; box-shadow:0 2px 8px rgba(230,50,41,.35); }
  .page-title{ font-size:21px; font-weight:800; margin:0; letter-spacing:-.2px; }
  .back-btn{ width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .back-btn svg{ width:19px; height:19px; }

  /* bottom nav */
  .bottomnav{ flex:0 0 auto; display:flex; background:var(--bg); border-top:1px solid var(--line); padding:6px 6px calc(8px + env(safe-area-inset-bottom)); z-index:40; }
  .bottomnav button{ flex:1; border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px 2px; color:var(--muted); font-size:11px; font-weight:600; border-radius:12px; position:relative; }
  .bottomnav button svg{ width:22px; height:22px; }
  .bottomnav button.on{ color:var(--red); }
  .bottomnav button .bdot{ position:absolute; top:4px; right:calc(50% - 16px); min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--red); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; }

  /* drawer */
  .drawer-wrap{ position:absolute; inset:0; z-index:60; }
  .drawer-scrim{ position:absolute; inset:0; background:rgba(8,14,28,.5); }
  .drawer{ position:absolute; top:0; bottom:0; left:0; width:78%; max-width:300px; background:var(--bg); padding:20px 16px; overflow-y:auto; box-shadow:8px 0 30px rgba(0,0,0,.25); animation:slidein .22s ease; }
  @keyframes slidein{ from{ transform:translateX(-30px); opacity:.4; } to{ transform:none; opacity:1; } }
  .drawer .d-head{ display:flex; align-items:center; gap:10px; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .drawer a{ display:flex; align-items:center; gap:12px; padding:12px 8px; color:var(--ink); text-decoration:none; font-weight:600; font-size:15px; border-radius:10px; }
  .drawer a:active{ background:var(--surface); }
  .drawer a svg{ width:20px; height:20px; color:var(--ink2); }

  /* ============ HOME ============ */
  .sec{ padding:16px 16px 4px; }
  .sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .sec-head h2{ font-size:17px; font-weight:800; margin:0; letter-spacing:-.2px; }
  .sec-head .more{ font-size:12.5px; font-weight:700; color:var(--red); background:none; border:none; padding:2px 0; }
  .sec-head.today-head{ align-items:center; }
  .sec-head.today-head h2{ flex:0 0 auto; }
  .today-dt{ font-size:12.5px; font-weight:700; color:var(--ink2); text-align:right; line-height:1.35; flex:1 1 auto; padding-left:10px; font-variant-numeric:tabular-nums; }
  .breaking{ margin:10px 16px 0; background:var(--red); color:#fff; border-radius:999px; height:40px; padding:0 12px; display:flex; gap:8px; align-items:center; box-shadow:0 6px 16px rgba(230,50,41,.28); border:none; width:calc(100% - 32px); text-align:left; }
  .breaking .blabel{ flex:0 0 auto; background:rgba(255,255,255,.22); font-size:9.5px; font-weight:800; letter-spacing:.8px; padding:3px 7px; border-radius:999px; }
  .breaking .btext{ flex:1; min-width:0; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .card{ background:var(--bg); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-align:left; width:100%; padding:0; }
  .card .thumb{ width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--surface2); }
  .thumb-fallback{ width:100%; aspect-ratio:16/9; background:var(--navy); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-family:"Archivo",sans-serif; font-weight:800; font-size:30px; }
  .thumb-fallback small{ font-family:"Mukta",sans-serif; font-weight:600; font-size:11px; letter-spacing:1.5px; opacity:.75; }
  .card .cbody{ padding:12px 14px 14px; }
  .meta-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cat-chip{ font-size:11px; font-weight:800; color:var(--red); background:rgba(230,50,41,.09); padding:3px 8px; border-radius:6px; letter-spacing:.2px; }
  .time-txt{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .card h3{ font-size:17.5px; line-height:1.35; font-weight:700; margin:7px 0 5px; color:var(--ink); }
  /* compact Top Story card: chhoti photo + sirf headline — pura screen nahi bharta */
  .card.compact .thumbwrap{ aspect-ratio:21/9; }
  .card.compact h3{ font-size:16.5px; margin:6px 0 0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card.compact .cbody{ padding:10px 14px 12px; }
  .card p.ex{ font-size:13.5px; line-height:1.55; color:var(--ink2); margin:0; }
  .src-line{ font-size:11.5px; color:var(--muted); margin-top:9px; font-weight:600; }
  .src-line b{ color:var(--ink2); }
  /* Video News (bottom-nav ke Video tab par): abhi sirf Coming Soon placeholder card */
  .sec-head h2 .vn-ic{ display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--red); color:#fff; align-items:center; justify-content:center; vertical-align:-4px; margin-right:7px; }
  .sec-head h2 .vn-ic svg{ width:11px; height:11px; }
  .vn-card{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:30px 16px; }
  .vn-card .vn-play{ width:56px; height:56px; border-radius:50%; background:rgba(230,50,41,.1); color:var(--red); display:flex; align-items:center; justify-content:center; }
  .vn-card .vn-play svg{ width:26px; height:26px; }
  .vn-card .vn-txt{ font-size:15px; font-weight:700; color:var(--ink2); }

  .row-card{ display:flex; gap:12px; width:100%; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:10px; text-align:left; align-items:stretch; }
  .row-card .rthumb{ width:104px; flex:0 0 104px; aspect-ratio:4/3; object-fit:cover; border-radius:10px; background:var(--surface2); }
  .row-card .rthumb-fallback{ width:104px; flex:0 0 104px; aspect-ratio:4/3; border-radius:10px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Archivo",sans-serif; font-weight:800; font-size:22px; }
  .row-card .rbody{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .row-card h4{ font-size:14.5px; line-height:1.4; font-weight:700; margin:4px 0 4px; color:var(--ink); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .row-card .rfoot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .stack{ display:flex; flex-direction:column; gap:10px; padding:0 16px; }
  .bm-btn{ border:none; background:var(--surface); width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto; }
  .bm-btn svg{ width:16px; height:16px; }
  .bm-btn.saved{ color:var(--red); background:rgba(230,50,41,.1); }

  .cat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px 6px; padding:2px 16px 4px; }
  .cat-grid.wide{ grid-template-columns:repeat(4,1fr); gap:16px 10px; padding:6px 16px; }
  .cat-item{ border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0; }
  .cat-ic{ width:50px; height:50px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:"Archivo",sans-serif; font-weight:800; font-size:19px; color:#fff; }
  .cat-item .clabel{ font-size:11.5px; font-weight:700; color:var(--ink2); text-align:center; line-height:1.2; }
  .cat-item .ccount{ font-size:10px; color:var(--muted); font-weight:600; }

  .loadmore{ margin:14px 16px 6px; width:calc(100% - 32px); padding:12px; border-radius:12px; border:1.5px solid var(--red); color:var(--red); background:transparent; font-weight:800; font-size:14px; }
  .refresh-row{ display:flex; justify-content:center; padding:10px 16px 0; }
  .refresh-row button{ border:1px solid var(--line); background:var(--surface); color:var(--ink2); font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px; display:inline-flex; gap:6px; align-items:center; }
  .refresh-row svg{ width:14px; height:14px; }

  /* skeleton */
  .skel{ border-radius:16px; border:1px solid var(--line); overflow:hidden; }
  .skel .sk{ background:linear-gradient(100deg, var(--surface2) 40%, var(--surface) 50%, var(--surface2) 60%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer{ to{ background-position:-200% 0; } }
  .skel .sk-img{ aspect-ratio:16/9; }
  .skel .sk-line{ height:13px; border-radius:6px; margin:10px 14px 0; }
  .skel .sk-line.short{ width:55%; margin-bottom:14px; }

  /* states */
  .state-box{ margin:34px 24px; text-align:center; padding:30px 20px; border:1.5px dashed var(--line); border-radius:18px; background:var(--surface); }
  .state-box .sic{ width:60px; height:60px; margin:0 auto 12px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .state-box .sic svg{ width:27px; height:27px; }
  .state-box h3{ margin:0 0 6px; font-size:16.5px; font-weight:800; }
  .state-box p{ margin:0 0 16px; font-size:13.5px; color:var(--ink2); line-height:1.55; }
  .btn-red{ background:var(--red); color:#fff; border:none; padding:11px 22px; border-radius:12px; font-weight:800; font-size:14px; box-shadow:0 6px 16px rgba(230,50,41,.3); }
  .btn-ghost{ background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:10px 18px; border-radius:12px; font-weight:700; font-size:13.5px; }

  /* search */
  .search-box{ margin:12px 16px 4px; display:flex; align-items:center; gap:9px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:11px 13px; }
  .search-box svg{ width:19px; height:19px; color:var(--muted); flex:0 0 auto; }
  .search-box input{ flex:1; border:none; outline:none; background:transparent; font-size:15px; font-family:inherit; color:var(--ink); min-width:0; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px; }
  .chip{ border:1px solid var(--line); background:var(--bg); color:var(--ink2); padding:7px 13px; border-radius:999px; font-size:13px; font-weight:600; }
  .chip:active{ border-color:var(--red); color:var(--red); }
  .mini-head{ padding:14px 16px 2px; display:flex; justify-content:space-between; align-items:baseline; }
  .mini-head h3{ margin:0; font-size:14.5px; font-weight:800; }
  .mini-head button{ border:none; background:none; color:var(--red); font-size:12.5px; font-weight:700; }

  /* tabs */
  .seg-tabs{ display:flex; background:var(--surface2); border-radius:12px; padding:4px; margin:12px 16px 4px; }
  .seg-tabs button{ flex:1; border:none; background:transparent; padding:9px; border-radius:9px; font-weight:800; font-size:14px; color:var(--ink2); }
  .seg-tabs button.on{ background:var(--red); color:#fff; }

  /* settings list */
  .set-group{ margin:14px 16px 0; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .set-row{ display:flex; align-items:center; gap:12px; width:100%; padding:14px; background:var(--bg); border:none; border-bottom:1px solid var(--line); text-align:left; color:var(--ink); }
  .set-row:last-child{ border-bottom:none; }
  .set-row .sic2{ width:38px; height:38px; border-radius:11px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink2); flex:0 0 auto; }
  .set-row .sic2 svg{ width:19px; height:19px; }
  .set-row .st{ flex:1; min-width:0; }
  .set-row .st b{ display:block; font-size:14.5px; font-weight:700; }
  .set-row .st small{ font-size:12px; color:var(--muted); font-weight:600; }
  .set-row .chev{ color:var(--muted); }
  .set-row .chev svg{ width:17px; height:17px; }
  .switch{ width:46px; height:27px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); position:relative; flex:0 0 auto; padding:0; }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); transition:left .18s ease; }
  .switch.on{ background:var(--red); border-color:var(--red); }
  .switch.on::after{ left:21px; }

  /* notifications */
  .notif{ display:flex; gap:12px; margin:0 16px 10px; border:1px solid var(--line); border-radius:14px; padding:12px; background:var(--bg); width:calc(100% - 32px); text-align:left; }
  .notif h4{ margin:0 0 3px; font-size:14px; font-weight:700; line-height:1.4; color:var(--ink); }
  .notif p{ margin:0; font-size:12.5px; color:var(--ink2); line-height:1.5; }

  /* Smooth model: bahar wala .ptr sirf position/opacity sambhalta hai —

     rAF se update), chhodne par .settle class lambi eased transition
     deti hai. Andar wali .ptr-ring sirf rotation sambhalti hai: pull ke
     saath progressive rotate, refresh ke dauraan spin animation — isliye
     spin shuru hone par position kabhi jump nahi hoti. */
  .ptr{ position:absolute; left:50%; top:64px; width:30px; height:30px; margin-left:-15px; opacity:0; transform:translateY(-46px); z-index:55; pointer-events:none; will-change:transform,opacity; }

      "hi": {
        "title": "140 किलोमीटर प्रति घंटे के झोंकों के साथ 28 अक्टूबर को यानम तट से टकराएगा अर्नब, आंध्र और दक्षिण ओडिशा में रेड अलर्ट",
        "summary": "बंगाल की खाड़ी में बना चक्रवाती तूफान अर्नब 27 अक्टूबर को अति भीषण चक्रवात में बदलकर 28 अक्टूबर की सुबह यानम के पास आंध्र तट से टकरा सकता है। आईएमडी ने रेड अलर्ट जारी किया है और दोनों राज्यों में राहत टीमें तैनात कर दी गई हैं।",
        "body": "बंगाल की खाड़ी के ऊपर बना गहरा दबाव सोमवार तड़के चक्रवाती तूफान 'अर्नब' में बदल गया। इसके साथ ही भारत का पूर्वी तट हाई अलर्ट पर आ गया है और तूफान आंध्र प्रदेश के तट की ओर बढ़ रहा है, जहां बुधवार, 28 अक्टूबर की सुबह इसके टकराने की संभावना है। भारतीय मौसम विभाग (आईएमडी) ने तटीय आंध्र प्रदेश और उससे सटे दक्षिण ओडिशा के लिए रेड अलर्ट जारी किया है। दोनों राज्यों के खतरे वाले जिलों में आपदा राहत टीमें फैल चुकी हैं और सरकारों ने लोगों को सुरक्षित स्थानों पर पहुंचाना शुरू कर दिया है। यह प्रणाली पहली बार 25 अक्टूबर को एक दबाव के रूप में दर्ज की गई थी।\n\nआईएमडी के सोमवार सुबह के बुलेटिन के अनुसार, सुबह 5:30 बजे यह तूफान पूर्व-मध्य और उससे सटे पश्चिम-मध्य बंगाल की खाड़ी के ऊपर स्थित था। उस समय यह विशाखापत्तनम से करीब 650 किलोमीटर पूर्व-दक्षिणपूर्व, ओडिशा के गोपालपुर से करीब 610 किलोमीटर दक्षिणपूर्व, काकीनाडा से करीब 730 किलोमीटर पूर्व-दक्षिणपूर्व, मछलीपट्टनम से करीब 830 किलोमीटर पूर्व और बापटला से करीब 910 किलोमीटर पूर्व में था। पिछले छह घंटों में यह करीब 15 किलोमीटर प्रति घंटे की रफ्तार से पश्चिम की ओर बढ़ा था। सोमवार, 26 अक्टूबर की आधी रात तक इसके भीषण चक्रवाती तूफान में बदलने और मंगलवार, 27 अक्टूबर को पश्चिम-मध्य खाड़ी के ऊपर अति भीषण चक्रवाती तूफान बनने की संभावना है। इसके बाद यह 28 अक्टूबर की दोपहर से पहले बापटला और विशाखापत्तनम के बीच, यानम के निकट, आंध्र प्रदेश और यानम के तट को पार करेगा। तट से टकराते समय हवाओं की अधिकतम रफ्तार 115 से 125 किलोमीटर प्रति घंटा रहने का अनुमान है, झोंके 140 किलोमीटर प्रति घंटे तक जा सकते हैं। इसके बाद तंत्र के स्थल की ओर बढ़ते हुए धीरे-धीरे कमजोर पड़ने की उम्मीद है।\n\nअपनी चेतावनी में आईएमडी ने कहा, \"इसके बाद इसके पश्चिम-उत्तरपश्चिम की ओर बढ़ने और 28 अक्टूबर 2026 की दोपहर से पहले अति भीषण चक्रवाती तूफान के रूप में आंध्र प्रदेश और यानम तट को बापटला और विशाखापत्तनम के बीच पार करने की पूरी संभावना है, जिसमें हवाओं की अधिकतम रफ्तार 115-125 किलोमीटर प्रति घंटा रहेगी और झोंके 140 किलोमीटर प्रति घंटे तक जाएंगे।\" विभाग ने इस क्षेत्र के लिए पहला अलर्ट रविवार को ही जारी कर दिया था, जब यह प्रणाली एक दबाव के रूप में थी।\n\nआंध्र प्रदेश राज्य आपदा प्रबंधन प्राधिकरण (एपीएसडीएमए) ने चेतावनी दी है कि अगले तीन दिन बेहद महत्वपूर्ण रहेंगे। प्राधिकरण के प्रबंध निदेशक प्रकाश जैन ने लोगों से सुरक्षा सावधानियों का सख्ती से पालन करने की अपील की है। 27 अक्टूबर की सुबह से ही तटीय इलाकों में तेज हवाओं का असर शुरू हो जाएगा, यानी तट से टकराने से पूरा एक दिन पहले। आईएमडी ने 27 और 28 अक्टूबर को उत्तरी आंध्र प्रदेश और मध्य तटीय जिलों में भारी से बहुत भारी बारिश का अनुमान जताया है, कुछ स्थानों पर अत्यंत भारी बारिश भी हो सकती है। श्रीकाकुलम, विजयनगरम, विशाखापत्तनम, अनकापल्ली, पार्वतीपुरम मन्यम और अल्लूरी सीताराम राजू जिलों में भारी बारिश की चेतावनी है, जबकि पूर्वी गोदावरी, कोनासीमा और काकीनाडा में भारी से बहुत भारी बारिश के साथ संवेदनशील इलाकों में जलभराव की आशंका जताई गई है।\n\nआंध्र प्रदेश के मुख्यमंत्री एन. चंद्रबाबू नायडू ने रविवार और फिर सोमवार को राज्य की तैयारियों की समीक्षा की और अधिकारियों को निर्देश दिया कि नुकसान कम से कम हो और किसी भी हाल में जनहानि न हो, इसके लिए हर जरूरी कदम उठाया जाए। समीक्षा में संवेदनशील इलाकों से लोगों को निकालने की योजना, राहत केंद्र स्थापित करने, तथा भोजन, पेयजल, चिकित्सा सहायता और बिजली बाधित होने पर उसकी त्वरित बहाली की व्यवस्था पर चर्चा हुई। समुद्र में गई मछली पकड़ने वाली नावों को तट पर लौटने के निर्देश दिए गए हैं और बंगाल की खाड़ी में मछली पकड़ने पर 28 अक्टूबर तक रोक है। राज्य आपदा प्रबंधन के एक वरिष्ठ अधिकारी ने सोमवार को समाचार एजेंसी रॉयटर्स को बताया कि प्रशासन ने करीब 5,70,000 लोगों को तूफान के प्रभाव के लिहाज से संवेदनशील के रूप में चिन्हित किया है और सोमवार शाम से ही लोगों को निकालने का काम शुरू होना था। राज्य के अधिकारियों के अनुसार सबसे ज्यादा खतरे वाले तटीय जिलों — बापटला, कृष्णा, पश्चिम गोदावरी, कोनासीमा, काकीनाडा, अनकापल्ली, विशाखापत्तनम और विजयनगरम — से लोगों को निकालने का काम 27 अक्टूबर तक पूरा कर लिया जाएगा। मुख्यमंत्री कार्यालय के अनुसार राज्य में बचाव और राहत कार्यों के लिए राष्ट्रीय आपदा मोचन बल (एनडीआरएफ) की 10 और राज्य आपदा मोचन बल (एसडीआरएफ) की 11 टीमें तैनात की गई हैं।\n\nओडिशा में मुख्यमंत्री मोहन चरण माझी की सरकार ने अपनी पूरी प्रतिक्रिया प्रणाली सक्रिय कर दी है। माझी ने स्थिति की समीक्षा कर अधिकारियों को निर्देश दिया है कि जनता की सुरक्षा, लोगों को निकालना और आपातकालीन प्रतिक्रिया ही सबसे ऊपर रहे। राज्य का घोषित लक्ष्य है कि चक्रवात से शून्य जनहानि हो। राजस्व और आपदा प्रबंधन मंत्री सुरेश पुजारी ने लोगों से अपील की कि वे घबराएं नहीं और विशेष राहत आयुक्त के दिशानिर्देशों का पालन करें। उन्होंने जोर दिया कि कमजोर परिवार के सदस्यों की सुरक्षा पर ध्यान देना चाहिए और जरूरत पड़ने पर उन्हें राहत केंद्रों में ले जाना चाहिए। उन्होंने बताया कि तैयारियों की देखरेख के लिए पांच वरिष्ठ अधिकारियों और राज्य मंत्रियों को संवेदनशील जिलों में तैनात किया गया है और राहत केंद्र, पका हुआ भोजन, दवाइयां और स्वास्थ्य व्यवस्थाएं तैयार हैं।\n\nओडिशा ने अलग-अलग मंत्रियों को विशिष्ट जिलों में तैयारी और बहाली की जिम्मेदारी सौंपी है और वे 27 से 29 अक्टूबर तक वहीं तैनात रहेंगे: कोरापुट में कनक वर्धन सिंह देव, रायगडा में प्रवती परिदा, कंधमाल में रबी नाइक, गंजम में बिभूति जेना, नबरंगपुर में कृष्ण चंद्र पात्र, मलकानगिरी में नित्यानंद गंडा, कालाहांडी में मुकेश महालिंग और गजपति में सूर्यवंशी सूरज। अग्निशमन और आपातकालीन सेवाओं के लिहाज से छह जिलों को फोकस के रूप में चिन्हित किया गया है — मलकानगिरी, कोरापुट, रायगडा, नबरंगपुर, गजपति और गंजम — जहां तेज हवाएं, भारी बारिश और भूस्खलन की आशंका है। अग्निशमन और आपातकालीन सेवाओं के महानिरीक्षक डॉ. उमाशंकर दाश ने कहा कि अग्निशमन कर्मियों की 225 टीमें उपकरणों और अत्याधुनिक वाहनों के साथ तैनात की जा रही हैं, विभिन्न इलाकों में 100 से ज्यादा नावें भी तैनात की जा रही हैं और एक राज्य स्तरीय कमांड सेंटर चौबीसों घंटे काम कर रहा है। जरूरत पड़ने पर अतिरिक्त जनशक्ति, उपकरण और वाहन तैनात किए जाएंगे।\n\nमुख्य अग्निशमन अधिकारी रमेश माझी ने समाचार एजेंसी एएनआई को बताया कि विभाग की 225 टीमें ब्लॉक मुख्यालय स्तर तक कवरेज सुनिश्चित करेंगी और ये टीमें टोइंग और परिवहन वाहनों सहित 225 वाहनों से लैस हैं। उन्होंने कहा कि भीषण तूफान की स्थिति में उपयोग के लिए 1,510 उच्च शक्ति वाली चेनसॉ तैयार हैं, गंभीर परिस्थितियों के लिए 25 बचाव टेंडर दिए गए हैं, 12 प्लाज्मा कटर की आपूर्ति की गई है और शाम या रात के अभियानों के लिए टीमों के बीच 225 टावर लाइटें वितरित की गई हैं। पूरे राज्य में सभी कर्मियों की छुट्टियां रद्द कर दी गई हैं।\n\nओडिशा आपदा त्वरित कार्रवाई बल (ओड्राफ) — राज्य का अपना विशेष बल, जो 1999 के महाचक्रवात के बाद बनाया गया था — खतरे वाले जिलों में चरणों में तैनात किया जा रहा है। एडीजी (कानून-व्यवस्था) संजय कुमार ने एएनआई को बताया कि करीब 20 ओड्राफ टीमें तैनात की गई हैं और वे जमीनी स्तर पर काम कर रही हैं। तैनाती इस तरह रखी गई है कि ये 20 टीमें तीन चरणों में बदल-बदलकर कुल 60 टीम-तैनातियों के बराबर काम करेंगी। इनके साथ पुराने प्रशिक्षित ओड्राफ कर्मी भी जोड़े गए हैं और एनडीआरएफ के साथ पूरा समन्वय है। मध्य रेंज (कटक) के पुलिस महानिरीक्षक सत्यजीत नायक ने कहा कि हर जिले में नियंत्रण कक्ष स्थापित किए गए हैं और पुरी, जगतसिंहपुर, कटक और खोर्धा जिलों में चार-चार ओड्राफ टीमें तैनात की गई हैं। दक्षिण ओडिशा के जिलों के लिए रेड अलर्ट जारी है, जहां मंगलवार से गुरुवार तक बहुत भारी बारिश का अनुमान है। ओडिशा ने समुद्र में मछली पकड़ने पर प्रतिबंध लगाया है और एहतियात के तौर पर छह जिलों में पर्यटकों के प्रवेश पर रोक लगा दी है। स्वास्थ्य अधिकारियों ने प्रसव के करीब गर्भवती महिलाओं, बुजुर्गों, बच्चों और दिव्यांगजनों को तूफान से पहले आश्रय स्थलों और स्वास्थ्य केंद्रों में पहुंचाने को प्राथमिकता दी है।\n\nअलर्ट का दायरा तट से टकराने वाले क्षेत्र के सबसे करीब दो राज्यों से आगे तक फैला है। केंद्र शासित प्रदेश पुडुचेरी में भारी बारिश की उम्मीद है, जहां प्रशासन स्थिति पर नजर रख रहा है, लोगों को जरूरी सावधानी बरतने की सलाह दी गई है और मछुआरों को समुद्र में न जाने को कहा गया है। तमिलनाडु में कोयंबटूर, तिरुवन्नामलाई, विल्लुपुरम, कल्लाकुरिची, कुड्डालोर, मयिलाडुथुरै, तंजावुर, तिरुवारूर और नागपट्टिनम के लिए ऑरेंज अलर्ट जारी किया गया है। पूर्वोत्तर मानसून तेज होने के बीच भारी बारिश की चेतावनी को देखते हुए पहाड़ी स्थल कोडाईकनाल में पर्यटकों के जाने पर रोक लगा दी गई है और एहतियात के तौर पर पुलिस पर्यटकों के वाहनों को लौटा रही है। इससे पहले केरल के पांच जिलों के लिए भी रेड अलर्ट जारी किया गया था, जहां मौसम विभाग ने लोगों को बिना जरूरत बाहर न निकलने की सलाह दी थी।\n\nयानम, जिसके पास तूफान की आंख के पार करने की उम्मीद है, केंद्र शासित प्रदेश पुडुचेरी का एक छोटा सा अंतःक्षेत्र है जो आंध्र प्रदेश के गोदावरी डेल्टा क्षेत्र के भीतर स्थित है, जहां जमीन समतल और नीची है। ऐसे इलाके भारी बारिश के साथ-साथ तूफानी लहरों के खतरे में भी रहते हैं। ओडिशा के तट का इतिहास कड़ा रहा है: 1999 के महाचक्रवात में करीब 10,000 लोगों की जान गई थी और ओड्राफ समेत आज इस्तेमाल हो रही प्रतिक्रिया व्यवस्थाएं तथा 2013 में फेलिन के समय हुई जैसी बड़े पैमाने की निकासियां उसी के बाद बनीं। अधिकारियों ने चेतावनी दी है कि अर्नब पिछले साल अक्टूबर 2025 में इसी तट से टकराए भीषण चक्रवाती तूफान मोंथा से ज्यादा नुकसानदेह साबित हो सकता है। बांग्लादेश द्वारा प्रस्तावित नाम 'अर्नब' वाला यह तंत्र 2026 में बंगाल की खाड़ी में बनने वाला पहला चक्रवात है।\n\nआईएमडी के क्षति-संभावना आकलन के अनुसार इस श्रेणी का तूफान कच्चे घरों की फूस की छतें उड़ा सकता है और कच्चे मकानों को भारी नुकसान पहुंचा सकता है, बिजली के खंभे मोड़ या तोड़ सकता है, बड़े पेड़ उखाड़ सकता है और बिजली व संचार लाइनें बाधित कर सकता है। खुली जगह में उड़ता मलबा जानलेवा खतरा बन सकता है। मूसलाधार बारिश से निचले इलाकों में अचानक बाढ़ और जलभराव का खतरा रहता है, दक्षिण ओडिशा के पहाड़ी जिलों में उफनती नदियों से भूस्खलन की आशंका बढ़ती है और तंत्र के अंदर बढ़ने के बाद गोदावरी और कृष्णा बेसिन में नदियों का जलस्तर बढ़ सकता है। डेल्टा जिलों में कटाई के करीब खड़ी धान की फसल और तट के साथ मछली पकड़ने वाले बेड़े सबसे ज्यादा जोखिम वाली आर्थिक संपत्तियों में हैं। आंध्र प्रदेश और ओडिशा तटों के साथ और उनके सामने समुद्र की स्थिति लैंडफॉल अवधि भर बहुत उग्र से अभूतपूर्व रहने की उम्मीद है और बंदरगाहों व पत्तनों ने अपने तूफान प्रोटोकॉल अपना लिए हैं।\n\nआगे क्या होगा, वह उसी क्रम का पालन करेगा जो आईएमडी ने तय किया है। सोमवार रात अर्नब के भीषण चक्रवाती तूफान तक पहुंचने और मंगलवार को अति भीषण तीव्रता तक पहुंचने की उम्मीद है, जबकि उसकी बाहरी वर्षा पट्टियां आंध्र और ओडिशा तटों को भिगोना शुरू कर देंगी। आंध्र प्रदेश में निकासी मंगलवार तक पूरी होनी है और सबसे ज्यादा जोखिम वाले जिलों में स्कूल-कॉलेज एहतियात के तौर पर बंद हो रहे हैं। बुधवार दोपहर से पहले यानम के निकट लैंडफॉल होगा, जिसमें तूफान की सबसे तेज हवाएं, सबसे भारी बारिश और तूफानी लहरों का खतरा पार करने के आसपास के घंटों में केंद्रित रहेगा। लैंडफॉल के बाद तंत्र को अंदर बढ़ते हुए धीरे-धीरे कमजोर पड़ना चाहिए, हालांकि उसकी अवशिष्ट बारिश हवाएं थमने के बाद भी आंध्र प्रदेश, ओडिशा, तेलंगाना और छत्तीसगढ़ के कुछ हिस्सों को भिगोती रह सकती है। आईएमडी घटना भर बुलेटिन जारी करता रहेगा और दोनों राज्यों के अधिकारियों का कहना है कि निवासियों को अफवाहों या सोशल मीडिया के बजाय उन्हीं बुलेटिनों पर भरोसा करना चाहिए।\n\nअलर्ट के तहत आने वाले जिलों के लोगों के लिए आधिकारिक सलाह सुसंगत है। निचले, बाढ़-प्रवण या तटीय इलाकों में रहने वाले, और फूस के या क्षतिग्रस्त घरों में रहने वाले लोगों को कहा गया है कि जब कहा जाए तो दस्तावेज, दवाएं और जरूरी सामान लेकर राहत केंद्रों और चक्रवात आश्रयों में चले जाएं। मछुआरों को समुद्र में न जाने को कहा गया है। निवासियों को तूफान के गुजरने के दौरान घर के अंदर रहना चाहिए, गिरी हुई बिजली की लाइनों, पुराने पेड़ों और होर्डिंग्स से दूर रहना चाहिए, मोबाइल फोन चार्ज रखना चाहिए, और मदद व जानकारी के लिए चौबीसों घंटे काम कर रहे जिला नियंत्रण कक्षों पर भरोसा करना चाहिए।"

      "en": {
        "title": "Cyclone Arnab to Slam Yanam Coast on October 28 With 140 Kmph Gusts; Red Alert Across Andhra and South Odisha",
        "summary": "Cyclonic storm Arnab over the Bay of Bengal is expected to intensify into a very severe cyclonic storm and cross the Andhra Pradesh coast near Yanam on the morning of October 28. The IMD has issued a red alert, and disaster response teams have been deployed across coastal districts.",
        "body": "A deep depression over the Bay of Bengal intensified into cyclonic storm 'Arnab' early on Monday, putting India's eastern seaboard on high alert and setting the storm on course for the Andhra Pradesh coast, which it is expected to cross on the morning of Wednesday, October 28. The India Meteorological Department (IMD) has issued a red alert for coastal Andhra Pradesh and adjoining south Odisha, disaster response teams have fanned out across the threatened districts of both states, and governments in the region have begun moving people out of harm's way. The system was first reported as a depression on October 25.\n\nAccording to the IMD's Monday morning bulletin, the system was centred at 5:30 am over the east-central and adjoining west-central Bay of Bengal, about 650 km east-southeast of Visakhapatnam, 610 km southeast of Gopalpur in Odisha, 730 km east-southeast of Kakinada, 830 km east of Machilipatnam and 910 km east of Bapatla. Over the previous six hours it had moved westwards at around 15 kmph. The storm is expected to intensify into a severe cyclonic storm by the midnight of Monday, October 26, and into a very severe cyclonic storm over the west-central Bay on Tuesday, October 27, before crossing the Andhra Pradesh and Yanam coasts between Bapatla and Visakhapatnam, close to Yanam, by the forenoon of October 28. Maximum sustained wind speeds at landfall are forecast at 115 to 125 kmph, gusting to 140 kmph, after which the system is expected to weaken gradually as it moves inland.\n\n\"It is very likely to move northwestwards and cross Andhra Pradesh and Yanam coasts between Bapatla and Visakhapatnam as a very severe cyclonic storm with the maximum sustained wind speed of 115-125 kmph gusting to 140 kmph by forenoon of 28th October, 2026,\" the IMD said, renewing an alert it had first issued on Sunday, when the system was still a depression.\n\nThe Andhra Pradesh State Disaster Management Authority (APSDMA) has warned that the next three days will be critical, and its Managing Director, Prakhar Jain, has urged people to strictly follow safety precautions. Strong winds are expected to begin affecting coastal areas from the morning of October 27, a full day before landfall. The IMD has forecast heavy to very heavy rainfall over northern Andhra Pradesh and the central coastal districts on October 27 and 28, with extremely heavy rainfall at isolated places. Srikakulam, Vizianagaram, Visakhapatnam, Anakapalli, Parvathipuram Manyam and Alluri Sitharama Raju districts have been flagged for heavy downpours, while East Godavari, Konaseema and Kakinada have been warned of heavy to very heavy rainfall, with localised waterlogging possible in vulnerable areas.\n\nAndhra Pradesh Chief Minister N. Chandrababu Naidu reviewed the state's preparations on Sunday and again on Monday, directing officials to take every necessary step to minimise damage and ensure there is no loss of life. The review covered evacuation from vulnerable areas, relief centres, and arrangements for food, drinking water, medical assistance and the swift restoration of electricity supply. Fishing boats at sea have been directed to return to shore, and fishing operations across the Bay of Bengal stand suspended until October 28. A senior state disaster management official told Reuters on Monday that authorities had identified around 570,000 people as vulnerable to the storm's impact, and that evacuation operations were scheduled to begin on Monday evening. State officials have said the evacuation of residents from the most exposed coastal districts — Bapatla, Krishna, West Godavari, Konaseema, Kakinada, Anakapalli, Visakhapatnam and Vizianagaram — is to be completed by October 27. According to the Chief Minister's Office, 10 teams of the National Disaster Response Force (NDRF) and 11 teams of the State Disaster Response Force (SDRF) have been deployed in Andhra Pradesh for rescue and relief operations.\n\nIn Odisha, Chief Minister Mohan Charan Majhi has activated the state's full response system, reviewed the situation and directed officials to prioritise public safety, evacuation and emergency response, with the state's stated aim of managing the cyclone with zero casualties. Revenue and Disaster Management Minister Suresh Pujari urged people not to panic and to follow the guidelines of the Special Relief Commissioner, stressing that vulnerable family members must be protected and moved to relief centres wherever required. He said five senior officers and state ministers had been deployed across vulnerable districts to oversee preparations, with relief centres, cooked food, medicines and healthcare arrangements in place.\n\nOdisha has assigned individual ministers to oversee preparedness and restoration in specific districts, where they will remain stationed from October 27 to 29: Kanak Vardhan Singh Deo in Koraput, Pravati Parida in Rayagada, Rabi Naik in Kandhamal, Bibhuti Jena in Ganjam, Krishna Chandra Patra in Nabarangpur, Nityananda Ganda in Malkangiri, Mukesh Mahaling in Kalahandi and Suryabansi Suraj in Gajapati. Six districts have been identified as the focus of the fire and emergency services response — Malkangiri, Koraput, Rayagada, Nabarangpur, Gajapati and Ganjam — where strong winds, heavy rainfall and possible landslides are expected. Inspector General of Fire and Emergency Services Dr Umashankar Dash said 225 teams of fire personnel, with equipment and sophisticated vehicles, were being deployed, along with more than 100 boats, and that a state-level command centre was operating round the clock, with additional manpower, equipment and vehicles to be deployed if required.\n\nChief Fire Officer Ramesh Majhi told news agency ANI that the 225 teams would ensure coverage down to block-headquarter level, equipped with 225 vehicles including towing and transport vehicles. He said 1,510 high-power chainsaws were ready for use in the event of a severe storm, 25 rescue tenders had been provided for critical situations, 12 plasma cutters supplied and 225 tower lights distributed for evening and night operations, and that leave for all personnel across the state had been cancelled.\n\nThe Odisha Disaster Rapid Action Force (ODRAF), the state's specialised force created in the aftermath of the 1999 super cyclone, is being positioned in phases across the threatened districts. ADG (Law and Order) Sanjay Kumar told ANI that around 20 ODRAF teams had been deployed and were working on the ground, structured to rotate in three phases to make up 60 team-deployments, supplemented by older, trained ODRAF personnel and in close coordination with the NDRF. Central Range (Cuttack) Inspector General of Police Satyajit Nayak said control rooms had been set up in every district and that four ODRAF teams each had been deployed in Puri, Jagatsinghpur, Cuttack and Khordha districts. A red alert has been issued for the southern Odisha districts, with very heavy rainfall forecast from Tuesday through Thursday. Odisha has also banned fishing in the sea and restricted tourist entry in six districts as a precaution, and health authorities have prioritised shifting expectant mothers close to delivery, senior citizens, children and persons with disabilities to shelters and health centres ahead of the storm.\n\nThe alert extends beyond the two states closest to the landfall zone. Heavy rain is expected in the Union Territory of Puducherry, where the administration is monitoring the situation, has advised people to take precautions and has told fishermen to stay off the sea. In Tamil Nadu, an orange alert has been issued for Coimbatore, Tiruvannamalai, Villupuram, Kallakurichi, Cuddalore, Mayiladuthurai, Thanjavur, Tiruvarur and Nagapattinam, and tourists have been barred from visiting the hill station of Kodaikanal in view of the heavy rainfall warning as the northeast monsoon intensifies, with police turning back vehicles carrying tourists. Earlier, a red alert was also issued for five districts in Kerala, with people advised not to venture out unnecessarily.\n\nYanam, near which the eye is expected to cross, is a small enclave of the Union Territory of Puducherry set inside Andhra Pradesh's Godavari delta region, where the land is flat and low, leaving it exposed to both heavy rain and storm surge. Odisha's coast carries a hard history: the 1999 super cyclone killed nearly 10,000 people, and the response systems now in use, including ODRAF and large-scale evacuations such as the one mounted for Phailin in 2013, were built in its aftermath. Officials have warned that Arnab could prove more damaging than severe cyclonic storm Montha, which crossed this same coast in October 2025. 'Arnab', a name proposed by Bangladesh, is the first cyclone to form in the Bay of Bengal in 2026.\n\nIn the IMD's damage-potential terms, a storm of this class can tear thatch roofs off houses, badly damage kutcha homes, bend or snap electric poles, uproot large trees and disrupt power and communication lines, with flying debris a danger in the open. Torrential rain brings the risk of flash flooding and waterlogging, swollen streams and landslides in the southern Odisha hill districts, and rising river levels in the Godavari and Krishna basins as the system moves inland. Paddy nearing harvest in the delta districts and the fishing fleets along the coast are among the most exposed economic assets. Sea conditions along and off the Andhra Pradesh and Odisha coasts are expected to remain very rough to phenomenal through the landfall period, and ports and harbours have moved to their storm protocols.\n\nWhat happens next follows the IMD's timeline. Through Monday night, Arnab is expected to climb to a severe cyclonic storm, and on Tuesday to very severe intensity, even as its outer rain bands begin lashing the Andhra and Odisha coasts. Evacuations in Andhra Pradesh are to be completed by Tuesday, and schools and colleges in the most exposed districts are shutting as a precaution. On Wednesday forenoon comes the landfall itself, close to Yanam, with the storm's strongest winds, heaviest rain and the risk of storm surge concentrated around the crossing. After landfall, the system should weaken gradually as it travels inland, though its remnant rain can continue to soak parts of Andhra Pradesh, Odisha, Telangana and Chhattisgarh. The IMD will keep issuing bulletins through the event, and officials in both states say residents should follow those bulletins, not rumour or social media.\n\nFor people in the districts under alert, the official advice is consistent. Those in low-lying, flood-prone or coastal areas, and those living in thatched or damaged houses, should move to relief centres and cyclone shelters when asked, carrying documents, medicines and essentials. Fishermen have been told not to venture into the sea. Residents should stay indoors during the storm's passage, keep away from fallen power lines, old trees and hoardings, keep mobile phones charged, and rely on the district control rooms, which are functioning round the clock, for help and information."

        "title": "सीरीज़ पर कब्ज़े से एक जीत दूर भारत, लेकिन वेलिंगटन मुकाबले से बाहर हुए ईशान किशन",
        "summary": "बीसीसीआई ने पुष्टि की है कि ईशान किशन दाहिने एडक्टर में खिंचाव के कारण मंगलवार को वेलिंगटन में होने वाले तीसरे टी20 से बाहर रहेंगे। पांच मैचों की सीरीज में 2-0 से आगे चल रहा भारत जीत के साथ सीरीज अपने नाम करना चाहेगा।",
        "body": "भारत को सीरीज़ सील करने का काम ईशान किशन के बिना करना होगा। विकेटकीपर-बल्लेबाज़ तीसरे टी20 अंतरराष्ट्रीय मैच से बाहर हो गए हैं, जो मंगलवार 27 अक्टूबर को वेलिंगटन के हेनरी स्टेडियम में खेला जाएगा। किशन को सीरीज़ के पहले मैच के दौरान दाहिने एडक्टर में हल्का खिंचाव आया था, जिससे वे अब तक मैच फिटनेस हासिल नहीं कर पाए हैं। भारतीय क्रिकेट कंट्रोल बोर्ड (बीसीसीआई) ने सोमवार को इसकी पुष्टि की — उस मैच से एक दिन पहले जिसमें क्राइस्टचर्च में दो रोमांचक पीछों के बाद पांच मैचों की सीरीज़ में 2-0 से आगे भारत दो मैच शेष रहते ट्रॉफ़ी अपने नाम कर सकता है, जबकि न्यूज़ीलैंड को मुकाबला ज़िंदा रखने के लिए जीतना ही होगा।\n\nबीसीसीआई ने अपने अपडेट में कहा, \"ईशान किशन दाहिने एडक्टर में आए उस हल्के खिंचाव से अच्छी तरह उबर रहे हैं जो उन्हें न्यूज़ीलैंड के खिलाफ़ सीरीज़ के पहले टी20 मैच के दौरान आया था। वे अभी मैच फिटनेस हासिल नहीं कर पाए हैं और 27 अक्टूबर 2026 को वेलिंगटन में खेले जाने वाले तीसरे टी20 मैच से बाहर हैं।\" बोर्ड ने यह भी बताया कि उसकी मेडिकल टीम 28 वर्षीय खिलाड़ी की प्रगति पर लगातार नज़र रख रही है। किशन शनिवार को हेगले ओवल में खेले गए दूसरे टी20 से भी बाहर रहे थे, और भारत के गेंदबाज़ी कोच मोर्ने मोर्केल ने वेलिंगटन मैच से पहले संवाददाताओं से कहा कि बाएं हाथ का यह बल्लेबाज़ सोमवार को प्रशिक्षण तो करेगा, लेकिन चयन के लिए उपलब्ध नहीं है — यह फ़ैसला पूरी तरह एहतियात के तौर पर लिया गया है। दौरे में अभी बहुत क्रिकेट बाकी है — टी20 के बाद पांच वनडे और दो टेस्ट हैं — ऐसे में उस खिलाड़ी को जल्दबाज़ी में लौटाने का कोई कारण नहीं है जिसका खेल विस्फोटक हरकतों पर टिका है। किशन वनडे प्रारूप में भी भारत की योजनाओं के केंद्र में हैं; वे उस सीरीज़ के चौथे और पांचवें वनडे के लिए उपकप्तान और विकेटकीपर के रूप में सूचीबद्ध हैं।\n\nकिशन की अनुपस्थिति से भारत के पास विकल्प की कमी नहीं है। अनकैप्ड विकेटकीपर-बल्लेबाज़ कुमार कुशाग्रा, जो न्यूज़ीलैंड में दौरा कर रही इंडिया ए टीम के साथ पहले से मौजूद थे, दूसरे टी20 से पहले कवर के तौर पर सीनियर टीम से जुड़े थे और किशन के पुनर्वास के दौरान तीसरे मैच के लिए भी टीम के साथ बने रहेंगे। उनके पीछे, किशोर बल्लेबाज़ वैभव सूर्यवंशी, जिन्होंने दूसरे मैच में नंबर तीन की ज़िम्मेदारी संभाली थी, वेलिंगटन में भी उसी भूमिका में बने रहने की संभावना है। अब 15 साल के सूर्यवंशी ने इंडियन प्रीमियर लीग में अपनी पहचान बनाई थी, जहां महज़ 14 साल की उम्र में उन्होंने राजस्थान रॉयल्स के लिए 35 गेंदों में शतक ठोक दिया था, और उन्हें इंडिया ए से होते हुए तेज़ी से सीनियर टी20 टीम तक पहुंचाया गया है।\n\nभारत की यह स्थिति क्राइस्टचर्च के नतीजों से बनी है। 22 अक्टूबर को सीरीज़ के पहले मैच में न्यूज़ीलैंड ने 4 विकेट पर 225 रन बनाए, लेकिन भारत ने 226 के लक्ष्य का पीछा दो गेंद शेष रहते छह विकेट खोकर कर लिया — यह भारत के टी20 इतिहास का सबसे बड़ा सफल पीछा है। 24 अक्टूबर को उसी हेगले ओवल में दूसरे मैच में न्यूज़ीलैंड ने 5 विकेट पर 180 रन बनाए और भारत ने जवाब में 6 विकेट पर 181 रन बनाकर तीन दिन में दूसरी बार चार विकेट से जीत दर्ज की, इस बार सिर्फ़ एक गेंद शेष रहते। तिलक वर्मा की नाबाद 51 रन की पारी, जिसने भारत को अंतिम ओवरों से पार लगाया, मैच की सर्वश्रेष्ठ खिलाड़ी चुनी गई, जबकि न्यूज़ीलैंड के कप्तान मिचेल सैंटनर ने 21 रन देकर 4 विकेट लिए — एक ऐसा स्पेल जिसने मैच को लगभग मेज़बानों की ओर वापस खींच लिया था। दो मैच, दो चार-विकेट की जीतें, दोनों अंतिम ओवर में पक्की — स्कोरलाइन वर्चस्व कहती है, लेकिन अंतर बताते हैं कि न्यूज़ीलैंड हर मैच में जीत के करीब था।\n\nअगर भारत की कोई चिंता है, तो वह उसके सबसे अनुभवी गेंदबाज़ को लेकर है। भुवनेश्वर कुमार की चार साल बाद टी20 टीम में वापसी दौरे की बड़ी चर्चा बन गई है। 36 वर्षीय तेज़ गेंदबाज़, जिनका इस दौरे से पहले भारत के लिए किसी भी प्रारूप में अंतिम मैच नवंबर 2022 में आया था — उनका आखिरी टी20 मैच 2022 विश्व कप का सेमीफ़ाइनल था — उन्होंने अपनी दो पारियों में 49 और 50 रन दिए हैं और एक ही विकेट लिया है, दूसरे मैच में डेरिल मिचेल का। पूरी सीरीज़ में उनकी 12.37 की इकॉनमी दर — आठ ओवरों में 99 रन — भारत के गेंदबाज़ों में सबसे खराब है। उनके पक्ष की बुनियाद वह रिकॉर्ड है जिससे उन्होंने वापसी अर्जित की: लगातार शानदार आईपीएल सत्र, एक अभियान में 17 विकेट और अगले में 28, जबकि उनकी टीम रॉयल चैलेंजर्स बेंगलुरु ने दोनों खिताब जीते।\n\nधैर्य की सार्वजनिक दलील मोर्केल ने दी, जो खुद पूर्व तेज़ गेंदबाज़ हैं। मोर्केल ने मैच-पूर्व संवाददाता सम्मेलन में कहा, \"देखिए, उनकी वापसी को लेकर मेरे मन में बहुत सहानुभूति है। मैं ऐसा इसलिए कहता हूं क्योंकि एक तो चार साल बाद आने पर उम्मीदें होंगी। उन्होंने आईपीएल में असाधारण रूप से अच्छा किया है। उन्होंने सच में अच्छी गेंदबाज़ी की है। एक बात है उम्मीदों के कारक को बाहर रखना। दूसरी बात, उनके चयन से पहले का वह एक महीना क्रिकेट का था जहां हां, उन्होंने प्रशिक्षण लिया, लेकिन अंतरराष्ट्रीय क्रिकेट में आकर खेलना एक अलग ही जानवर है जहां अंतर बहुत छोटे होते हैं। इसलिए कार्यक्रम की वजह से उन्हें सीमित प्रशिक्षण के साथ आना पड़ा ताकि वे खुद को तैयार कर सकें।\" अपने वरिष्ठ गेंदबाज़ को मोर्केल की सलाह लगातार और सरल रही है: \"उम्मीदों के कारक को बाहर रखो... बस तुम तुम ही रहो और उससे जुड़े रहो।\" उन्होंने कहा कि कौशल और अनुभव सब मौजूद है, लेकिन भुवनेश्वर को कुछ मैचों में अपने पैर जमाने का मौका देना होगा; किसी चीज़ के पीछे भागने के बजाय वे हर मैच में बेहतर होंगे और अपनी लय पाएंगे, और बाहर के शोर के बारे में उन्हें नहीं सोचना चाहिए। गौरतलब है कि मोर्केल का यह बचाव चयन की गारंटी नहीं था — यह तर्क था कि यह खिलाड़ी जमने का मौका पाने का हकदार है, और वेलिंगटन दिखाएगा कि टीम प्रबंधन इससे सहमत है या नहीं।\n\nमोर्केल ने क्राइस्टचर्च में तीसरे तेज़ गेंदबाज़ के बदलाव पर भी बात रखी। मयंक यादव ने पहला मैच खेला और 40 रन देकर 1 विकेट लिया, फिर प्रिंस यादव ने दूसरे मैच में उनकी जगह ली और 30 रन देकर 1 विकेट लिया। मोर्केल ने कहा, \"वह पूरी तरह एक सामरिक बदलाव था जो हमें लगा कि उस स्थल पर ज़रूरी था।\" उन्होंने समझाया कि प्रिंस डेथ ओवरों में अपनी यॉर्कर काफी अच्छी तरह अंजाम देता है, और पहले मैच की सीखों — दूसरे नंबर पर गेंदबाज़ी और गीली गेंद की संभावना, तथा मैदान के आयामों — के कारण यह बदलाव किया गया। उन्होंने कहा, \"मुझे लगा मयंक ने उस पहले मैच में सच में अच्छी गेंदबाज़ी की। तो यह निश्चित रूप से प्रदर्शन की वजह से नहीं है।\" मोर्केल ने कहा कि मयंक जैसे युवा गेंदबाज़ के लिए, जो अभी कच्चा है और ओवर को पढ़ना व तैयार करना सीख रहा है, एक मैच खेलकर सोचने का समय मिलना बुरा नहीं है, जबकि प्रिंस खेल के सभी चरणों में तेज़ गेंदबाज़ी कर सकता है और उसका अंजाम बस थोड़ा बेहतर है।\n\nइसके विपरीत न्यूज़ीलैंड की समस्याएं अनुपस्थितियां हैं। मेज़बानों को जीतना ही होगा वाला तीसरा टी20 अपने दो सबसे घातक तेज़ गेंदबाज़ों के बिना खेलना होगा। मैट हेनरी, जिन्हें दूसरे मैच में पिंडली में तकलीफ़ हुई — शनिवार को हेगले ओवल में उन्होंने सिर्फ़ दो ओवर डाले, जिनमें एक मेडन था — सीरीज़ के बाकी मैचों के लिए उपलब्ध नहीं हैं और अन्य प्रारूपों से पहले अपने कार्यभार का प्रबंधन करने के लिए क्राइस्टचर्च में ही रहेंगे, और 2 नवंबर को ऑकलैंड में वनडे टीम से जुड़ेंगे। लॉकी फर्ग्यूसन, जो दूसरे मैच में एहतियात के तौर पर मैदान से बाहर गए थे और हेनरी की तरह अपने तय ओवर पूरे नहीं कर पाए थे, वेलिंगटन मैच में नहीं खेलेंगे, ऑकलैंड के लिए रवाना होंगे और अंतिम दो टी20 के लिए टीम से फिर जुड़ेंगे। क्राइस्टचर्च में दोनों में से किसी ने अपना स्पेल पूरा नहीं किया, और अब वेलिंगटन में दोनों में से कोई एक भी गेंद नहीं डालेगा।\n\nब्लेयर टिकनर अंतिम तीन टी20 के लिए टीम से जुड़े हैं। काइल जेमीसन वेलिंगटन में खेलेंगे — टी20 चरण में उनकी एकमात्र उपस्थिति — फिर राजधानी में ही रहकर 31 अक्टूबर को बेसिन रिज़र्व में फ़ोर्ड ट्रॉफ़ी के दूसरे दौर में कैंटरबरी के लिए खेलेंगे, जो टेस्ट सीरीज़ की उनकी तैयारी का हिस्सा है, और फिर वनडे के लिए ब्लैक कैप्स से जुड़ेंगे। मैट फ़िशर सिर्फ़ तीसरे टी20 के लिए तेज़ गेंदबाज़ी कवर के रूप में टीम के साथ वेलिंगटन जाएंगे, फिर लिंकन में न्यूज़ीलैंड ए टीम में लौट जाएंगे। जोश क्लार्कसन ऑकलैंड और हैमिल्टन में अंतिम दो टी20 के लिए चयन हेतु उपलब्ध रहेंगे। फ़र्ग्यूसन और हेनरी की अनुपस्थिति में आक्रमण का भार एडम मिल्ने और टिकनर पर है, दोनों सीरीज़ के बाकी हिस्से के लिए उपलब्ध हैं, साथ में जेमीसन की एक रात की उपस्थिति और कप्तान सैंटनर की स्पिन।\n\nमुख्य कोच रॉब वाल्टर ने इस उथल-पुथल को भरे घरेलू सत्र की कीमत और गहराई के लाभ के रूप में प्रस्तुत किया। न्यूज़ीलैंड क्रिकेट के हवाले से वाल्टर ने कहा, \"टी20 सीरीज़ की शुरुआत प्रतिस्पर्धी रही है, दो करीबी मैचों के साथ और आगे बहुत क्रिकेट बाकी है। टीम की गहराई के मामले में हम बहुत भाग्यशाली हैं कि हम अपने तेज़ गेंदबाज़ों के कार्यभार का प्रबंधन करने में मदद के लिए अलग-अलग खिलाड़ियों को बुला सकते हैं, और यह सुनिश्चित करने की कोशिश कर सकते हैं कि वे आगे आने वाले सारे क्रिकेट के लिए टीम के लिए प्रदर्शन करने के लिए सबसे अच्छी स्थिति में हों।\" दौरा दिसंबर के पहले सप्ताह तक चलता है, लेकिन तात्कालिक सच्चाई यह है कि न्यूज़ीलैंड दो ऐसे मैच हारा है जिन्हें जीतने की स्थिति में वह था, और अब उसे क्राइस्टचर्च से बाहर, कठिन परिस्थितियों में, पुनर्गठित आक्रमण के साथ सीरीज़ बचानी है।\n\nवे परिस्थितियां मैच का हिस्सा हैं। राजधानी को अनौपचारिक रूप से दुनिया का सबसे हवादार शहर कहा जाता है, और इस समय वह सामान्य से भी ज़्यादा हवादार है — इतनी तेज़ हवाएं कि हाल के दिनों में शहर का वाटरफ़्रंट बंद करना पड़ा, जब साइकिल सवार अपनी साइकिलों से गिर गए। मैच के दिन बारिश का भी अनुमान है। हेनरी स्टेडियम — वह बहु-खेल अखाड़ा जिसे स्थानीय लोग \"केक टिन\" कहते हैं — ड्रॉप-इन पिच का इस्तेमाल करता है, और उसकी स्क्वायर बाउंड्री मात्र करीब 60 मीटर लंबी है, जो उस क्रॉसविंड में गेंदबाज़ों की गलती की गुंजाइश और कम कर देती है। मोर्केल ने आधी मज़ाक में कहा, \"यह हवा एक अलग ही जानवर है। मैं आज सुबह होटल में था, और पूरी इमारत जैसे हिल रही थी। तो मुझे लगता है कि यह हमारे खिलाड़ियों के लिए किताबों में जुड़ने वाली एक नई चीज़ होगी जिसे उन्हें जल्दी बदलाव के साथ अपनाना होगा। लेकिन हां, हमारे लिए, फिर से, उस चुनौती की ओर देखना और उसका सामना करना है, बहाने नहीं बनाना है।\"\n\nमोर्केल, जिन्होंने दक्षिण अफ़्रीकी तेज़ गेंदबाज़ के रूप में वेलिंगटन के बेसिन रिज़र्व में दो टेस्ट खेले थे, दौरे की शुरुआत से पहले से ही अपने खिलाड़ियों को इसके मानसिक पहलू के लिए तैयार कर रहे थे। उन्होंने कहा, \"मुझे लगता है यह हवा बहुत सी चीज़ों को प्रभावित कर सकती है। यह बल्लेबाज़ी को प्रभावित कर सकती है, आपके स्टांस को, यह कई कारकों को प्रभावित कर सकती है।\" उन्होंने कहा कि वार्म-अप और प्रशिक्षण सत्र की छोटी सी खिड़की में खिलाड़ी यह समझने की कोशिश कर सकते हैं कि हवा उन्हें कैसे प्रभावित करेगी, और मैच के समय उसे दिमाग से निकालकर हर गेंद को अंजाम देना होता है। उन्होंने कहा कि टीम ने दौरे की शुरुआत से पहले वेलिंगटन के बारे में बात की थी, मज़ाक में भारत वापस गए कुछ खिलाड़ियों से कहा था कि घर पर एक बहुत मज़बूत पंखा लो और उस पंखे में चलो, क्योंकि वही तैयारी होगी, और यह भी कि दो, तीन या चार दिनों में कोई इस हवा का अभ्यस्त नहीं हो सकता — इसलिए खिलाड़ियों को इसे चुनौती के रूप में देखना होगा, नकारात्मक के रूप में नहीं। उन्होंने कहा, \"और दिन के अंत में, आपको किसी ऐसे व्यक्ति की ज़रूरत है जो हाथ उठाकर हवा के ख़िलाफ़ गेंदबाज़ी करे क्योंकि हम चार गेंदबाज़ों को हवा के साथ गेंदबाज़ी नहीं करवा सकते।\"\n\nटॉस भारतीय समयानुसार दोपहर 12 बजे निर्धारित है, पहली गेंद दोपहर 12:30 बजे — स्थानीय समय रात 8 बजे, रोशनी में खेला जाने वाला रात का मैच। भारत की जीत सीरीज़ को प्रतियोगिता के रूप में समाप्त कर देगी और शेष मैचों — 30 अक्टूबर को ऑकलैंड के ईडन पार्क में चौथा टी20, और 1 नवंबर को हैमिल्टन में पांचवां — को 4 नवंबर से शुरू होने वाली पांच मैचों की वनडे सीरीज़ से पहले गौरव और तैयारी की प्रतियोगिता में बदल देगी। न्यूज़ीलैंड की जीत सब कुछ ज़िंदा रखेगी। वनडे के बाद दौरा नवंबर के अंत और दिसंबर की शुरुआत में वेलिंगटन और क्राइस्टचर्च में दो टेस्ट की सीरीज़ के साथ पूरा होगा, जिसमें विश्व टेस्ट चैंपियनशिप के अंक जुड़े हैं।"

      "en": {
        "title": "One Win From Sealing the Series, India Lose Kishan for the Wellington Clash With New Zealand",
        "summary": "The BCCI has confirmed that Ishan Kishan will miss Tuesday's third T20I in Wellington as he continues to recover from a right adductor strain. India, leading the five-match series 2-0, can seal the series with a win.",
        "body": "India will have to seal the series without Ishan Kishan. The wicketkeeper-batter has been ruled out of the third T20I against New Zealand, to be played at Wellington's Hnry Stadium on Tuesday, October 27, after failing to regain match fitness from the low-grade right adductor strain he sustained during the first match of the series. The Board of Control for Cricket in India (BCCI) confirmed the news on Monday, a day before a game in which India, leading the five-match series 2-0 after two close chases in Christchurch, can wrap up the trophy with two matches to spare, while New Zealand must win simply to keep the contest alive.\n\n\"Ishan Kishan is recovering well from his low grade right adductor strain, which he sustained during the first T20I of the series against New Zealand. He is yet to regain match fitness and is ruled out of the third T20I to be played on October 27, 2026 in Wellington,\" the BCCI said, adding that its medical team is continuing to monitor the 28-year-old's progress. Kishan also missed the second T20I at Hagley Oval on Saturday. India's bowling coach Morne Morkel told reporters ahead of the Wellington game that the left-hander would train on Monday but was not available for selection, purely as a precaution. With a long tour still to run — five One-Day Internationals and two Tests follow the T20Is — there is no reason to rush back a player whose game depends on explosive movement, and Kishan is also central to India's ODI plans, listed as vice-captain and wicketkeeper for the fourth and fifth ODIs of that series.\n\nKishan's absence does not leave India scrambling. Uncapped wicketkeeper-batter Kumar Kushagra, who was already in New Zealand with the touring India A squad, joined the senior team as cover ahead of the second T20I and will remain with the squad for the third game as Kishan continues his rehabilitation. Behind him, teenager Vaibhav Sooryavanshi, who took over the No. 3 spot in the second match, is expected to continue in that role in Wellington. Sooryavanshi, now 15, announced himself in the Indian Premier League, where, still only 14, he smashed a 35-ball century for Rajasthan Royals, and has been fast-tracked through India A into the senior T20I side. India's captain in this series, Shreyas Iyer, has so far had a squad deep enough to absorb the loss of a first-choice wicketkeeper without breaking stride.\n\nIndia's position comes from Christchurch. In the opener on October 22, New Zealand posted 225 for 4, only for India to chase down 226 with two balls to spare, losing six wickets — the highest successful run chase in India's T20I history. In the second match on October 24, at the same Hagley Oval, New Zealand made 180 for 5, and India replied with 181 for 6 to win by four wickets for the second time in three days, this time with a single ball remaining. Tilak Varma's unbeaten 51, which carried India through the closing overs, was named Player of the Match, while New Zealand captain Mitchell Santner took 4 for 21 in a spell that nearly dragged the game back for the hosts. Two matches, two four-wicket wins, both sealed in the final over — the scoreline says dominance, but the margins say New Zealand have been close in each game.\n\nIf India have a concern, it is their most experienced bowler. Bhuvneshwar Kumar's return to the T20I side after four years has become a talking point of the tour. The 36-year-old seamer, whose previous appearance for India in any format before this tour came in November 2022 — his last T20I was the 2022 World Cup semi-final — has conceded 49 and 50 runs in his two outings, taking a single wicket, that of Daryl Mitchell in the second match. His economy rate of 12.37 across the series, 99 runs in eight overs, is the poorest among India's bowlers. The case for him rests on how he earned the recall: consecutive outstanding IPL seasons, 17 wickets in one campaign and 28 in the next, as his team, Royal Challengers Bengaluru, won both titles.\n\nIt was left to Morkel, himself a former fast bowler, to make the public case for patience. \"Look, I've got a lot of sympathy for his return,\" Morkel said at the pre-match press conference. \"The reason why I say that is, one, there will be expectation after four years to come out. He's done exceptionally well in the IPL. He's bowled really well. One is to block the expectation factor out. Two, leading into his selection, I mean, there was a month of cricket where, yes, he trained, but this is a different beast coming and playing international cricket where the margins are small. So he had to come in with limited training because of the schedule to get himself ready.\" His advice to the senior bowler has been consistent: \"Block the expectation factor out... just be you and connect with that.\" Morkel added that the skill and experience are all there, but Bhuvneshwar must be allowed to find his feet over some games rather than chase anything: every game he will get better and find his rhythm, and he should not think about any outside noises. The defence was not a guarantee of selection — it was an argument that Bhuvneshwar deserves the chance to settle, and Wellington will show whether the team management agrees.\n\nMorkel also explained India's rotation of the third seamer in Christchurch, where Mayank Yadav played the opener and returned 1 for 40 before Prince Yadav replaced him for the second match and took 1 for 30. \"That was just purely a tactical sort of change we felt was needed at that venue,\" he said, explaining that Prince executes his yorkers at the death quite well, which mattered with the learnings from game one — the possibility of bowling second with a wet ball, and the dimensions of the field. \"I felt Mayank bowled really well in that first game. So it's definitely not because of performance.\" Morkel said it can be good for a young bowler like Mayank, who is still raw and still learning how to read and set up an over, to play a game and then have time to reflect, while Prince can bowl fast in all phases of the game and his execution is slightly higher.\n\nNew Zealand's problems, by contrast, are absences. The hosts will play the must-win match without two of their most potent fast bowlers. Matt Henry, who hurt his calf in the second match — he bowled only two overs at Hagley Oval, one of them a maiden, on Saturday — is unavailable for the remainder of the series and will stay back in Christchurch to manage his workload ahead of the other formats, joining the ODI squad in Auckland on November 2. Lockie Ferguson, who also left the field in the second game as a precaution and, like Henry, did not complete his allotted overs, will sit out the Wellington match, depart for Auckland, and rejoin the squad for the final two T20Is. Neither finished his spell in Christchurch, and neither will bowl a ball in Wellington.\n\nBlair Tickner has joined the squad for the final three T20Is. Kyle Jamieson will feature in Wellington — his only appearance of the T20I leg — before remaining in the capital to play for Canterbury in the second round of the Ford Trophy at the Basin Reserve on October 31, as part of his preparation for the Test series, and then rejoining the Black Caps for the ODIs. Matt Fisher will travel with the team to Wellington purely as pace cover for the third T20I, before returning to the New Zealand A squad at Lincoln. Josh Clarkson will be available for selection for the last two T20Is in Auckland and Hamilton. In Ferguson's and Henry's absence, the attack leans on Adam Milne and Tickner, both available for the remainder of the series, alongside Jamieson's one-night presence and the spin of captain Santner.\n\nHead coach Rob Walter framed the changes as the price of a packed home season, and the benefit of depth. \"It's been a competitive start to the T20 series with two close games and plenty more cricket to come. We're very fortunate with the depth in the squad to be able to call upon different players to help manage our pacers' workloads, and to try and ensure they're best placed to perform for the team for all the cricket coming up,\" Walter said, as quoted by New Zealand Cricket. The tour runs to the first week of December, but the immediate scoreboard truth is that New Zealand have lost two matches they were positioned to win and must now defend the series with a rebuilt attack, away from Christchurch, in difficult conditions.\n\nThose conditions are a factor in the match. Wellington is unofficially called the windiest city in the world, and it is windier than usual at the moment — gusty enough in recent days that the city's waterfront was closed after cyclists were knocked off their bikes. Rain is also forecast for match day. The Hnry Stadium — the multi-sport arena locals call the \"Cake Tin\" — uses a drop-in pitch, and its square boundaries are only around 60 metres long, which shortens the margin for error for bowlers already fighting a crosswind. \"This is a different beast, this wind. I was in the hotel this morning, and the whole building was sort of shaking,\" Morkel said, only half-joking. \"So I think it's going to be a new sort of thing that we add to our books for the guys to get used to and accustomed with, with a quick turnaround. But yeah, for us, again, it is looking forward to that challenge and taking it head-on, and not really making excuses.\"\n\nMorkel, who played two Tests at Wellington's Basin Reserve as a South African fast bowler, has been preparing his players for the mental side of it since before the tour began. \"I think this wind can impact a lot of things. It can impact batting, your stance, it can impact many factors,\" he said, adding that the warm-up and training give a short window to understand how it will affect you, and at game time you have to block it out and execute every delivery. He added that the team had spoken about Wellington before the start of the tour, joked that players back in India should prepare by walking into a very strong fan at home, and said you cannot get used to the wind in two, three or four days, so the players must frame it as a challenge rather than a negative. \"At the end of the day, you need somebody to put their hand up and bowl into the wind because we can't have four guys bowling with the wind.\"\n\nThe toss is scheduled for 12 noon IST, with the first ball at 12:30 pm IST — 8 pm local time, a night game under lights. A win for India ends the series as a contest and turns the remaining fixtures, the fourth T20I at Eden Park, Auckland on October 30 and the fifth at Hamilton on November 1, into matches for pride and preparation ahead of the five-match ODI series that follows from November 4. A win for New Zealand keeps everything alive. After the ODIs, the tour closes with a two-Test series in late November and early December, in Wellington and Christchurch, that carries World Test Championship points."

        "summary": "लाहौर में इंग्लैंड के खिलाफ पाकिस्तान 154/9 पर सिमटता दिख रहा था, लेकिन शादाब खान के नाबाद 113 रनों और हारिस रऊफ के साथ 89 रनों की रिकॉर्ड साझेदारी ने टीम को एक विकेट से ऐतिहासिक जीत दिला दी। इस जीत के साथ पाकिस्तान त्रिकोणीय सीरीज के फाइनल में पहुंच गया।",
        "body": "कुछ पारियां मैच जिताती हैं। रविवार रात लाहौर में शादाब खान की पारी ने एक साथ दो रिकॉर्ड बुक दोबारा लिख दीं। त्रिकोणीय वनडे सीरीज के तीसरे मैच में इंग्लैंड के खिलाफ 242 रन का पीछा करते हुए पाकिस्तान 103 रन पर 6 विकेट गंवा चुका था, जब शादाब आठवें नंबर पर उतरे, और जब अंतिम खिलाड़ी हारिस राउफ उनके साथ जुड़े तो स्कोर 154 रन पर 9 विकेट था — हर उचित माप से हारा हुआ मैच। इसके बाद जो हुआ वह शादाब के 96 गेंदों में नाबाद 113 रन थे — पुरुष वनडे क्रिकेट में आठवें या उससे नीचे के नंबर पर बल्लेबाजी करने वाले किसी बल्लेबाज का अब तक का सर्वोच्च स्कोर — और राउफ के साथ दसवें विकेट के लिए 89 रनों की अटूट साझेदारी, जो वनडे इतिहास में किसी सफल रन-पीछे (चेज) में दसवें विकेट की सबसे बड़ी साझेदारी है। पाकिस्तान ने 47.1 ओवर में 9 विकेट पर 243 रन बनाकर मैच एक विकेट से, 17 गेंद शेष रहते जीता, और तीन मैचों में तीन जीत के परफेक्ट रिकॉर्ड के साथ 31 अक्टूबर के त्रिकोणीय सीरीज फाइनल में अपनी जगह पक्की कर ली।\n\nबचाव के पैमाने को समझने के लिए स्कोरकार्ड के गणित पर ठहरना जरूरी है। इंग्लैंड का 46.4 ओवर में बना 241 रन मामूली स्कोर था, लेकिन गेंदबाजों को कुछ मदद देती लाहौर की सतह पर वह तुच्छ भी नहीं था, और पाकिस्तान का जवाब किस्तों में बिखरता गया। शादाब के आने तक छह विकेट 103 रन पर गिर चुके थे — पीछा पहले ही निचले क्रम के हाथों में था — और उनके इर्द-गिर्द स्लाइड जारी रहा। 34वें ओवर तक पाकिस्तान 154 रन पर 9 विकेट था: नौ विकेट गिरे हुए, अभी 88 रन चाहिए, क्रीज पर एक ऐसा बल्लेबाज जो पेशे से गेंदबाजी ऑलराउंडर है, और राउफ के रूप में ग्यारहवां खिलाड़ी, जिसका काम बस इतना था कि दूसरे खिलाड़ी के कोई चमत्कार करने तक टिके रहो। पाकिस्तान के कप्तान शाहीन शाह अफरीदी ने बाद में इसका वर्णन सिर हिलाते हुए किया। शाहीन ने कहा, \"मैं कुछ नहीं कह सकता। सच कहूं तो मैंने अपनी जिंदगी में ऐसा कभी नहीं देखा। मैं शादाब खान के लिए बहुत खुश हूं। उन्होंने अविश्वसनीय पारी खेली। मैं उनके साथ विजय चक्कर (विक्टरी लैप) लगाने गया क्योंकि मैंने अपनी जिंदगी में ऐसा कभी नहीं देखा।\"\n\nशादाब की पारी दो अलग हिस्सों में बनी थी, और पहले हिस्से के अनुशासन ने ही दूसरे को संभव बनाया। जब वे 103 रन पर 6 विकेट पर उतरे, तो मैच की स्थिति दुस्साहस की इजाजत नहीं देती थी: इंग्लैंड के गेंदबाज जोश में थे, जरूरी रन गति चढ़ रही थी, और हर अतिरिक्त विकेट पाकिस्तान की संभावनाओं को पतली से सैद्धांतिक बना रहा था। शादाब का जवाब पारी को एक लंबी बातचीत की तरह लेना था — स्ट्राइक बदलते रहना, जहां संभव हो अपने साथियों को स्ट्राइक गेंदबाजों से बचाना, और उन कम-संभावना वाले शॉटों से इनकार करना जिन्होंने शीर्ष क्रम को निगला था। जैसे-जैसे दूसरे छोर पर विकेट गिरते गए, वह बातचीत एक घेराबंदी बन गई। नौवां विकेट 154 पर गिरा, और समीकरण अपने सबसे निर्मम रूप में सिमट गया: शादाब को, स्ट्राइक पर रहते हुए या उसे संभालते हुए, 88 रनों में से लगभग सारे खुद बनाने थे, एक पूरी ताकत वाले आक्रमण के खिलाफ, बिना कोई घातक गलती किए — जबकि राउफ का काम बस, और भयावह रूप से, हर ओवर के अंत तक वहां मौजूद रहना था। राउफ 19 गेंदों में 7 रन बनाकर नाबाद रहे। साझेदारी के संदर्भ में वे 19 गेंदें कई अर्धशतकों जितनी मूल्यवान थीं: उनके टिके रहने वाला हर ओवर समस्या इंग्लैंड की ओर लौटा देता था, जिसके क्षेत्ररक्षक एक-एक रोकी गई गेंद के साथ खेल को हाथ से फिसलता महसूस कर रहे थे। दूसरे छोर पर ग्यारहवें नंबर के खिलाड़ी के साथ जमे हुए बल्लेबाज को हर ओवर में गति बनाए रखने के लिए पर्याप्त जल्दी बाउंड्री भी खोजनी होती है और स्ट्राइक बदलने वाला एक रन ओवर की अंतिम गेंदों तक टालना होता है, ताकि अंतिम-क्रम का खिलाड़ी सबसे कम गेंदों का सामना करे। शादाब ने उस पैटर्न को उस अनुशासन से अंजाम दिया जो उनके इर्द-गिर्द की अराजकता से मेल नहीं खाता था।\n\nचरम तब आया जब शादाब नब्बे के दशक में थे और फिनिश लाइन अचानक दिखने लगी थी। 97 रन पर उन्हें गस एटकिंसन की गेंद पर पगबाधा (एलबीडब्ल्यू) आउट दिया गया — एक ऐसा फैसला जो अगर कायम रहता तो एक ही पल में पारी, मैच और चमत्कार तीनों खत्म हो जाते। शादाब ने रिव्यू लिया। रिप्ले ने वही दिखाया जो उन्होंने महसूस किया था: बल्ले का मोटा अंदरूनी किनारा पैड पर। फैसला पलट गया, और उस जीवनदान ने इंग्लैंड के बचे-खुचे संयम को विस्फोट कर दिया। शादाब ने उस जीवनदान का जवाब एटकिंसन पर लगातार चौके लगाकर अपना शतक पूरा किया — आठवें नंबर से, एक ऐसे पीछे में जो मर चुका था, बनाया गया पहला वनडे शतक — और फिर उसी ओवर में एक छक्का लगाया जिससे पाकिस्तान को सिर्फ तीन रन चाहिए रह गए। अंतिम स्पर्श राउफ के हिस्से आया, सभी लोगों में से उन्हीं के: पदार्पण कर रहे हेनरी क्रोकॉम्ब का सामना करते हुए, जिन्हें 48वें ओवर में तीन रन बचाने थे और स्ट्राइक पर ग्यारहवां नंबर था, तेज गेंदबाज ने मैदान के सीधा नीचे विजयी चौका जड़ा, और लाहौर उस फिनिश के लिए झूम उठा।\n\nइंग्लैंड का 241 एक बनाया गया स्कोर था, और उसका एक स्पष्ट लेखक था। बेन डकेट के 105 रन निरंतर समस्या-समाधान की पारी थे: जहां साथी आते-जाते रहे — उनमें कप्तान हैरी ब्रूक भी, जो एक रन पर आउट हुए — वहां डकेट ने पारी की रीढ़ बरकरार रखी, मध्य ओवरों में पाकिस्तान के स्पिनरों को खेला और तेज गेंदबाजों के खिलाफ अपने पल चुने। सैम कुरेन के 42 रनों ने अंतिम धक्का दिया और स्कोर को उस क्षेत्र में ले गए जिसकी रक्षा इंग्लैंड के गेंदबाज कर सकते थे। उन गेंदबाजों को दूसरी तरफ से वही व्यक्ति रोक रहा था जो रात को जीतने वाले कप्तान के रूप में खत्म करेगा: शाहीन अफरीदी ने चार विकेट लिए, जिस प्रदर्शन ने इंग्लैंड को उस 260 से ऊपर के स्कोर से नीचे रखा जिसकी धमकी उनके मंच ने कई बार दी थी। इंग्लैंड 46.4 ओवर में ऑल आउट भी हो गया, अपने आवंटन की 20 गेंदें अप्रयुक्त छोड़कर — एक विकेट और 17 गेंदों से तय हुई रात में, वे अप्रयुक्त गेंदें वे रन थीं जो कभी बने ही नहीं।\n\nउन दो रिकॉर्डों में से पहला व्यक्तिगत है। शादाब के नाबाद 113 रन अब पुरुष वनडे इतिहास में आठवें या उससे नीचे के नंबर पर बल्लेबाजी करने वाले बल्लेबाज का सर्वोच्च स्कोर है। उन्होंने जिस निशान को पार किया वह एक गोल शतक था, जो पहले दो बार छुआ गया था: आयरलैंड के सिमी सिंह ने, जिन्होंने 2021 में दक्षिण अफ्रीका के खिलाफ नाबाद 100 बनाए थे, और बांग्लादेश के मेहदी हसन मिराज ने, जिनका भारत के खिलाफ नाबाद 100 इस शैली का तत्काल क्लासिक बन गया था। आठवें नंबर पर बल्लेबाजी करने वाले गेंदबाज होते हैं जो बल्लेबाजी कर सकते हैं, या आरक्षित रखे गए ऑलराउंडर; उनका सामना पुरानी गेंद, लगी हुई फील्ड और डेथ ओवरों से होता है, आमतौर पर निर्देश यह होता है कि पारी बनाने के बजाय तेज रन जोड़े जाएं। आठवें नंबर से शतक के लिए परिस्थितियों की एक विशिष्ट और दुर्लभ टक्कर चाहिए — एक शुरुआती पतन, एक लंबी पूंछ, एक रक्षा योग्य लक्ष्य, और एक ऐसा खिलाड़ी जिसके पास ऐसे प्रारूप में दो घंटे बल्लेबाजी करने की तकनीक और स्वभाव हो जो उसे आम तौर पर बीस मिनट देता है। शादाब की पारी में यह सब था, और एक ऐसा समापन जो इसके किसी भी पूर्ववर्ती के पास नहीं था: उनका शतक किसी हारे हुए कार्य को सजाने या स्कोर बढ़ाने के लिए नहीं था; उसने मैच जीता, जबकि क्रीज पर अंतिम जोड़ी थी। वे 13 चौकों और पांच छक्कों के साथ, लगभग 118 की स्ट्राइक दर पर समाप्त हुए, चार साथियों के जाने को झेलकर और लगभग पंद्रह ओवरों के जोखिम में एक ग्यारहवें नंबर के खिलाड़ी को संभालकर।\n\nदूसरा रिकॉर्ड साझेदारी का है, और उसका इतिहास अधिक समृद्ध है। दसवें विकेट के लिए 89 नाबाद रन किसी सफल वनडे रन-पीछे में अब तक की सबसे बड़ी अंतिम-विकेट साझेदारी है, जिसने खेल के इतिहास के सबसे प्रसिद्ध अंशों में से एक को पीछे छोड़ा। 11 जून 1975 को बर्मिंघम के एजबेस्टन में, सबसे पहले विश्व कप में, पाकिस्तान ने वेस्टइंडीज के खिलाफ 7 विकेट पर 266 रन बनाए थे — माजिद खान 60, मुश्ताक मोहम्मद 55 और वसीम राजा 58 — और सरफराज नवाज के चार विकेट लेने के बावजूद वेस्टइंडीज का नौवां विकेट 203 पर गिरा, जब 64 रन चाहिए थे। विकेटकीपर डेरिक मरे, जो 61 रन बनाकर नाबाद रहे, और तेज गेंदबाज एंडी रॉबर्ट्स, जो 24 रन बनाकर नाबाद रहे, ने 64 रनों की अटूट साझेदारी कर वेस्टइंडीज को दो गेंद शेष रहते घर पहुंचाया; पाकिस्तान ग्रुप चरण में ही बाहर हो गया, जबकि वेस्टइंडीज पहला विश्व कप जीत गया। वर्षों बाद रॉयटर्स को बताते हुए रॉबर्ट्स ने कहा था: \"पाकिस्तान ने हमारी मदद की क्योंकि उन्होंने अपने सर्वश्रेष्ठ गेंदबाज को पूरा करा दिया — सरफराज को। मुझे लगता है मैंने सरफराज की सिर्फ एक गेंद खेली। और सच कहूं, किसी भी चरण पर मुझे नहीं लगा कि हम हारेंगे।\" 51 वर्षों तक मरे और रॉबर्ट्स के बीच वह नाबाद 64 जीतने वाले पीछा में दसवें विकेट की सबसे बड़ी साझेदारी का मानक बना रहा। रविवार को शादाब और राउफ ने उसे 25 रनों से आगे बढ़ाया, गहन विश्लेषण, मजबूत फील्डिंग और बहुत अधिक एथलेटिक आक्रमणों के युग में। यह सभी वनडे क्रिकेट में चौथी सबसे बड़ी दसवें विकेट की साझेदारी भी है, 1984 में इंग्लैंड के खिलाफ वेस्टइंडीज के लिए विव रिचर्ड्स और माइकल होल्डिंग के नाबाद 106, 2009 में न्यूजीलैंड के खिलाफ पाकिस्तान के लिए मोहम्मद आमिर और सईद अजमल के 103, और 2011 में भारत के खिलाफ वेस्टइंडीज के लिए रवि रामपॉल और केमार रोच के नाबाद 99 के पीछे — और 2022 में नेपाल के खिलाफ यूएई के लिए आयान अफजल खान और हजरत बिलाल के नाबाद 83 से आगे।\n\nऐसी साझेदारियां इतनी दुर्लभ इसलिए हैं क्योंकि पीछा में दसवें विकेट की साझेदारी में विफलता के दो एकल बिंदु होते हैं: जमे हुए बल्लेबाज को जरूरी गति के करीब स्कोर करना होता है, जबकि वह गेंदबाजी का केवल एक हिस्सा खेलता है, और ग्यारहवें नंबर के खिलाड़ी को उन गेंदबाजों के खिलाफ ओवर दर ओवर टिकना होता है, जो खेल फिसलते देखकर स्टंप्स पर अपनी सर्वश्रेष्ठ गेंदों से हमला कर रहे होते हैं, जबकि इंग्लैंड को सिर्फ एक अच्छी गेंद चाहिए थी। वे उसके करीब भी पहुंचे — 97 रन पर शादाब के खिलाफ पगबाधा, रिव्यू में जितना समय लगा, मैच का जीतने वाला पल था — और उन्हें बचाने वाला बल्ले का अंदरूनी किनारा मिलीमीटरों में मापा गया था। पीछा जिताने वाली अंतिम-विकेट साझेदारियां प्रभुत्व पर नहीं बल्कि एकल गलती से निरंतर बचने पर बनती हैं।\n\nइंग्लैंड की ड्रामा में भूमिका को नहीं भूलना चाहिए, क्योंकि शाम के अधिकांश समय वे बेहतर टीम थे, और उनके आक्रमण ने 241 की रक्षा इतने कौशल से की कि पाकिस्तान 154 रन पर 9 विकेट हो गया — सौ शामों में से निन्यानवे में यह जीतने वाली स्थिति होती है। ब्रूक बाद में ईमानदारी से बताते रहे कि मैच कहां बना था। ब्रूक ने कहा, \"मुझे यकीन है कि शादाब कहेंगे कि यह (सबसे अच्छी पारियों में से एक) थी। यह एक अविश्वसनीय पारी थी। गेंदबाजों ने हमारे लिए असाधारण काम किया। हमने शायद पर्याप्त रन नहीं बनाए।\"\n\nपाकिस्तान के लिए परिणाम तत्काल और सुखद हैं। तीन मैचों में तीन जीतों ने उन्हें त्रिकोणीय तालिका के शीर्ष पर रखा है और 31 अक्टूबर को लाहौर में होने वाले फाइनल में पहले ही पहुंचा दिया है, अपने शेष ग्रुप मैच में कार्यभार और संयोजन का प्रबंधन करने की छूट के साथ। सीरीज की तीसरी टीम श्रीलंका और इंग्लैंड — दो मैचों में जीत से विहीन और तालिका के तल पर अटका — को फाइनल के दूसरे स्थान के लिए जूझना होगा, और इंग्लैंड का टूर्नामेंट अब श्रीलंका को हराने और अन्यत्र के नतीजों पर निर्भर है। लेकिन रविवार का बड़ा महत्व तालिका के बजाय ड्रेसिंग रूम में बैठता है। लाहौर में आयोजित यह त्रिकोणीय सीरीज पाकिस्तान के घरेलू सत्र का केंद्र बिंदु है, और उसे कई सत्रों से चल रहे ठीक इसी सवाल के परीक्षण मैदान के रूप में प्रस्तुत किया गया था: उस निचले क्रम के बल्लेबाज की अनुपस्थिति जिस पर विशेषज्ञों के जाने के बाद पीछा पूरा करने का भरोसा किया जा सके। शादाब, जिन्हें लंबे समय से बल्लेबाजी कर सकने वाले लेग-स्पिनर के रूप में महत्व दिया जाता रहा है, ने अब निश्चित सबूत पेश किया है कि उनकी बल्लेबाजी अकेले एक मैच उठा सकती है। आठवें या उससे नीचे के बल्लेबाज का सर्वोच्च स्कोर और सफल पीछे में दसवें विकेट की सबसे बड़ी साझेदारी — दोनों का एक ही पारी में, एक ही साझेदारी द्वारा, एक ही रात में दोबारा लिखा जाना उस बात का सांख्यिकीय हस्ताक्षर है कि यह मैच क्रिकेट मैच के सामान्य आकार से कितना बाहर गया, और यही कारण है कि रविवार की पारी का हवाला तब दिया जाएगा जब भी कोई पीछा नौ विकेट पर रनों की जरूरत के साथ पहुंचेगा, उसी वाक्य में जिसमें एजबेस्टन, 1975 होगा।"
